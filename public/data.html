<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Buy Data</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root { 
            --gold: #FFD700; 
            --gold-dim: #d4af37;
            --bg: #000000; 
            --card-bg: #111111; 
            --nater-red: #d32f2f;
        }
        * { box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: #FFFFFF; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 3px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.6rem; } 
        .site-part-2 { color: #FF3333; font-size: 1.2rem; letter-spacing: 3px; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 15px; }
        
        .data-card {
            background: var(--card-bg); 
            border: 2px solid #444; 
            border-radius: 20px;
            padding: 30px 20px; 
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 100%;
        }
        
        .network-btn {
            background: #1A1A1A; border: 2.5px solid #444; border-radius: 15px;
            padding: 15px 5px; cursor: pointer; transition: 0.3s; text-align: center;
            height: 100%; min-height: 110px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden;
        }
        .network-btn div { font-size: 1rem; color: #FFFFFF; margin-top: 8px; font-weight: 800; word-wrap: break-word; word-break: break-word; width: 100%; }
        .network-btn:hover, .network-btn.active { border-color: var(--gold); background: rgba(255, 215, 0, 0.15); transform: translateY(-3px); }
        .network-btn.active div { color: var(--gold); font-weight: 900; }
        
        .input-group-custom {
            background: #1A1A1A; border: 2px solid var(--gold); border-radius: 15px; 
            padding: 15px 20px; margin-bottom: 25px; width: 100%;
        }
        
        .input-group-custom label, .amount-label {
            display: block; font-size: 1rem; color: var(--gold); font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
        }
        
        .input-group-custom input {
            background: transparent; border: none; color: #FFFFFF; width: 100%;
            font-size: 1.2rem; font-weight: 700; outline: none; letter-spacing: 2px;
        }
        
        .plan-card {
            background: #1A1A1A; border: 2px solid #444; border-radius: 15px;
            padding: 15px 10px; cursor: pointer; transition: 0.3s; height: 100%;
            min-height: 100px; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; overflow: hidden;
        }
        .plan-card .plan-name { font-size: 0.85rem; font-weight: 800; color: #FFFFFF; line-height: 1.2; word-wrap: break-word; word-break: break-word; white-space: normal; width: 100%; margin-bottom: 5px; }
        .plan-card .plan-price { font-size: 1.1rem; font-weight: 900; color: var(--gold); }
        .plan-card:hover, .plan-card.active { border-color: var(--gold); background: rgba(255, 215, 0, 0.15); }
        
        .total-box {
            background: #1A1A1A; border-left: 5px solid var(--gold); padding: 15px 25px;
            border-radius: 0 15px 15px 0; margin-bottom: 25px;
        }
        
        .btn-buy {
            background: var(--gold); color: #000000; font-weight: 900; border-radius: 15px;
            padding: 20px; width: 100%; border: none; font-size: 1.3rem; letter-spacing: 1px;
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-buy:hover:not(:disabled) { background: #FFFFFF; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.3); }
        .btn-buy:disabled { background: #555; color: #888; transform: none; box-shadow: none; cursor: not-allowed; }
        
        .footer-text { color: #FFFFFF; font-size: 0.9rem; font-weight: 600; opacity: 0.7; }

        /* ENTERPRISE REFRACTIVE SPINNER */
        .swal-reflective-spinner {
            position: relative; width: 90px; height: 90px; margin: 20px auto; border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(255,215,0,0.1) 0%, rgba(255,255,255,0.9) 15%, var(--gold) 30%, rgba(255,215,0,0.2) 50%, var(--gold-dim) 70%, rgba(255,255,255,0.8) 85%, rgba(255,215,0,0.1) 100%);
            animation: spinSwalReflect 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite, flashGlow 2s alternate infinite;
            box-shadow: 0 0 40px rgba(255,215,0,0.5);
        }
        .swal-reflective-spinner::before {
            content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #050505 100%);
            border-radius: 50%; border: 1px solid rgba(255,215,0,0.3); z-index: 1;
        }
        .swal-inner-icon {
            position: absolute; z-index: 2; top: 50%; left: 50%; font-size: 2rem; color: var(--gold);
            text-shadow: 0 0 20px var(--gold), 0 0 40px rgba(255,255,255,0.6);
            animation: counterSpinSwal 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spinSwalReflect { 100% { transform: rotate(360deg); } }
        @keyframes counterSpinSwal { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
        @keyframes flashGlow { 0% { box-shadow: 0 0 20px rgba(255,215,0,0.3); filter: brightness(1); } 100% { box-shadow: 0 0 60px rgba(255,215,0,0.8); filter: brightness(1.3); } }

        /* BURST STARS EFFECTS */
        .burst-star {
            position: fixed; top: 50%; left: 50%; z-index: 9999; pointer-events: none;
            color: var(--gold); font-size: 1.5rem; text-shadow: 0 0 10px rgba(255,215,0,0.8);
            animation: starExplode 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .burst-star.failed { color: var(--nater-red); text-shadow: 0 0 10px rgba(211,47,47,0.8); }
        @keyframes starExplode {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-warning rounded-pill px-4" style="font-weight: 800;">Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold); font-size: 2.5rem;">BUY DATA</h1>
    
    <div class="data-card">
        <label class="amount-label text-center mb-3">1. Select Network</label>
        
        <div class="row g-2 mb-4">
            <div class="col-6 col-md-3">
                <div class="network-btn active" id="btn-mtn-data" onclick="selectNetwork(this, 'mtn-data')">
                    <i class="fas fa-signal fa-2x mb-2" style="color: #ffcc00;"></i>
                    <div>MTN</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="network-btn" id="btn-airtel-data" onclick="selectNetwork(this, 'airtel-data')">
                    <i class="fas fa-signal fa-2x mb-2" style="color: #ff0000;"></i>
                    <div>Airtel</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="network-btn" id="btn-glo-data" onclick="selectNetwork(this, 'glo-data')">
                    <i class="fas fa-signal fa-2x mb-2" style="color: #00ff00;"></i>
                    <div>Glo</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="network-btn" id="btn-etisalat-data" onclick="selectNetwork(this, 'etisalat-data')">
                    <i class="fas fa-signal fa-2x mb-2" style="color: #00bfff;"></i>
                    <div>9Mobile</div>
                </div>
            </div>
        </div>
        
        <div class="input-group-custom">
            <label>PHONE NUMBER <span style="font-size: 0.7rem; color: #888; text-transform: none; float: right;">Auto-detects network</span></label>
            <input type="tel" id="phoneNumber" placeholder="e.g. 08012345678" maxlength="11" oninput="detectNetwork()">
        </div>
        
        <label class="amount-label text-center mb-3">2. Select Data Plan</label>
        
        <div class="row g-2 mb-4" id="planContainer">
            <div class="col-12 text-center py-4">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--gold);"></i>
                <p class="mt-2 text-muted" style="font-weight: 600;">NATER-PAY is syncing data plans...</p>
            </div>
        </div>
        
        <div class="input-group-custom" style="border-color: #555;">
            <label style="color: #bbb;"><i class="fas fa-lock me-1"></i> SECURITY PIN</label>
            <input type="password" id="withdrawalPin" placeholder="Enter your 4-digit PIN" maxlength="4" style="letter-spacing: 5px;">
        </div>
        
        <div class="total-box mb-4">
            <span class="amount-label" style="margin-bottom: 4px;">TOTAL AMOUNT DUE</span>
            <div class="h2 fw-bold" style="color: #FFFFFF;" id="totalAmount">₦0.00</div>
        </div>
        
        <button class="btn-buy" id="btnBuy" onclick="buyData()" disabled>
            <i class="fas fa-spinner fa-spin me-2"></i> SYNCING PLANS...
        </button>
    </div>
    
    <div class="text-center footer-text mb-5">
        <p class="mb-1">Data Subscription Services</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    let selectedNetwork = 'mtn-data';
    let selectedPlan = null;
    let selectedAmount = 0;
    
    // NIGERIAN TELECOM PREFIX AUTO-DETECTOR
    const networkPrefixes = {
        'mtn-data': ['0803','0806','0703','0706','0813','0816','0810','0814','0903','0906','0913','0916'],
        'airtel-data': ['0802','0808','0708','0812','0701','0902','0901','0907','0912'],
        'glo-data': ['0805','0807','0705','0815','0811','0905','0915'],
        'etisalat-data': ['0809','0818','0817','0909','0908']
    };

    function detectNetwork() {
        const phoneInput = document.getElementById('phoneNumber').value;
        if (phoneInput.length >= 4) {
            const prefix = phoneInput.substring(0, 4);
            let detectedNetwork = null;

            for (const [network, prefixes] of Object.entries(networkPrefixes)) {
                if (prefixes.includes(prefix)) {
                    detectedNetwork = network;
                    break;
                }
            }

            if (detectedNetwork && detectedNetwork !== selectedNetwork) {
                const btn = document.getElementById(`btn-${detectedNetwork}`);
                if (btn) {
                    selectNetwork(btn, detectedNetwork);
                    Swal.fire({
                        toast: true, position: 'top-end', showConfirmButton: false, timer: 1500,
                        icon: 'info', title: `Network auto-switched to ${detectedNetwork.split('-')[0].toUpperCase()}`,
                        background: '#111', color: '#FFD700'
                    });
                }
            }
        }
    }

    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 100; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    function triggerStarBurst(isSuccess = true) {
        const starCount = 40;
        const body = document.body;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.innerHTML = '★';
            star.className = isSuccess ? 'burst-star' : 'burst-star failed';
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 300 + 100;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            const rot = Math.random() * 720 - 360;
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);
            star.style.setProperty('--rot', `${rot}deg`);
            body.appendChild(star);
            setTimeout(() => { star.remove(); }, 1000);
        }
    }
    
    function selectNetwork(element, network) {
        document.querySelectorAll('.network-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedNetwork = network;
        fetchLivePlans(network);
    }
    
    function selectPlan(element, variationCode, amount) {
        document.querySelectorAll('.plan-card').forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        selectedPlan = variationCode;
        selectedAmount = amount;
        document.getElementById('totalAmount').innerText = '₦' + amount.toLocaleString();
    }

    async function fetchLivePlans(network) {
        const container = document.getElementById('planContainer');
        const btnBuy = document.getElementById('btnBuy');
        
        container.innerHTML = `
            <div class="col-12 text-center py-4">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--gold);"></i>
                <p class="mt-2 text-muted" style="font-weight: 600;">NATER-PAY is syncing data plans...</p>
            </div>
        `;
        btnBuy.disabled = true;
        btnBuy.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> SYNCING PLANS...';
        document.getElementById('totalAmount').innerText = '₦0.00';
        selectedPlan = null;
        selectedAmount = 0;

        const authToken = localStorage.getItem("naterpay_token");
        
        try {
            const response = await fetch(`/api/vtu/variations?serviceID=${network}`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const data = await response.json();
            
            if (data.success && data.variations && data.variations.length > 0) {
                let html = '';
                
                data.variations.forEach((plan, index) => {
                    const isActive = index === 0 ? 'active' : '';
                    const planAmount = parseFloat(plan.variation_amount);
                    
                    if (index === 0) {
                        selectedPlan = plan.variation_code;
                        selectedAmount = planAmount;
                        document.getElementById('totalAmount').innerText = '₦' + planAmount.toLocaleString();
                    }
                    
                    html += `
                        <div class="col-6 col-md-4">
                            <div class="plan-card ${isActive}" onclick="selectPlan(this, '${plan.variation_code}', ${planAmount})">
                                <div class="plan-name">${plan.name}</div>
                                <div class="plan-price">₦${planAmount.toLocaleString()}</div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                btnBuy.disabled = false;
                btnBuy.innerHTML = '<i class="fas fa-wifi me-2"></i> PURCHASE DATA';
            } else {
                container.innerHTML = `<div class="col-12 text-center py-4 text-danger"><i class="fas fa-exclamation-triangle fa-2x mb-2"></i><p>Unable to load data plans at this moment.</p></div>`;
            }
        } catch (error) {
            container.innerHTML = `<div class="col-12 text-center py-4 text-danger"><i class="fas fa-wifi fa-2x mb-2"></i><p>Network Error connecting to server.</p></div>`;
        }
    }
    
    async function buyData() {
        const phoneNumber = document.getElementById('phoneNumber').value;
        const pin = document.getElementById('withdrawalPin').value;
        
        if (!phoneNumber || phoneNumber.length < 10) {
            Swal.fire({ icon: 'error', title: 'Invalid Phone Number', text: 'Please enter a valid phone number.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            return;
        }
        if (!pin || pin.length !== 4) {
            Swal.fire({ icon: 'error', title: 'Invalid PIN', text: 'Please enter your 4-digit security PIN.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            return;
        }
        if (!selectedPlan) {
             Swal.fire({ icon: 'warning', title: 'No Plan Selected', text: 'Please wait for plans to load and select one.', confirmButtonColor: '#FFD700', background: '#111111', color: '#FFFFFF' });
            return;
        }

        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) { window.location.href = '/index.html'; return; }
        
        const btnBuy = document.getElementById('btnBuy');
        btnBuy.disabled = true;

        try {
            // ENTERPRISE HOLOGRAPHIC LOADER
            Swal.fire({
                title: 'Securing Protocol...',
                html: `
                    <div class="swal-reflective-spinner">
                        <i class="fas fa-satellite-dish swal-inner-icon"></i>
                    </div>
                    <span style="color:#aaa; font-weight:600; font-size:0.85rem;">Encrypting payload & transmitting to network...</span>
                `,
                allowOutsideClick: false,
                showConfirmButton: false,
                background: '#111111', color: '#FFD700'
            });
            
            const res = await fetch('/api/vtu/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ phone: phoneNumber, network: selectedNetwork, plan: selectedPlan, amount: selectedAmount, pin })
            });
            
            const data = await res.json();
            
            if (data.success) {
                triggerStarBurst(true); 
                Swal.fire({
                    icon: 'success', title: 'Transmission Successful!',
                    html: `<div style="font-size: 1.1rem; color: #FFF;">Data bundle has been successfully sent to ${phoneNumber}.</div>`,
                    confirmButtonColor: '#FFD700', background: '#111111', color: '#FFFFFF'
                }).then(() => { window.location.href = '/dashboard.html'; });
            } else {
                triggerStarBurst(false); 
                let msg = data.message || "An error occurred.";
                if (msg.toLowerCase().includes("vtpass") || msg.toLowerCase().includes("system error") || msg.toLowerCase().includes("db error")) {
                    msg = "We encountered a temporary issue processing your purchase. Please verify your details or try again later.";
                }
                Swal.fire({ icon: 'error', title: 'Transmission Failed', text: msg, confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
                
                btnBuy.disabled = false;
            }
        } catch (error) {
            triggerStarBurst(false); 
            Swal.fire({ icon: 'error', title: 'Network Connection', text: 'Please check your internet connection and try again.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            btnBuy.disabled = false;
        }
    }
    
    window.onload = () => {
        initStars();
        fetchLivePlans('mtn-data');
    };
</script>

</body>
</html>
