<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Buy Data</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card-bg: rgba(20, 20, 20, 0.95); }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 2.5px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.4rem; } 
        .site-part-2 { color: #d32f2f; font-size: 1rem; letter-spacing: 3px; }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        
        .data-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 20px;
            padding: 40px; margin-bottom: 30px;
        }
        
        .network-btn {
            background: rgba(30,30,30,0.95); border: 2px solid #444; border-radius: 15px;
            padding: 20px; cursor: pointer; transition: 0.3s; text-align: center;
        }
        .network-btn:hover, .network-btn.active {
            border-color: var(--gold); background: rgba(212,175,55,0.1);
            transform: translateY(-3px);
        }
        
        .input-group-custom {
            background: rgba(0,0,0,0.6); border: 1.5px solid rgba(212,175,55,0.35);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
        }
        .input-group-custom label {
            display: block; font-size: 0.75rem; color: var(--gold); font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
        }
        .input-group-custom input, .input-group-custom select {
            background: transparent; border: none; color: white; width: 100%;
            font-size: 1.1rem; font-weight: 700; outline: none;
        }
        
        .plan-card {
            background: rgba(30,30,30,0.95); border: 1px solid #444; border-radius: 15px;
            padding: 15px; cursor: pointer; transition: 0.3s; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .plan-card:hover, .plan-card.active {
            border-color: var(--gold); background: rgba(212,175,55,0.1);
        }
        
        .btn-buy {
            background: var(--gold); color: black; font-weight: 900; border-radius: 15px;
            padding: 18px; width: 100%; border: none; font-size: 1.1rem; letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-buy:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
        .btn-buy:disabled { background: #555; color: #888; transform: none; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4">Back to Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold);">BUY DATA</h1>
    
    <div class="data-card">
        <h5 class="mb-3" style="font-family: 'Cinzel'; color: var(--gold);">SELECT NETWORK</h5>
        
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="network-btn active" onclick="selectNetwork(this, 'mtn-data')">
                    <i class="fas fa-signal fa-2x mb-2" style="color: #ffcc00;"></i>
                    <div class="fw-bold">MTN</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="network-btn" onclick="selectNetwork(this, 'airtel-data')">
                    <i class="fas fa-signal fa-2x mb-2" style="color: #ff0000;"></i>
                    <div class="fw-bold">Airtel</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="network-btn" onclick="selectNetwork(this, 'glo-data')">
                    <i class="fas fa-signal fa-2x mb-2" style="color: #00ff00;"></i>
                    <div class="fw-bold">Glo</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="network-btn" onclick="selectNetwork(this, 'etisalat-data')">
                    <i class="fas fa-signal fa-2x mb-2" style="color: #00bfff;"></i>
                    <div class="fw-bold">9mobile</div>
                </div>
            </div>
        </div>
        
        <div class="input-group-custom">
            <label>PHONE NUMBER</label>
            <input type="tel" id="phoneNumber" placeholder="e.g. 08012345678">
        </div>
        
        <h5 class="mb-3" style="font-family: 'Cinzel'; color: var(--gold);">SELECT LIVE DATA PLAN</h5>
        
        <div class="row g-3 mb-4" id="planContainer">
            <div class="col-12 text-center py-4">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--gold);"></i>
                <p class="mt-2 text-muted">Connecting to VTpass Gateway...</p>
            </div>
        </div>
        
        <div class="input-group-custom">
            <label>WITHDRAWAL PIN</label>
            <input type="password" id="withdrawalPin" placeholder="Enter your 4-digit PIN" maxlength="4">
        </div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <small class="text-muted">TOTAL AMOUNT</small>
                <div class="h3 fw-bold" style="color: var(--gold);" id="totalAmount">₦0.00</div>
            </div>
        </div>
        
        <button class="btn-buy" id="btnBuy" onclick="buyData()" disabled>
            <i class="fas fa-wifi me-2"></i> WAITING FOR VT-PASS...
        </button>
    </div>
    
    <div class="text-center text-muted small">
        <p class="mb-1">Data bundles powered by VTpass Live API</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    let selectedNetwork = 'mtn-data';
    let selectedPlan = null;
    let selectedAmount = 0;
    
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 150; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    function selectNetwork(element, network) {
        document.querySelectorAll('.network-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedNetwork = network;
        
        // Fetch new plans for the selected network
        fetchLivePlans(network);
    }
    
    function selectPlan(element, variationCode, amount) {
        document.querySelectorAll('.plan-card').forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        selectedPlan = variationCode;
        selectedAmount = amount;
        document.getElementById('totalAmount').innerText = '₦' + amount.toLocaleString();
    }

    // NEW FUNCTION: Fetch real plans from backend (which fetches from VTpass)
    async function fetchLivePlans(network) {
        const container = document.getElementById('planContainer');
        const btnBuy = document.getElementById('btnBuy');
        
        container.innerHTML = `
            <div class="col-12 text-center py-4">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--gold);"></i>
                <p class="mt-2 text-muted">Syncing with VTpass Servers...</p>
            </div>
        `;
        btnBuy.disabled = true;
        btnBuy.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> WAITING FOR VT-PASS...';
        document.getElementById('totalAmount').innerText = '₦0.00';
        selectedPlan = null;
        selectedAmount = 0;

        const authToken = localStorage.getItem("naterpay_token");
        
        try {
            // FIXED: Pointing to /api/vtu/variations?serviceID=
            const response = await fetch(`/api/vtu/variations?serviceID=${network}`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const data = await response.json();
            
            // FIXED: Checking for data.variations instead of data.plans
            if (data.success && data.variations && data.variations.length > 0) {
                let html = '';
                
                data.variations.forEach((plan, index) => {
                    const isActive = index === 0 ? 'active' : '';
                    const planAmount = parseFloat(plan.variation_amount);
                    
                    // Auto-select the very first plan in the list
                    if (index === 0) {
                        selectedPlan = plan.variation_code;
                        selectedAmount = planAmount;
                        document.getElementById('totalAmount').innerText = '₦' + planAmount.toLocaleString();
                    }
                    
                    html += `
                        <div class="col-6 col-md-4">
                            <div class="plan-card ${isActive}" onclick="selectPlan(this, '${plan.variation_code}', ${planAmount})">
                                <div class="fw-bold mb-1" style="font-size: 0.85rem; line-height: 1.2;">${plan.name}</div>
                                <div class="text-warning fw-bold">₦${planAmount.toLocaleString()}</div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                btnBuy.disabled = false;
                btnBuy.innerHTML = '<i class="fas fa-wifi me-2"></i> PURCHASE DATA';
            } else {
                container.innerHTML = `<div class="col-12 text-center py-4 text-danger"><i class="fas fa-exclamation-triangle fa-2x mb-2"></i><p>VTpass API Error: Could not load data plans.</p></div>`;
            }
        } catch (error) {
            container.innerHTML = `<div class="col-12 text-center py-4 text-danger"><i class="fas fa-wifi fa-2x mb-2"></i><p>Network Error connecting to server.</p></div>`;
        }
    }
    
    async function buyData() {
        const phoneNumber = document.getElementById('phoneNumber').value;
        const pin = document.getElementById('withdrawalPin').value;
        
        if (!phoneNumber || phoneNumber.length < 11) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Phone Number',
                text: 'Please enter a valid phone number',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        if (!pin || pin.length !== 4) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid PIN',
                text: 'Please enter your 4-digit withdrawal PIN',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        if (!selectedPlan) {
             Swal.fire({
                icon: 'warning',
                title: 'No Plan Selected',
                text: 'Please wait for VTpass to load the plans and select one.',
                confirmButtonColor: '#d4af37',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }

        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            Swal.fire({
                title: 'Processing...',
                text: 'Transmitting purchase request to VTpass',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                background: '#0a0a0a',
                color: '#fff'
            });
            
            const res = await fetch('/api/vtu/data', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ 
                    phone: phoneNumber,
                    network: selectedNetwork,
                    plan: selectedPlan,
                    amount: selectedAmount,
                    pin
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Data Purchase Successful',
                    text: `Data has been sent to ${phoneNumber}`,
                    confirmButtonColor: '#d4af37',
                    background: '#0a0a0a',
                    color: '#fff'
                }).then(() => {
                    window.location.href = '/dashboard.html';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Purchase Failed',
                    text: data.message,
                    confirmButtonColor: '#d32f2f',
                    background: '#0a0a0a',
                    color: '#fff'
                });
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Processing Error',
                text: 'Unable to process data purchase. Please try again.',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
        }
    }
    
    // Start by fetching MTN plans automatically on load
    window.onload = () => {
        initStars();
        fetchLivePlans('mtn-data');
    };
</script>

</body>
</html>
