<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Admin Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card-bg: rgba(20, 20, 20, 0.95); }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; min-height: 100vh; }
        .admin-card { background: var(--card-bg); border: 1px solid #333; border-radius: 20px; padding: 30px; margin-bottom: 30px; }
        .stat-box { background: rgba(30,30,30,0.95); border: 1px solid #444; border-radius: 15px; padding: 25px; text-align: center; }
        .stat-number { font-size: 2rem; color: var(--gold); font-weight: 900; }
        .table { color: #eee; }
        .btn-gold { background: var(--gold); color: black; font-weight: 800; }
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-5" style="color: var(--gold);">ADMIN TERMINAL</h1>
    
    <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="stat-box"><small>TOTAL USERS</small><div class="stat-number" id="statUsers">0</div></div></div>
        <div class="col-md-3"><div class="stat-box"><small>TRANSACTIONS</small><div class="stat-number" id="statTransactions">0</div></div></div>
        <div class="col-md-3"><div class="stat-box"><small>PENDING KYC</small><div class="stat-number" id="statKYC">0</div></div></div>
        <div class="col-md-3"><div class="stat-box"><small>OPEN TICKETS</small><div class="stat-number" id="statTickets">0</div></div></div>
    </div>

    <div class="admin-card">
        <h5 style="color: var(--gold);">TRANSACTION MONITORING</h5>
        <div class="table-responsive">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>USER</th><th>AMOUNT</th><th>STATUS</th><th>PROVIDER</th><th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="transactionsTable">
                    <tr><td colspan="5" class="text-center">Loading transactions...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function loadAdminData() {
        const authToken = localStorage.getItem("naterpay_token");
        try {
            const res = await fetch('/api/admin/analytics', { headers: { 'Authorization': `Bearer ${authToken}` } });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('statUsers').innerText = data.summary?.totalUsers || 0;
                document.getElementById('statTransactions').innerText = data.summary?.totalTransactions || 0;
                
                const tbody = document.getElementById('transactionsTable');
                tbody.innerHTML = '';
                
                // Assuming data.transactions is sent from the backend
                data.transactions.forEach(tx => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${tx.user}</td>
                            <td>₦${tx.amount}</td>
                            <td><span class="badge ${tx.status === 'success' ? 'bg-success' : 'bg-warning'}">${tx.status}</span></td>
                            <td>${tx.provider}</td>
                            <td>
                                ${tx.status !== 'success' ? 
                                `<button class="btn btn-sm btn-gold" onclick="verifyPayment('${tx._id}')">Verify Now</button>` 
                                : 'Verified'}
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (e) { console.error(e); }
    }

    async function verifyPayment(txId) {
        const authToken = localStorage.getItem("naterpay_token");
        const res = await fetch('/api/admin/verify-transaction', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
            body: JSON.stringify({ txId })
        });
        const data = await res.json();
        if (data.success) {
            Swal.fire('Success', 'Wallet credited successfully!', 'success');
            loadAdminData(); // Refresh UI
        } else {
            Swal.fire('Error', data.message, 'error');
        }
    }

    window.onload = loadAdminData;
</script>
</body>
</html>
