<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Withdraw Funds</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card-bg: rgba(20, 20, 20, 0.95); }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 2.5px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.4rem; } 
        .site-part-2 { color: #d32f2f; font-size: 1rem; letter-spacing: 3px; }

        .container { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        
        .withdraw-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 20px;
            padding: 40px; margin-bottom: 30px;
        }
        
        .balance-display {
            background: linear-gradient(145deg, #111 0%, #222 100%); border: 2px solid var(--gold);
            border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 30px;
        }
        .balance-amount { font-family: 'Cinzel'; font-size: 2.5rem; color: var(--gold); font-weight: 900; }
        
        .input-group-custom {
            background: rgba(0,0,0,0.6); border: 1.5px solid rgba(212,175,55,0.35);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
        }
        .input-group-custom label {
            display: block; font-size: 0.75rem; color: var(--gold); font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
        }
        .input-group-custom input, .input-group-custom select {
            background: transparent; border: none; color: white; width: 100%;
            font-size: 1.1rem; font-weight: 700; outline: none;
        }
        
        .btn-withdraw {
            background: var(--gold); color: black; font-weight: 900; border-radius: 15px;
            padding: 18px; width: 100%; border: none; font-size: 1.1rem; letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-withdraw:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
        
        .info-box {
            background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
            border-radius: 15px; padding: 20px; margin-top: 20px;
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4">Back to Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold);">WITHDRAW FUNDS</h1>
    
    <div class="balance-display">
        <small class="text-muted">AVAILABLE BALANCE</small>
        <div class="balance-amount" id="availableBalance">₦0.00</div>
    </div>
    
    <div class="withdraw-card">
        <div class="input-group-custom">
            <label>WITHDRAWAL AMOUNT (₦)</label>
            <input type="number" id="withdrawAmount" placeholder="Enter amount" min="1000">
        </div>
        
        <div class="input-group-custom">
            <label>BANK NAME</label>
            <select id="bankName">
                <option value="">Select Bank</option>
                <option value="access">Access Bank</option>
                <option value="gtbank">Guaranty Trust Bank</option>
                <option value="firstbank">First Bank</option>
                <option value="zenith">Zenith Bank</option>
                <option value="uba">UBA</option>
                <option value="kuda">Kuda Bank</option>
                <option value="polaris">Polaris Bank</option>
                <option value="stanbic">Stanbic IBTC</option>
                <option value="wema">Wema Bank</option>
                <option value="other">Other</option>
            </select>
        </div>
        
        <div class="input-group-custom">
            <label>ACCOUNT NUMBER</label>
            <input type="text" id="accountNumber" placeholder="10-digit account number" maxlength="10">
        </div>
        
        <div class="input-group-custom">
            <label>ACCOUNT NAME</label>
            <input type="text" id="accountName" placeholder="Account holder name">
        </div>
        
        <div class="input-group-custom">
            <label>WITHDRAWAL PIN</label>
            <input type="password" id="withdrawalPin" placeholder="Enter your 4-digit PIN" maxlength="4">
        </div>
        
        <button class="btn-withdraw" onclick="processWithdrawal()">
            <i class="fas fa-university me-2"></i> PROCESS WITHDRAWAL
        </button>
        
        <div class="info-box">
            <h6 style="color: var(--gold); font-weight: 700; margin-bottom: 15px;">WITHDRAWAL INFORMATION</h6>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Minimum Withdrawal:</span>
                <span class="fw-bold">₦1,000</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Maximum Withdrawal:</span>
                <span class="fw-bold">₦500,000</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">Processing Time:</span>
                <span class="fw-bold">Instant - 24 hours</span>
            </div>
        </div>
    </div>
    
    <div class="text-center text-muted small">
        <p class="mb-1">Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 150; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    async function loadBalance() {
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            const res = await fetch('/api/user/dashboard-data', {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('availableBalance').innerText = '₦' + Number(data.balance || 0).toLocaleString(undefined, {minimumFractionDigits:2});
            }
        } catch (e) {
            console.error('Failed to load balance');
        }
    }
    
    async function processWithdrawal() {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const bankName = document.getElementById('bankName').value;
        const accountNumber = document.getElementById('accountNumber').value;
        const accountName = document.getElementById('accountName').value;
        const pin = document.getElementById('withdrawalPin').value;
        
        if (!amount || amount < 1000) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Amount',
                text: 'Minimum withdrawal amount is ₦1,000',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        if (amount > 500000) {
            Swal.fire({
                icon: 'error',
                title: 'Amount Exceeded',
                text: 'Maximum withdrawal amount is ₦500,000',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        if (!bankName || !accountNumber || !accountName || !pin) {
            Swal.fire({
                icon: 'error',
                title: 'Missing Information',
                text: 'Please fill in all required fields',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        if (accountNumber.length !== 10) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Account Number',
                text: 'Account number must be 10 digits',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        if (pin.length !== 4) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid PIN',
                text: 'PIN must be 4 digits',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            Swal.fire({
                title: 'Processing...',
                text: 'Initiating withdrawal',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                background: '#0a0a0a',
                color: '#fff'
            });
            
            const res = await fetch('/api/wallet/withdraw', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ 
                    amount, 
                    bankAccount: { bankName, accountNumber, accountName },
                    pin 
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Withdrawal Successful',
                    text: `₦${amount.toLocaleString()} has been withdrawn to your bank account`,
                    confirmButtonColor: '#d4af37',
                    background: '#0a0a0a',
                    color: '#fff'
                }).then(() => {
                    window.location.href = '/dashboard.html';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Withdrawal Failed',
                    text: data.message,
                    confirmButtonColor: '#d32f2f',
                    background: '#0a0a0a',
                    color: '#fff'
                });
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Processing Error',
                text: 'Unable to process withdrawal. Please try again.',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
        }
    }
    
    window.onload = () => {
        initStars();
        loadBalance();
    };
</script>

</body>
</html>
