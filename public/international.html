<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Global Airtime</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root { --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.4); --bg: #030303; --card-bg: rgba(15, 15, 15, 0.95); --global-blue: #00D4FF; }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(10px);
        }

        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; line-height: 0.85;}
        .site-part-1 { color: var(--gold); font-size: 1.6rem; text-shadow: 0 0 10px var(--gold-glow); } 
        .site-part-2 { color: #d32f2f; font-size: 1.1rem; letter-spacing: 3px; }

        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        
        .header-title { font-family: 'Cinzel', serif; color: var(--global-blue); font-weight: 900; text-align: center; margin-bottom: 30px; font-size: 2.2rem; text-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }

        .balance-display {
            background: linear-gradient(145deg, #111 0%, #1a1a1a 100%); border: 2px solid var(--gold);
            border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px var(--gold-glow);
        }
        .balance-amount { font-family: 'Cinzel'; font-size: 2.5rem; color: var(--gold); font-weight: 900; text-shadow: 0 0 10px var(--gold-glow); margin-top: 5px; }

        .vtu-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 25px;
            padding: 40px 30px; margin-bottom: 30px; backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden;
        }
        .vtu-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, var(--global-blue), transparent); }

        .input-group-custom { background: #111; border: 1.5px solid #333; border-radius: 15px; padding: 15px 20px; margin-bottom: 20px; transition: 0.3s; }
        .input-group-custom:focus-within { border-color: var(--global-blue); box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }
        .input-group-custom label { display: block; font-size: 0.75rem; color: var(--gold); font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .input-group-custom input, .input-group-custom select { background: transparent; border: none; color: white; width: 100%; font-size: 1.1rem; font-weight: 700; outline: none; }
        .input-group-custom select option { background: #111; color: white; font-size: 1rem; }

        /* DYNAMIC GRID STYLING FOR NETWORKS */
        .plan-card {
            background: #0a0a0a; border: 1.5px solid #333; border-radius: 12px;
            padding: 15px 10px; text-align: center; cursor: pointer; transition: 0.3s;
            height: 100%; min-height: 90px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; overflow: hidden;
        }
        .plan-card:hover { border-color: var(--global-blue); background: rgba(0, 212, 255, 0.05); }
        .plan-card.active { border-color: var(--global-blue); background: rgba(0, 212, 255, 0.15); box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }
        .plan-name { 
            font-size: 0.85rem; font-weight: 800; color: var(--global-blue); width: 100%; 
            white-space: normal; word-wrap: break-word; overflow-wrap: break-word; 
        }
        
        #plansGrid { max-height: 350px; overflow-y: auto; overflow-x: hidden; padding-right: 5px; margin-top: 10px; }
        #plansGrid::-webkit-scrollbar { width: 5px; }
        #plansGrid::-webkit-scrollbar-thumb { background: var(--global-blue); border-radius: 10px; }

        .btn-pay {
            background: var(--global-blue); color: black; font-weight: 900; border-radius: 15px;
            padding: 20px; width: 100%; border: none; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s;
        }
        .btn-pay:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,255,255,0.2); }
        
        .loading-text { text-align: center; color: var(--gold); font-weight: 700; font-size: 0.9rem; margin-top: -10px; margin-bottom: 20px; display: none; }

        /* SWEETALERT REFRACTIVE LOADER */
        .swal-reflective-spinner {
            position: relative; width: 100px; height: 100px; margin: 20px auto; border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(0, 212, 255, 0.1) 0%, rgba(255,255,255,0.9) 15%, var(--global-blue) 30%, rgba(0, 212, 255, 0.2) 50%, #0099cc 70%, rgba(255,255,255,0.7) 85%, rgba(0, 212, 255, 0.1) 100%);
            animation: spinSwalReflect 2s linear infinite; box-shadow: 0 0 35px rgba(0, 212, 255, 0.35);
        }
        .swal-reflective-spinner::before {
            content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #0d0d0d 100%); border-radius: 50%; border: 1px solid rgba(0, 212, 255, 0.15); z-index: 1;
        }
        .swal-inner-icon {
            position: absolute; z-index: 2; top: 50%; left: 50%; font-size: 2.2rem; color: var(--global-blue);
            text-shadow: 0 0 15px var(--global-blue), 0 0 30px rgba(255,255,255,0.4); animation: counterSpinSwal 2s linear infinite;
        }
        @keyframes spinSwalReflect { 100% { transform: rotate(360deg); } }
        @keyframes counterSpinSwal { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4 fw-bold"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
</header>

<div class="container">
    <div class="text-center">
        <h1 class="header-title"><i class="fas fa-globe me-2"></i> GLOBAL AIRTIME</h1>
    </div>
    
    <div class="balance-display">
        <small class="text-secondary fw-bold" style="letter-spacing: 2px;">SECURE WALLET BALANCE</small>
        <div class="balance-amount" id="walletBalance">₦0.00</div>
    </div>
    
    <div class="vtu-card">
        
        <div class="loading-text" id="countriesLoader"><i class="fas fa-spinner fa-spin me-2"></i> Syncing Worldwide Countries...</div>

        <!-- 1. Country Selection -->
        <div class="input-group-custom">
            <label>Select Destination Country</label>
            <select id="countrySelect" onchange="fetchOperators()">
                <option value="">Awaiting Global Sync...</option>
            </select>
        </div>

        <div class="loading-text" id="operatorsLoader"><i class="fas fa-spinner fa-spin me-2"></i> Fetching Local Networks...</div>

        <!-- 2. Dynamic Grid for Operators/Networks -->
        <div class="input-group-custom" id="operatorsWrapper" style="display: none; border-color: #222; background: transparent; padding: 0;">
            <label style="padding-left: 5px;">Select Target Network</label>
            <div id="plansGrid" class="row g-2 mt-2">
                <!-- Network boxes injected here -->
            </div>
        </div>
        
        <input type="hidden" id="selectedOperator"> 

        <!-- 3. Phone & Amount -->
        <div class="input-group-custom">
            <label>International Phone Number</label>
            <input type="tel" id="targetPhone" placeholder="e.g. +2338000000000" oninput="this.value = this.value.replace(/[^0-9+]/g, '')">
        </div>

        <div class="input-group-custom">
            <label>Amount (₦)</label>
            <input type="number" id="targetAmount" placeholder="Enter amount in Naira">
            <small class="text-muted d-block mt-2" style="font-size: 0.7rem;">*Amount entered in NGN will be automatically converted to the target country's currency by the network.</small>
        </div>

        <div class="input-group-custom mt-4 border-warning">
            <label><i class="fas fa-lock me-1"></i> AUTHORIZATION PIN</label>
            <input type="password" id="transactionPin" placeholder="Enter 4-digit PIN" maxlength="4" style="letter-spacing: 10px; font-size: 1.5rem; text-align: center;">
        </div>
        
        <button class="btn-pay" onclick="processGlobalPayment()">
            <i class="fas fa-paper-plane me-2"></i> TRANSMIT AIRTIME
        </button>
    </div>
    
    <div class="text-center text-muted small fw-bold mb-5">
        <p class="mb-1"><i class="fas fa-shield-alt"></i> End-to-End Encrypted via VTPass</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    let socket = null;

    function initStars() {
        const c = document.getElementById('starCanvas');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const ctx = c.getContext('2d');
        const stars = [];
        for(let i = 0; i < 100; i++) stars.push({ x: Math.random() * c.width, y: Math.random() * c.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        function animate() {
            ctx.clearRect(0, 0, c.width, c.height);
            stars.forEach(s => { ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill(); s.y += s.v; if(s.y > c.height) s.y = -5; });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    async function loadBalance() {
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) { window.location.href = '/index.html'; return; }
        
        try {
            const res = await fetch('/api/user/dashboard-data', { headers: { 'Authorization': `Bearer ${authToken}` } });
            const data = await res.json();
            if (data.success) {
                const safeBal = data.balance?.$numberDecimal || data.balance || 0;
                document.getElementById('walletBalance').innerText = '₦' + Number(safeBal).toLocaleString(undefined, {minimumFractionDigits:2});
            }
        } catch (e) {}
    }

    async function fetchCountries() {
        const token = localStorage.getItem("naterpay_token");
        const loader = document.getElementById('countriesLoader');
        const select = document.getElementById('countrySelect');
        
        loader.style.display = 'block';

        try {
            const response = await fetch('/api/vtu/international/countries', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await response.json();
            
            if (data.success && data.countries) {
                select.innerHTML = '<option value="">-- Choose Target Country --</option>';
                data.countries.forEach(country => {
                    select.innerHTML += `<option value="${country.code}">${country.name}</option>`;
                });
            } else {
                select.innerHTML = '<option value="">Failed to sync countries</option>';
            }
        } catch (error) {
            select.innerHTML = '<option value="">Network connection lost</option>';
        } finally {
            loader.style.display = 'none';
        }
    }

    async function fetchOperators() {
        const token = localStorage.getItem("naterpay_token");
        const countryCode = document.getElementById('countrySelect').value;
        const loader = document.getElementById('operatorsLoader');
        const grid = document.getElementById('plansGrid');
        const wrapper = document.getElementById('operatorsWrapper');
        
        document.getElementById('selectedOperator').value = '';
        wrapper.style.display = 'none';

        if (!countryCode) return;

        loader.style.display = 'block';

        try {
            const response = await fetch(`/api/vtu/international/operators?code=${countryCode}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await response.json();
            
            if (data.success && data.operators) {
                grid.innerHTML = '';
                data.operators.forEach(operator => {
                    grid.innerHTML += `
                        <div class="col-6 col-md-4">
                            <div class="plan-card" onclick="selectOperator(this, '${operator.operator_id}')">
                                <img src="${operator.operator_image}" alt="${operator.name}" style="width:40px; height:40px; object-fit:contain; border-radius:50%; margin-bottom:8px; border: 1px solid #444;">
                                <div class="plan-name">${operator.name}</div>
                            </div>
                        </div>
                    `;
                });
                wrapper.style.display = 'block';
            } else {
                Swal.fire({ icon: 'error', title: 'Unavailable', text: 'No networks found for this country.', background: '#111', color: '#fff' });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to fetch networks.', background: '#111', color: '#fff' });
        } finally {
            loader.style.display = 'none';
        }
    }

    function selectOperator(cardElement, operatorId) {
        document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('active'));
        cardElement.classList.add('active');
        document.getElementById('selectedOperator').value = operatorId;
    }

    async function processGlobalPayment() {
        const country = document.getElementById('countrySelect').value;
        const operator = document.getElementById('selectedOperator').value;
        const phone = document.getElementById('targetPhone').value;
        const amount = document.getElementById('targetAmount').value;
        const pin = document.getElementById('transactionPin').value;
        
        if (!country || !operator || !phone || !amount) {
            return Swal.fire({ icon: 'warning', title: 'Incomplete', text: 'Please complete all fields and select a network.', background: '#111', color: '#fff', confirmButtonColor: '#d32f2f' });
        }
        if (pin.length !== 4) {
            return Swal.fire({ icon: 'warning', title: 'Security Pin', text: 'Enter your 4-digit transaction PIN.', background: '#111', color: '#fff', confirmButtonColor: '#d32f2f' });
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        
        Swal.fire({ 
            title: 'Processing...', 
            html: `<div class="swal-reflective-spinner"><i class="fas fa-globe swal-inner-icon"></i></div><span style="color:#aaa; font-weight:600; font-size:0.85rem;">NATER-PAY is processing your International request...</span>`, 
            showConfirmButton: false, allowOutsideClick: false, background: '#0a0a0a', color: '#fff' 
        });
        
        try {
            const res = await fetch('/api/vtu/foreign-airtime', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ phone: phone, operator: operator, amount: amount, pin: pin })
            });
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({ icon: 'success', title: 'Transmission Successful!', text: `Airtime delivered globally to ${phone}.`, confirmButtonColor: '#00D4FF', background: '#111', color: '#fff' }).then(() => {
                    document.getElementById('targetPhone').value = '';
                    document.getElementById('targetAmount').value = '';
                    document.getElementById('transactionPin').value = '';
                    document.getElementById('selectedOperator').value = '';
                    document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('active'));
                    loadBalance();
                });
            } else {
                Swal.fire({ icon: 'error', title: 'Transaction Failed', text: data.message, confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Unable to securely contact global gateway.', confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
        }
    }
    
    window.onload = () => { 
        initStars(); 
        loadBalance(); 
        fetchCountries();
        
        try {
            socket = io(window.location.origin, { query: { token: localStorage.getItem("naterpay_token") } });
            socket.on('wallet:update', (data) => {
                const bal = data.balance?.$numberDecimal || data.balance;
                document.getElementById('walletBalance').innerText = '₦' + Number(bal).toLocaleString(undefined, {minimumFractionDigits: 2});
            });
        } catch(e) {}
    };
    window.onresize = initStars;
</script>
</body>
</html>
