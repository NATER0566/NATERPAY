<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Fund Betting Wallet</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { 
            --gold: #FFD700; 
            --bg: #000000; 
            --card-bg: #111111; 
            --bet9ja: #008000;
            --sporty: #FF0000;
            --xbet: #3399FF;
            --betking: #FFCC00;
        }
        body { 
            background: var(--bg); 
            color: #FFFFFF; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            min-height: 100vh; 
        }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 3px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.6rem; } 
        .site-part-2 { color: #FF3333; font-size: 1.2rem; letter-spacing: 3px; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        .bet-card {
            background: var(--card-bg); 
            border: 2px solid #444; 
            border-radius: 20px;
            padding: 40px; 
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        .provider-btn {
            background: #1A1A1A; 
            border: 2.5px solid #444; 
            border-radius: 15px;
            padding: 22px 10px; 
            cursor: pointer; 
            transition: 0.3s; 
            text-align: center;
        }
        .provider-btn div {
            font-size: 1.1rem;
            color: #FFFFFF;
            margin-top: 8px;
            font-weight: 700;
        }
        .provider-btn:hover, .provider-btn.active {
            border-color: var(--gold); 
            background: rgba(255, 215, 0, 0.15);
            transform: translateY(-3px);
        }
        .provider-btn.active div {
            color: var(--gold);
            font-weight: 900;
        }
        
        .input-group-custom {
            background: #1A1A1A; 
            border: 2px solid var(--gold);
            border-radius: 15px; 
            padding: 20px; 
            margin-bottom: 25px;
        }
        
        .input-group-custom label, .section-heading, .amount-label {
            display: block; 
            font-size: 1.1rem; 
            color: var(--gold); 
            font-weight: 900;
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 12px;
        }
        
        .input-group-custom input {
            background: transparent; 
            border: none; 
            color: #FFFFFF; 
            width: 100%;
            font-size: 1.3rem; 
            font-weight: 700; 
            outline: none;
        }
        
        .amount-input {
            background: #1A1A1A; 
            border: 3px solid var(--gold); 
            border-radius: 15px;
            padding: 25px; 
            font-size: 3rem; 
            color: #FFFFFF; 
            font-weight: 900; 
            text-align: center;
            width: 100%; 
            outline: none; 
            margin-bottom: 30px;
        }
        .amount-input:focus { box-shadow: 0 0 25px rgba(255, 215, 0, 0.5); }
        
        .btn-buy {
            background: var(--gold); 
            color: #000000; 
            font-weight: 900; 
            border-radius: 15px;
            padding: 22px; 
            width: 100%; 
            border: none; 
            font-size: 1.5rem; 
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-buy:hover { 
            background: #FFFFFF; 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(255,255,255,0.3); 
        }
        
        .footer-text {
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-warning rounded-pill px-4" style="font-weight: 800;">Back to Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold); font-size: 2.8rem;">FUND BETTING</h1>
    
    <div class="bet-card">
        <span class="section-heading">1. Select Betting Platform</span>
        
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="provider-btn active" onclick="selectProvider(this, 'bet9ja')">
                    <i class="fas fa-futbol fa-2x" style="color: var(--bet9ja);"></i>
                    <div>Bet9ja</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="provider-btn" onclick="selectProvider(this, 'sportybet')">
                    <i class="fas fa-trophy fa-2x" style="color: var(--sporty);"></i>
                    <div>SportyBet</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="provider-btn" onclick="selectProvider(this, '1xbet')">
                    <i class="fas fa-dice fa-2x" style="color: var(--xbet);"></i>
                    <div>1xBet</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="provider-btn" onclick="selectProvider(this, 'betking')">
                    <i class="fas fa-crown fa-2x" style="color: var(--betking);"></i>
                    <div>BetKing</div>
                </div>
            </div>
        </div>
        
        <div class="input-group-custom">
            <label>CUSTOMER / USER ID</label>
            <input type="text" id="customerId" placeholder="Enter your betting account ID...">
        </div>
        
        <span class="section-heading text-center">2. Enter Funding Amount (₦)</span>
        <input type="number" id="betAmount" class="amount-input" placeholder="0" min="100">
        
        <div class="input-group-custom">
            <label>WITHDRAWAL PIN</label>
            <input type="password" id="withdrawalPin" placeholder="Enter 4-digit security PIN" maxlength="4">
        </div>
        
        <button class="btn-buy" onclick="fundBetting()">
            <i class="fas fa-coins me-2"></i> FUND WALLET NOW
        </button>
    </div>
    
    <div class="text-center footer-text mb-5">
        <p class="mb-1">Betting Wallet Top-up API</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    let selectedProvider = 'bet9ja';
    
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 150; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    function selectProvider(element, provider) {
        document.querySelectorAll('.provider-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedProvider = provider;
    }
    
    async function fundBetting() {
        const customerId = document.getElementById('customerId').value;
        const amount = parseFloat(document.getElementById('betAmount').value);
        const pin = document.getElementById('withdrawalPin').value;
        
        if (!customerId) {
            Swal.fire({
                icon: 'error',
                title: 'Missing ID',
                text: 'Please enter the Customer/User ID for the betting account.',
                confirmButtonColor: '#FF3333',
                background: '#111111',
                color: '#FFFFFF'
            });
            return;
        }
        
        if (!amount || amount < 100) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Amount',
                text: 'Minimum funding amount is ₦100.',
                confirmButtonColor: '#FF3333',
                background: '#111111',
                color: '#FFFFFF'
            });
            return;
        }
        
        if (!pin || pin.length !== 4) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid PIN',
                text: 'Please enter your 4-digit security PIN.',
                confirmButtonColor: '#FF3333',
                background: '#111111',
                color: '#FFFFFF'
            });
            return;
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            Swal.fire({
                title: 'Verifying Details...',
                html: '<span style="color: #FFF; font-size: 1.2rem;">Connecting to ' + selectedProvider.toUpperCase() + '...</span>',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                background: '#111111',
                color: '#FFD700'
            });
            
            // Note: This expects an /api/vtu/betting route in your backend when you are ready to configure it
            const res = await fetch('/api/vtu/betting', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ 
                    provider: selectedProvider,
                    customerId: customerId,
                    amount: amount,
                    pin: pin
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Funding Successful!',
                    html: `<div style="font-size: 1.2rem; color: #FFF;">₦${amount.toLocaleString()} has been credited to ${selectedProvider.toUpperCase()} ID: ${customerId}.</div>`,
                    confirmButtonColor: '#FFD700',
                    background: '#111111',
                    color: '#FFFFFF'
                }).then(() => {
                    window.location.href = '/dashboard.html';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Transaction Failed',
                    text: data.message || 'Unable to fund betting wallet at this time.',
                    confirmButtonColor: '#FF3333',
                    background: '#111111',
                    color: '#FFFFFF'
                });
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Route Not Ready',
                text: 'The backend route for betting is not yet configured on your server.',
                confirmButtonColor: '#FF3333',
                background: '#111111',
                color: '#FFFFFF'
            });
        }
    }
    
    window.onload = initStars;
</script>

</body>
</html>
