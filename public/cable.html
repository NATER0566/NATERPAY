<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Cable TV Subscription</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card-bg: rgba(20, 20, 20, 0.95); }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 2.5px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.4rem; } 
        .site-part-2 { color: #d32f2f; font-size: 1rem; letter-spacing: 3px; }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        
        .cable-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 20px;
            padding: 40px; margin-bottom: 30px;
        }
        
        .provider-btn {
            background: rgba(30,30,30,0.95); border: 2px solid #444; border-radius: 15px;
            padding: 20px; cursor: pointer; transition: 0.3s; text-align: center;
        }
        .provider-btn:hover, .provider-btn.active {
            border-color: var(--gold); background: rgba(212,175,55,0.1);
            transform: translateY(-3px);
        }
        
        .input-group-custom {
            background: rgba(0,0,0,0.6); border: 1.5px solid rgba(212,175,55,0.35);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
        }
        .input-group-custom label {
            display: block; font-size: 0.75rem; color: var(--gold); font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
        }
        .input-group-custom input, .input-group-custom select {
            background: transparent; border: none; color: white; width: 100%;
            font-size: 1.1rem; font-weight: 700; outline: none;
        }
        
        .plan-card {
            background: rgba(30,30,30,0.95); border: 1px solid #444; border-radius: 15px;
            padding: 20px; cursor: pointer; transition: 0.3s;
        }
        .plan-card:hover, .plan-card.active {
            border-color: var(--gold); background: rgba(212,175,55,0.1);
        }
        
        .btn-buy {
            background: var(--gold); color: black; font-weight: 900; border-radius: 15px;
            padding: 18px; width: 100%; border: none; font-size: 1.1rem; letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-buy:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4">Back to Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold);">CABLE TV SUBSCRIPTION</h1>
    
    <div class="cable-card">
        <h5 class="mb-3" style="font-family: 'Cinzel'; color: var(--gold);">SELECT PROVIDER</h5>
        
        <div class="row g-3 mb-4">
            <div class="col-6">
                <div class="provider-btn active" onclick="selectProvider(this, 'dstv')">
                    <i class="fas fa-tv fa-2x mb-2" style="color: #00bfff;"></i>
                    <div class="fw-bold">DSTV</div>
                </div>
            </div>
            <div class="col-6">
                <div class="provider-btn" onclick="selectProvider(this, 'gotv')">
                    <i class="fas fa-tv fa-2x mb-2" style="color: #00ff00;"></i>
                    <div class="fw-bold">GOtv</div>
                </div>
            </div>
            <div class="col-6">
                <div class="provider-btn" onclick="selectProvider(this, 'startimes')">
                    <i class="fas fa-tv fa-2x mb-2" style="color: #ff6600;"></i>
                    <div class="fw-bold">StarTimes</div>
                </div>
            </div>
            <div class="col-6">
                <div class="provider-btn" onclick="selectProvider(this, 'showmax')">
                    <i class="fas fa-play-circle fa-2x mb-2" style="color: #ff0066;"></i>
                    <div class="fw-bold">Showmax</div>
                </div>
            </div>
        </div>
        
        <div class="input-group-custom">
            <label>SMARTCARD NUMBER</label>
            <input type="text" id="smartcardNumber" placeholder="Enter your smartcard number">
        </div>
        
        <h5 class="mb-3" style="font-family: 'Cinzel'; color: var(--gold);">SELECT PACKAGE</h5>
        
        <div class="row g-3 mb-4" id="planContainer">
            <div class="col-6 col-md-4">
                <div class="plan-card active" onclick="selectPlan(this, 'Compact', 10500)">
                    <div class="fw-bold">Compact</div>
                    <div class="text-warning">₦10,500</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="plan-card" onclick="selectPlan(this, 'Compact Plus', 16500)">
                    <div class="fw-bold">Compact Plus</div>
                    <div class="text-warning">₦16,500</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="plan-card" onclick="selectPlan(this, 'Premium', 24500)">
                    <div class="fw-bold">Premium</div>
                    <div class="text-warning">₦24,500</div>
                </div>
            </div>
        </div>
        
        <div class="input-group-custom">
            <label>WITHDRAWAL PIN</label>
            <input type="password" id="withdrawalPin" placeholder="Enter your 4-digit PIN" maxlength="4">
        </div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <small class="text-muted">TOTAL AMOUNT</small>
                <div class="h3 fw-bold" style="color: var(--gold);" id="totalAmount">₦10,500</div>
            </div>
        </div>
        
        <button class="btn-buy" onclick="buyCable()">
            <i class="fas fa-satellite-dish me-2"></i> SUBSCRIBE
        </button>
    </div>
    
    <div class="text-center text-muted small">
        <p class="mb-1">Cable TV powered by VTpass</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    let selectedProvider = 'dstv';
    let selectedPlan = 'Compact';
    let selectedAmount = 10500;
    
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 150; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    function selectProvider(element, provider) {
        document.querySelectorAll('.provider-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedProvider = provider;
    }
    
    function selectPlan(element, plan, amount) {
        document.querySelectorAll('.plan-card').forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        selectedPlan = plan;
        selectedAmount = amount;
        document.getElementById('totalAmount').innerText = '₦' + amount.toLocaleString();
    }
    
    async function buyCable() {
        const smartcardNumber = document.getElementById('smartcardNumber').value;
        const pin = document.getElementById('withdrawalPin').value;
        
        if (!smartcardNumber) {
            Swal.fire({
                icon: 'error',
                title: 'Missing Smartcard Number',
                text: 'Please enter your smartcard number',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        if (!pin || pin.length !== 4) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid PIN',
                text: 'Please enter your 4-digit withdrawal PIN',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            Swal.fire({
                title: 'Processing...',
                text: 'Subscribing to cable package',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                background: '#0a0a0a',
                color: '#fff'
            });
            
            const res = await fetch('/api/vtu/cable', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ 
                    smartcardNumber,
                    provider: selectedProvider,
                    package: selectedPlan,
                    amount: selectedAmount,
                    pin
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Subscription Successful',
                    text: `${selectedPlan} package has been activated for your smartcard`,
                    confirmButtonColor: '#d4af37',
                    background: '#0a0a0a',
                    color: '#fff'
                }).then(() => {
                    window.location.href = '/dashboard.html';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Subscription Failed',
                    text: data.message,
                    confirmButtonColor: '#d32f2f',
                    background: '#0a0a0a',
                    color: '#fff'
                });
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Processing Error',
                text: 'Unable to process subscription. Please try again.',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
        }
    }
    
    window.onload = initStars;
</script>

</body>
</html>
