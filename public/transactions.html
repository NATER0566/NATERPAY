<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Transactions</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card-bg: rgba(20, 20, 20, 0.95); }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 2.5px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.4rem; } 
        .site-part-2 { color: #d32f2f; font-size: 1rem; letter-spacing: 3px; }

        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        
        .transaction-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 20px;
            padding: 30px; margin-bottom: 30px;
        }
        
        .filter-btn {
            background: rgba(30,30,30,0.95); border: 1px solid #444; color: white;
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            border-color: var(--gold); background: rgba(212,175,55,0.1);
        }
        
        .table { color: #eee; }
        .status-pill { padding: 5px 12px; border-radius: 50px; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .status-success { background: #00ff88; color: black; }
        .status-pending { background: #ffaa00; color: black; }
        .status-failed { background: #ff4444; color: white; }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4">Back to Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold);">TRANSACTION HISTORY</h1>
    
    <div class="transaction-card">
        <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="filter-btn active" onclick="filterTransactions('all')">All</button>
            <button class="filter-btn" onclick="filterTransactions('airtime')">Airtime</button>
            <button class="filter-btn" onclick="filterTransactions('data')">Data</button>
            <button class="filter-btn" onclick="filterTransactions('funding')">Funding</button>
            <button class="filter-btn" onclick="filterTransactions('withdrawal')">Withdrawal</button>
            <button class="filter-btn" onclick="filterTransactions('transfer')">Transfer</button>
        </div>
        
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
                <thead>
                    <tr>
                        <th class="text-secondary small fw-bold">DATE/TIME</th>
                        <th class="text-secondary small fw-bold">TYPE</th>
                        <th class="text-secondary small fw-bold">DESCRIPTION</th>
                        <th class="text-secondary small fw-bold">AMOUNT</th>
                        <th class="text-secondary small fw-bold">BALANCE</th>
                        <th class="text-secondary small fw-bold text-end">STATUS</th>
                    </tr>
                </thead>
                <tbody id="txBody">
                    <tr><td colspan="6" class="text-center py-5 opacity-50"><i class="fas fa-spinner fa-spin me-2"></i> Loading transactions...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mt-4">
            <small class="text-muted">Showing recent transactions</small>
            <button class="btn btn-sm btn-outline-warning rounded-pill" onclick="loadMoreTransactions()">Load More</button>
        </div>
    </div>
    
    <div class="text-center text-muted small">
        <p class="mb-1">Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    let currentFilter = 'all';
    let currentPage = 1;
    
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 150; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    async function loadTransactions() {
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            const queryParams = new URLSearchParams();
            if (currentFilter !== 'all') queryParams.append('type', currentFilter);
            queryParams.append('limit', '50');
            
            const res = await fetch(`/api/transactions?${queryParams}`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const data = await res.json();
            
            if (data.success) {
                const tbody = document.getElementById('txBody');
                tbody.innerHTML = '';
                
                if (data.transactions && data.transactions.length > 0) {
                    data.transactions.forEach(tx => {
                        const dateString = new Date(tx.date).toLocaleDateString() + ' <br><small class="opacity-50">' + new Date(tx.date).toLocaleTimeString() + '</small>';
                        const statusClass = tx.status === 'success' ? 'status-success' : (tx.status === 'pending' ? 'status-pending' : 'status-failed');
                        
                        tbody.innerHTML += `
                            <tr>
                                <td>${dateString}</td>
                                <td><strong>${tx.type.toUpperCase()}</strong></td>
                                <td>${tx.description || 'System Transaction'}</td>
                                <td class="fw-bold">₦${Number(tx.amount).toLocaleString()}</td>
                                <td class="text-muted">₦${Number(tx.balanceAfter).toLocaleString()}</td>
                                <td class="text-end"><span class="status-pill ${statusClass}">${tx.status}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 opacity-50">No transactions found.</td></tr>';
                }
            }
        } catch (e) {
            console.error('Failed to load transactions');
            document.getElementById('txBody').innerHTML = '<tr><td colspan="6" class="text-center py-5 opacity-50">Failed to load transactions. Please try again.</td></tr>';
        }
    }
    
    function filterTransactions(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        currentPage = 1;
        loadTransactions();
    }
    
    function loadMoreTransactions() {
        currentPage++;
        loadTransactions();
    }
    
    window.onload = () => {
        initStars();
        loadTransactions();
    };
</script>

</body>
</html>
