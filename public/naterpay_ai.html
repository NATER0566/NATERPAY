<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NATERPAY AI | Intelligent Financial Assistant</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Markdown & Syntax Highlighting for AI Responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <style>
        :root { 
            --gold: #FFD700; 
            --gold-dim: #d4af37; 
            --bg: #030303; 
            --card-bg: rgba(15, 15, 15, 0.7); 
            --user-msg: rgba(255, 215, 0, 0.15);
            --ai-msg: rgba(255, 255, 255, 0.05);
        }
        
        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.85); border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 30px rgba(0,0,0,0.8); flex-shrink: 0;
        }

        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; line-height: 0.85; }
        .site-part-1 { color: var(--gold); font-size: 1.5rem; text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); } 
        .site-part-2 { color: #d32f2f; font-size: 1rem; letter-spacing: 3px; }
        
        .ai-version-tag {
            border: 1px solid var(--gold); color: var(--gold); background: rgba(255,215,0,0.1);
            font-size: 0.65rem; padding: 2px 8px; border-radius: 50px; font-weight: 800; letter-spacing: 1px;
            margin-left: 10px; vertical-align: middle;
        }

        /* --- CHAT CONTAINER --- */
        .chat-container {
            flex-grow: 1; max-width: 1000px; width: 100%; margin: 0 auto; 
            display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 2;
        }

        .chat-history {
            flex-grow: 1; overflow-y: auto; padding: 30px 20px;
            scroll-behavior: smooth; display: flex; flex-direction: column; gap: 25px;
        }
        .chat-history::-webkit-scrollbar { width: 6px; }
        .chat-history::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 10px; }

        /* --- AI ORB (HERO SECTION) --- */
        .welcome-hero {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; margin: 40px auto; width: 100%; max-width: 800px;
            animation: fadeIn 1s ease-out forwards;
        }
        
        .ai-orb-container {
            position: relative; width: 140px; height: 140px; margin-bottom: 25px;
            display: flex; align-items: center; justify-content: center;
        }
        .ai-orb {
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff 0%, var(--gold) 20%, #b38728 60%, #000 100%);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.8);
            animation: floatOrb 4s ease-in-out infinite, pulseGlow 2s alternate infinite;
            position: relative; z-index: 5;
        }
        .orbit-ring {
            position: absolute; border-radius: 50%; border: 1px solid rgba(255, 215, 0, 0.3);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .ring-1 { width: 110px; height: 110px; border-top-color: var(--gold); border-bottom-color: var(--gold); animation: spinRing 4s linear infinite; }
        .ring-2 { width: 140px; height: 140px; border-left-color: var(--gold); border-right-color: var(--gold); animation: spinRingReverse 6s linear infinite; }
        
        @keyframes floatOrb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); } 100% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.8); } }
        @keyframes spinRing { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spinRingReverse { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .hero-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 2.2rem; color: #fff; margin-bottom: 5px; }
        .hero-subtitle { color: #aaa; font-weight: 600; font-size: 1rem; margin-bottom: 30px; letter-spacing: 1px; }

        /* --- QUICK ACTIONS & PROMPTS --- */
        .quick-actions-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 30px; width: 100%;
        }
        .action-card {
            background: rgba(20, 20, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 15px;
            color: #ccc; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 1px;
        }
        .action-card i { color: var(--gold); font-size: 1.1rem; }
        .action-card:hover { background: rgba(255, 215, 0, 0.1); border-color: var(--gold); color: var(--gold); transform: translateY(-3px); }

        .suggested-prompts {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 800px;
        }
        .prompt-pill {
            background: transparent; border: 1px solid rgba(255, 215, 0, 0.3); color: #fff;
            padding: 8px 16px; border-radius: 50px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; transition: 0.3s;
        }
        .prompt-pill:hover { background: var(--gold); color: #000; }

        /* --- CHAT BUBBLES --- */
        .msg-wrapper { display: flex; flex-direction: column; width: 100%; animation: slideIn 0.3s ease-out; }
        .msg-wrapper.user { align-items: flex-end; }
        .msg-wrapper.ai { align-items: flex-start; }

        .msg-bubble {
            max-width: 85%; padding: 15px 20px; border-radius: 20px; font-size: 0.95rem; line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); word-wrap: break-word; position: relative;
        }
        
        .msg-wrapper.user .msg-bubble {
            background: var(--user-msg); border: 1px solid rgba(255,215,0,0.3); color: #fff;
            border-bottom-right-radius: 5px;
        }
        
        .msg-wrapper.ai .msg-bubble {
            background: var(--ai-msg); border: 1px solid rgba(255,255,255,0.1); color: #ddd;
            border-bottom-left-radius: 5px; backdrop-filter: blur(10px);
        }

        .msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; margin-bottom: 5px; }
        .msg-wrapper.user .msg-avatar { background: #333; color: #fff; margin-left: auto; }
        .msg-wrapper.ai .msg-avatar { background: var(--gold); color: #000; box-shadow: 0 0 10px rgba(255,215,0,0.5); }

        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble strong { color: var(--gold); font-weight: 800; }
        .msg-bubble table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.85rem; }
        .msg-bubble th, .msg-bubble td { border: 1px solid rgba(255,255,255,0.1); padding: 8px; text-align: left; }
        .msg-bubble th { background: rgba(255,215,0,0.1); color: var(--gold); }
        .msg-bubble pre { background: #000; padding: 10px; border-radius: 8px; border: 1px solid #333; overflow-x: auto; }
        .msg-bubble code { font-family: monospace; font-size: 0.85rem; color: #00ff88; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- TYPING INDICATOR --- */
        .typing-indicator {
            display: flex; align-items: center; gap: 5px; padding: 10px 15px; 
            background: var(--ai-msg); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; border-bottom-left-radius: 5px; width: fit-content;
            margin-top: 10px; display: none;
        }
        .dot { width: 8px; height: 8px; background: var(--gold); border-radius: 50%; animation: bounceDot 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounceDot { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* --- INPUT AREA --- */
        .input-area {
            padding: 20px; background: rgba(0,0,0,0.9); border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0; display: flex; justify-content: center; z-index: 10;
        }
        .input-wrapper {
            max-width: 900px; width: 100%; display: flex; align-items: flex-end; gap: 10px;
            background: #111; border: 1px solid #333; border-radius: 25px; padding: 8px 15px;
            transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .input-wrapper:focus-within { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.2); background: #151515; }

        .chat-input {
            flex-grow: 1; background: transparent; border: none; color: #fff; font-size: 1rem;
            font-family: 'Montserrat', sans-serif; resize: none; outline: none;
            max-height: 150px; padding: 10px 0; overflow-y: auto; line-height: 1.5;
        }
        .chat-input::placeholder { color: #666; font-weight: 500; }
        .chat-input::-webkit-scrollbar { width: 4px; }

        .action-btn {
            background: transparent; border: none; color: #888; font-size: 1.3rem; 
            padding: 10px; cursor: pointer; transition: 0.3s; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .action-btn:hover { color: var(--gold); background: rgba(255,215,0,0.1); }
        
        .send-btn {
            background: var(--gold); color: #000; border: none; width: 45px; height: 45px;
            border-radius: 50%; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255,215,0,0.3); margin-bottom: 2px;
        }
        .send-btn:hover { transform: scale(1.1); background: #fff; box-shadow: 0 5px 20px rgba(255,255,255,0.5); }
        .send-btn:disabled { background: #333; color: #666; box-shadow: none; transform: none; cursor: not-allowed; }

        .footer-disclaimer {
            text-align: center; font-size: 0.65rem; color: #555; padding-bottom: 10px; background: rgba(0,0,0,0.9);
        }

    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER<span class="ai-version-tag">AI v1.0</span></span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4 fw-bold btn-sm"><i class="fas fa-times me-2"></i> Close AI</a>
</header>

<div class="chat-container">
    
    <div class="chat-history" id="chatBox">
        
        <!-- INITIAL HERO SCREEN -->
        <div class="welcome-hero" id="heroScreen">
            
            <div class="ai-orb-container">
                <div class="orbit-ring ring-1"></div>
                <div class="orbit-ring ring-2"></div>
                <div class="ai-orb"></div>
            </div>
            
            <h1 class="hero-title">NATERPAY AI</h1>
            <p class="hero-subtitle">Your Intelligent Financial Assistant.<br>Neural Core Online & Ready.</p>
            
            <div class="quick-actions-grid">
                <div class="action-card" onclick="sendSuggested('Check my ledger wallet balance')"><i class="fas fa-wallet"></i> Wallet</div>
                <div class="action-card" onclick="sendSuggested('Check my recent transactions')"><i class="fas fa-history"></i> Logs</div>
                <div class="action-card" onclick="sendSuggested('I want to buy Airtime')"><i class="fas fa-phone"></i> VTpass Top-Up</div>
                <div class="action-card" onclick="sendSuggested('How do I verify my KYC identity?')"><i class="fas fa-id-badge"></i> KYC</div>
                <div class="action-card" onclick="sendSuggested('How do referrals and commissions work?')"><i class="fas fa-users"></i> Network</div>
                <div class="action-card" onclick="sendSuggested('Show me the Developer API documentation')"><i class="fas fa-code"></i> APIs</div>
            </div>

            <p style="font-size: 0.75rem; color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px;">Ask Anything</p>
            
            <div class="suggested-prompts">
                <button class="prompt-pill" onclick="sendSuggested('Buy MTN SME Data')">Buy MTN SME Data</button>
                <button class="prompt-pill" onclick="sendSuggested('Pay IKEDC Electricity Bill')">Pay Electricity</button>
                <button class="prompt-pill" onclick="sendSuggested('Buy WAEC Result Checker PIN')">Buy WAEC PIN</button>
                <button class="prompt-pill" onclick="sendSuggested('Buy International Airtime')">Int'l Airtime</button>
                <button class="prompt-pill" onclick="sendSuggested('My last transaction failed, why?')">Why did my transaction fail?</button>
            </div>
        </div>

        <!-- Chat messages will be injected here dynamically -->

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- INPUT AREA -->
    <div class="input-area">
        <div class="input-wrapper">
            <button class="action-btn" title="Future Feature: Voice Search"><i class="fas fa-microphone"></i></button>
            
            <textarea id="userInput" class="chat-input" placeholder="Message NATERPAY AI..." rows="1" oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
            
            <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    <div class="footer-disclaimer">NATERPAY AI can make mistakes. Always verify transaction statuses and account numbers before processing.</div>

</div>

<script>
    // --- BACKGROUND ANIMATION ---
    function initStars() {
        const canvas = document.getElementById("starCanvas");
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const ctx = canvas.getContext("2d");
        const stars = [];
        for (let i = 0; i < 80; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.3 + 0.1, opacity: Math.random() });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.opacity; ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
                s.y += s.speed; if (s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    window.onload = initStars;
    window.onresize = initStars;

    // --- MARKDOWN CONFIGURATION ---
    marked.setOptions({
        highlight: function(code, lang) {
            const language = highlight.getLanguage(lang) ? lang : 'plaintext';
            return highlight.highlight(code, { language }).value;
        },
        breaks: true,
        gfm: true
    });

    // --- CHAT LOGIC ---
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const heroScreen = document.getElementById('heroScreen');
    
    let isFirstMessage = true;

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
        if(textarea.value.trim() === '') {
            sendBtn.disabled = true;
        } else {
            sendBtn.disabled = false;
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if(!sendBtn.disabled) sendMessage();
        }
    }

    function sendSuggested(text) {
        userInput.value = text;
        autoResize(userInput);
        sendMessage();
    }

    function appendMessage(role, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg-wrapper ${role}`;
        
        let iconHtml = '';
        if(role === 'user') {
            iconHtml = `<div class="msg-avatar"><i class="fas fa-user"></i></div>`;
        } else {
            iconHtml = `<div class="msg-avatar"><i class="fas fa-robot"></i></div>`;
            // Parse markdown for AI responses
            content = marked.parse(content);
        }

        msgDiv.innerHTML = `
            ${iconHtml}
            <div class="msg-bubble">${content}</div>
        `;
        
        // Insert right before typing indicator
        chatBox.insertBefore(msgDiv, typingIndicator);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // Hide Hero on first interaction
        if (isFirstMessage) {
            heroScreen.style.display = 'none';
            isFirstMessage = false;
        }

        // 1. Add User Message to UI
        appendMessage('user', message);
        
        // 2. Reset Input
        userInput.value = '';
        autoResize(userInput);
        sendBtn.disabled = true;
        
        // 3. Show Typing Indicator
        typingIndicator.style.display = 'flex';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const token = localStorage.getItem("naterpay_token") || "";
            
            // 4. API CALL TO BACKEND (This route will be created in your Node.js server)
            const response = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            
            // 5. Hide Typing Indicator
            typingIndicator.style.display = 'none';

            if (data.success && data.reply) {
                // 6. Append AI Response
                appendMessage('ai', data.reply);
            } else {
                appendMessage('ai', "⚠️ *System Protocol Error:* I am currently unable to reach the neural core. Please try again in a moment.");
            }

        } catch (error) {
            typingIndicator.style.display = 'none';
            appendMessage('ai', "📡 *Connection Lost:* Unable to establish a secure link with the NATERPAY server.");
        }
    }
</script>

</body>
</html>
