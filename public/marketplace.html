<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Global Marketplace</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root { 
            --gold: #FFD700; 
            --gold-glow: rgba(255, 215, 0, 0.4); 
            --bg: #030303; 
            --card-bg: rgba(12, 12, 12, 0.85); 
            --green: #00ff88;
            --nater-red: #d32f2f;
        }
        
        * { box-sizing: border-box; }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            min-height: 100vh; 
            overflow-x: hidden; 
            display: flex;
            flex-direction: column;
        }
        
        #starCanvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -2; 
            pointer-events: none; 
        }

        /* SYNCED HEADER EXACTLY LIKE DASHBOARD */
        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.95); border-bottom: 3px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(10px);
        }
        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; line-height: 0.85;}
        .site-part-1 { color: var(--gold); font-size: 1.8rem; text-shadow: 0 0 10px var(--gold-glow); } 
        .site-part-2 { color: var(--nater-red); font-size: 1.3rem; letter-spacing: 3px; }

        @media (max-width: 480px) {
            .site-part-1 { font-size: 1.4rem; }
            .site-part-2 { font-size: 1rem; }
            header .btn { font-size: 0.85rem !important; padding: 8px 15px !important; }
        }

        /* HERO & SEARCH */
        .marketplace-hero {
            padding: 50px 5% 40px;
            text-align: center;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .hero-title { font-family: 'Cinzel', serif; color: var(--gold); font-weight: 900; font-size: clamp(2rem, 5vw, 3rem); text-shadow: 0 0 20px var(--gold-glow); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        .hero-subtitle { color: #ccc; font-weight: 600; font-size: clamp(0.9rem, 2vw, 1.1rem); margin-bottom: 30px; }

        .search-container {
            background: #111; border: 2px solid #333; border-radius: 50px; 
            padding: 12px 25px; display: flex; align-items: center; transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%;
        }
        .search-container:focus-within { border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow); background: #151515;}
        .search-container i { color: var(--gold); font-size: 1.3rem; margin-right: 15px; }
        .search-container input {
            background: transparent; border: none; color: white; width: 100%; 
            font-size: 1.1rem; font-weight: 700; outline: none; font-family: 'Montserrat', sans-serif;
        }

        /* TRUST BANNER */
        .feature-banner-wrapper { width: 100%; padding: 0 5%; margin-bottom: 40px; }
        .feature-banner {
            display: flex; justify-content: center; gap: 30px; flex-wrap: wrap;
            background: rgba(10, 10, 10, 0.6); border: 1px solid #333; border-radius: 15px;
            padding: 25px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .feature-item {
            display: flex; align-items: center; gap: 10px; color: #fff;
            font-weight: 800; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px;
        }
        .feature-item i { color: var(--gold); font-size: 1.4rem; text-shadow: 0 0 10px var(--gold-glow); }

        @media (max-width: 768px) {
            .feature-banner { gap: 15px; padding: 15px; }
            .feature-item { font-size: 0.75rem; width: 45%; justify-content: center; }
        }

        /* PRODUCT GRID */
        .main-content { flex: 1; padding: 0 5%; width: 100%; margin: 0 auto 60px; }
        .products-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); 
            gap: 25px;
            min-height: 400px;
        }

        /* ATTRACTIVE PORTABLE CARDS */
        .product-card {
            background: var(--card-bg); border: 2px solid #222; border-radius: 20px;
            overflow: hidden; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; display: flex; flex-direction: column;
            backdrop-filter: blur(15px); height: 100%; text-align: left;
        }
        .product-card:hover { border-color: var(--gold); transform: translateY(-10px); box-shadow: 0 20px 50px rgba(0,0,0,0.9); }

        .product-image-header {
            width: 100%; height: 200px; background-color: #050505;
            background-size: cover; 
            background-position: center; background-repeat: no-repeat;
            border-bottom: 2px solid #222; position: relative;
        }
        
        .store-icon-fallback { 
            background: #050505; width: 100%; height: 200px; 
            display: flex; align-items: center; justify-content: center; font-size: 4rem; 
            color: #222; border-bottom: 2px solid #222; position: relative;
        }

        /* Card Badges */
        .badge-verified {
            position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--green); color: var(--green); padding: 6px 12px;
            border-radius: 50px; font-size: 0.75rem; font-weight: 900; letter-spacing: 1px;
        }
        .badge-category {
            position: absolute; top: 15px; left: 15px; background: rgba(255, 215, 0, 0.9);
            color: #000; padding: 6px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 900; 
        }

        .product-details { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        
        /* Creator Details Box */
        .creator-info-box {
            background: #0a0a0a; border: 1px solid #333; border-radius: 12px;
            padding: 12px; margin-bottom: 15px;
        }
        .creator-info-box div { margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: #ccc; display: flex; align-items: center; gap: 8px;}
        .creator-info-box div:last-child { margin-bottom: 0; }
        .creator-info-box i { width: 15px; text-align: center; }
        .creator-name i { color: var(--gold); }
        .creator-email i { color: #888; }
        .creator-whatsapp i { color: var(--green); font-size: 1rem;}
        
        .product-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.4rem; margin-bottom: 12px; color: #fff; line-height: 1.3; }
        
        /* DEDICATED FULL DISPLAY BOX FOR PRODUCT DESCRIPTION */
        .product-desc { 
            color: #bbb; 
            font-size: 0.9rem; 
            font-weight: 600; 
            margin-bottom: 20px; 
            line-height: 1.5; 
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #222;
            padding: 12px;
            border-radius: 10px;
            max-height: 130px;
            overflow-y: auto;
            word-wrap: break-word;
        }
        .product-desc::-webkit-scrollbar { width: 5px; }
        .product-desc::-webkit-scrollbar-track { background: transparent; }
        .product-desc::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .product-desc::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        .card-footer-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; margin-bottom: 20px; padding-top: 15px; border-top: 1px solid #333;}
        
        .price-col { display: flex; flex-direction: column; }
        .price-label { font-size: 0.7rem; color: #666; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;}
        .product-price { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.6rem; font-weight: 900; }
        
        .sales-col { text-align: right; }
        .sales-stats { font-size: 0.85rem; color: #fff; font-weight: 800; background: #222; padding: 5px 10px; border-radius: 8px;}

        .btn-buy {
            background: #1a1a1a; color: #fff; font-weight: 900; border-radius: 12px;
            padding: 16px; width: 100%; border: 2px solid #444; font-size: 1.05rem;
            letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; text-align: center; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-buy:hover { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 10px 25px var(--gold-glow); }

        .loader-container { grid-column: 1 / -1; text-align: center; padding: 80px 0; border: 2px dashed #333; border-radius: 20px; background: #0a0a0a;}
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">MARKET</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4 py-2 fw-bold" style="font-size: 1.1rem; border-width: 2px;">
        <i class="fas fa-arrow-left me-2"></i> Dashboard
    </a>
</header>

<div class="marketplace-hero">
    <h1 class="hero-title">Global Marketplace</h1>
    <p class="hero-subtitle">Discover, buy, and instantly access verified products securely hosted on the NATER-PAY network.</p>
    
    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search products, descriptions, or categories..." oninput="filterProducts()">
    </div>
</div>

<div class="feature-banner-wrapper">
    <div class="feature-banner">
        <div class="feature-item"><i class="fas fa-shield-check"></i> Secure Escrow</div>
        <div class="feature-item"><i class="fas fa-bolt"></i> Instant Access</div>
        <div class="feature-item"><i class="fas fa-user-check"></i> Verified Sellers</div>
        <div class="feature-item"><i class="fas fa-globe"></i> Global Ledger</div>
    </div>
</div>

<div class="main-content">
    <div class="products-grid" id="marketGrid">
        <div class="loader-container" id="loadingState">
            <i class="fas fa-circle-notch fa-spin fa-3x text-warning mb-3"></i>
            <h5 class="fw-bold text-white fs-3" style="font-family: 'Cinzel';">Syncing Global Ledger...</h5>
            <p class="text-secondary fw-bold">Retrieving all global merchant listings.</p>
        </div>
    </div>
</div>

<script>
    let globalMarketData = [];

    // Canvas Background
    function initStars() {
        const c = document.getElementById('starCanvas');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const ctx = c.getContext('2d');
        const stars = [];
        for(let i = 0; i < 100; i++) stars.push({ x: Math.random() * c.width, y: Math.random() * c.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        function animate() {
            ctx.clearRect(0, 0, c.width, c.height);
            stars.forEach(s => { ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white"; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; s.y += s.v; if(s.y > c.height) s.y = -5; });
            requestAnimationFrame(animate);
        }
        animate();
    }

    // Fetch All Global Products
    async function fetchLiveProducts() {
        try {
            // NOTE: We do NOT send the Authorization Bearer token here anymore. 
            // Sending it makes the backend think you only want your own products.
            // Ensure your backend endpoint "/api/marketplace/all" is public!
            const headers = { 'Content-Type': 'application/json' };

            // Change this endpoint to whatever your backend uses to fetch ALL products globally
            const res = await fetch('/api/marketplace/all', {
                method: 'GET',
                headers: headers
            }); 
            
            if(!res.ok) throw new Error("Could not connect to the global ledger. Ensure backend route /api/marketplace/all exists.");

            const data = await res.json();
            const newMarketData = data.links ? data.links : (Array.isArray(data) ? data : []);

            if (newMarketData.length > 0) {
                if (JSON.stringify(globalMarketData) !== JSON.stringify(newMarketData)) {
                    globalMarketData = newMarketData;
                    filterProducts(); 
                }
            } else {
                if (globalMarketData.length === 0) {
                    showEmptyState("No live products found on the global network yet.");
                }
            }
        } catch (error) {
            console.error("Marketplace fetch error:", error);
            if (globalMarketData.length === 0) {
                showEmptyState(error.message || "Awaiting secure API connection.");
            }
        }
    }

    function renderGrid(products) {
        const grid = document.getElementById('marketGrid');
        grid.innerHTML = '';

        if (products.length === 0) {
            showEmptyState("No products match your search.");
            return;
        }

        products.forEach(product => {
            const displayPrice = product.isFlexibleAmount 
                ? 'Flexible' 
                : `₦${Number(product.amount).toLocaleString(undefined, {minimumFractionDigits:2})}`;
            
            // Extract Data, providing fallbacks if missing from DB
            const categoryDisplay = product.category || 'General';
            const merchantName = product.merchantName || product.creatorName || 'Verified Merchant';
            
            // FIXED: Scan deep within nested database payloads (merchantSupport object)
            const email = product.email || product.creatorEmail || (product.merchantSupport && product.merchantSupport.email) || 'Not Provided';
            const whatsapp = product.whatsapp || product.creatorWhatsapp || (product.merchantSupport && product.merchantSupport.phone) || 'Not Provided';
            
            const shortDesc = product.description || 'Secure NATERPAY Checkout';
            const salesCount = product.transactionCount || 0;
            
            let mediaHeaderHTML = '';
            if (product.productImageBase64) {
                mediaHeaderHTML = `
                    <div class="product-image-header" style="background-image: url('${product.productImageBase64}');">
                        <div class="badge-category"><i class="fas fa-tag"></i> ${categoryDisplay}</div>
                        <div class="badge-verified"><i class="fas fa-shield-check"></i> VERIFIED</div>
                    </div>`;
            } else {
                mediaHeaderHTML = `
                    <div class="store-icon-fallback">
                        <i class="fas fa-box-open"></i>
                        <div class="badge-category"><i class="fas fa-tag"></i> ${categoryDisplay}</div>
                        <div class="badge-verified"><i class="fas fa-shield-check"></i> VERIFIED</div>
                    </div>`;
            }

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                ${mediaHeaderHTML}
                <div class="product-details">
                    
                    <h3 class="product-title">${product.title}</h3>
                    
                    <div class="creator-info-box">
                        <div class="creator-name" title="Creator Name"><i class="fas fa-user-circle"></i> ${merchantName}</div>
                        <div class="creator-email" title="Creator Email"><i class="fas fa-envelope"></i> ${email}</div>
                        <div class="creator-whatsapp" title="Creator WhatsApp"><i class="fab fa-whatsapp"></i> ${whatsapp}</div>
                    </div>

                    <div class="product-desc">${shortDesc}</div>
                    
                    <div class="card-footer-info">
                        <div class="price-col">
                            <span class="price-label">Price</span>
                            <span class="product-price">${displayPrice}</span>
                        </div>
                        <div class="sales-col">
                            <span class="sales-stats"><i class="fas fa-chart-line text-success"></i> ${salesCount} Sold</span>
                        </div>
                    </div>
                    
                    <a href="/pay.html?id=${product.linkId || product._id}" class="btn-buy">
                        Get Secure Access <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function showEmptyState(message) {
        document.getElementById('marketGrid').innerHTML = `
            <div class="loader-container">
                <i class="fas fa-globe fa-4x mb-4 text-secondary"></i>
                <h4 class="text-white fw-bold fs-3 mb-2" style="font-family:'Cinzel';">${message}</h4>
                <p class="text-secondary fw-bold">Try adjusting your search terms.</p>
            </div>
        `;
    }

    function filterProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        
        const filtered = globalMarketData.filter(product => {
            const titleStr = (product.title || "").toLowerCase();
            const descStr = (product.description || "").toLowerCase();
            const catStr = (product.category || "").toLowerCase();
            
            return query === "" || 
                   titleStr.includes(query) || 
                   descStr.includes(query) ||
                   catStr.includes(query);
        });

        renderGrid(filtered);
    }

    window.onload = () => { 
        initStars(); 
        fetchLiveProducts(); 
        
        // Auto-refresh market data every 10 seconds
        setInterval(fetchLiveProducts, 10000); 
    };
    
    window.onresize = initStars;
</script>

</body>
</html>
