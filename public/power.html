<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Buy Electricity</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card-bg: rgba(20, 20, 20, 0.95); }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 2.5px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.4rem; } 
        .site-part-2 { color: #d32f2f; font-size: 1rem; letter-spacing: 3px; }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        
        .power-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 20px;
            padding: 40px; margin-bottom: 30px;
        }
        
        .input-group-custom {
            background: rgba(0,0,0,0.6); border: 1.5px solid rgba(212,175,55,0.35);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
        }
        .input-group-custom label {
            display: block; font-size: 0.75rem; color: var(--gold); font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
        }
        .input-group-custom input, .input-group-custom select {
            background: transparent; border: none; color: white; width: 100%;
            font-size: 1.1rem; font-weight: 700; outline: none;
        }
        
        .amount-input {
            background: rgba(0,0,0,0.6); border: 2px solid rgba(212,175,55,0.3); border-radius: 15px;
            padding: 25px; font-size: 2.5rem; color: white; font-weight: 700; text-align: center;
            width: 100%; outline: none; transition: 0.3s;
        }
        .amount-input:focus { border-color: var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        
        .btn-buy {
            background: var(--gold); color: black; font-weight: 900; border-radius: 15px;
            padding: 18px; width: 100%; border: none; font-size: 1.1rem; letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-buy:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4">Back to Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold);">BUY ELECTRICITY</h1>
    
    <div class="power-card">
        <div class="input-group-custom">
            <label>DISCO / ELECTRICITY COMPANY</label>
            <select id="disco">
                <option value="">Select Disco</option>
                <option value="ikedc">Ikeja Electric (IKEDC)</option>
                <option value="ekedc">Eko Electric (EKEDC)</option>
                <option value="aedc">Abuja Electric (AEDC)</option>
                <option value="phedc">Port Harcourt Electric (PHEDC)</option>
                <option value="kedco">Kano Electric (KEDCO)</option>
                <option value="jedc">Jos Electric (JEDC)</option>
                <option value="bedc">Benin Electric (BEDC)</option>
                <option value="eedc">Enugu Electric (EEDC)</option>
                <option value="ibedc">Ibadan Electric (IBEDC)</option>
                <option value="aedco">AEDC South</option>
            </select>
        </div>
        
        <div class="input-group-custom">
            <label>METER NUMBER</label>
            <input type="text" id="meterNumber" placeholder="Enter your meter number">
        </div>
        
        <div class="input-group-custom">
            <label>METER TYPE</label>
            <select id="meterType">
                <option value="prepaid">Prepaid</option>
                <option value="postpaid">Postpaid</option>
            </select>
        </div>
        
        <label class="small text-muted mb-2 d-block">ENTER AMOUNT (₦)</label>
        <input type="number" id="powerAmount" class="amount-input mb-4" placeholder="0.00" min="500">
        
        <div class="input-group-custom">
            <label>WITHDRAWAL PIN</label>
            <input type="password" id="withdrawalPin" placeholder="Enter your 4-digit PIN" maxlength="4">
        </div>
        
        <button class="btn-buy" onclick="buyElectricity()">
            <i class="fas fa-bolt me-2"></i> PURCHASE ELECTRICITY
        </button>
    </div>
    
    <div class="text-center text-muted small">
        <p class="mb-1">Electricity powered by VTpass</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 150; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    async function buyElectricity() {
        const disco = document.getElementById('disco').value;
        const meterNumber = document.getElementById('meterNumber').value;
        const meterType = document.getElementById('meterType').value;
        const amount = parseFloat(document.getElementById('powerAmount').value);
        const pin = document.getElementById('withdrawalPin').value;
        
        if (!disco || !meterNumber) {
            Swal.fire({
                icon: 'error',
                title: 'Missing Information',
                text: 'Please select disco and enter meter number',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        if (!amount || amount < 500) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Amount',
                text: 'Minimum electricity amount is ₦500',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        if (!pin || pin.length !== 4) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid PIN',
                text: 'Please enter your 4-digit withdrawal PIN',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            Swal.fire({
                title: 'Processing...',
                text: 'Purchasing electricity',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                background: '#0a0a0a',
                color: '#fff'
            });
            
            const res = await fetch('/api/vtu/electricity', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ 
                    meterNumber,
                    disco,
                    amount,
                    meterType,
                    pin
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Electricity Purchase Successful',
                    text: `₦${amount.toLocaleString()} electricity purchased. Token: ${data.token || 'Processing...'}`,
                    confirmButtonColor: '#d4af37',
                    background: '#0a0a0a',
                    color: '#fff'
                }).then(() => {
                    window.location.href = '/dashboard.html';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Purchase Failed',
                    text: data.message,
                    confirmButtonColor: '#d32f2f',
                    background: '#0a0a0a',
                    color: '#fff'
                });
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Processing Error',
                text: 'Unable to process electricity purchase. Please try again.',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
        }
    }
    
    window.onload = initStars;
</script>

</body>
</html>
