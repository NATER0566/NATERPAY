<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Buy Electricity</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { 
            --gold: #FFD700; 
            --gold-dim: #d4af37;
            --bg: #000000; 
            --card-bg: #111111; 
            --nater-red: #d32f2f;
        }
        * {
            box-sizing: border-box; 
        }
        body { 
            background: var(--bg); 
            color: #FFFFFF; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 3px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.6rem; } 
        .site-part-2 { color: #FF3333; font-size: 1.2rem; letter-spacing: 3px; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 15px; }
        
        .power-card {
            background: var(--card-bg); 
            border: 2px solid #444; 
            border-radius: 20px;
            padding: 30px 20px; 
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 100%;
        }
        
        .input-group-custom {
            background: #1A1A1A; 
            border: 2px solid var(--gold);
            border-radius: 15px; 
            padding: 15px 20px; 
            margin-bottom: 25px;
            width: 100%;
        }
        
        .input-group-custom label, .amount-label {
            display: block; 
            font-size: 1rem; 
            color: var(--gold); 
            font-weight: 900;
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 10px;
        }
        
        .input-group-custom input, .input-group-custom select {
            background: transparent; 
            border: none; 
            color: #FFFFFF; 
            width: 100%;
            font-size: 1.1rem; 
            font-weight: 700; 
            outline: none;
            text-overflow: ellipsis; 
        }
        
        .input-group-custom select option {
            background: #111;
            color: #FFF;
            font-size: 1rem;
        }
        
        .amount-input {
            background: #1A1A1A; 
            border: 3px solid var(--gold); 
            border-radius: 15px;
            padding: 20px; 
            font-size: 2.5rem; 
            color: #FFFFFF; 
            font-weight: 900; 
            text-align: center;
            width: 100%; 
            outline: none; 
            margin-bottom: 10px;
        }
        .amount-input:focus { box-shadow: 0 0 25px rgba(255, 215, 0, 0.5); }
        
        /* NEW PROVIDER ALERT NOTICE */
        .provider-alert {
            background: rgba(255, 215, 0, 0.1);
            border-left: 4px solid var(--gold);
            padding: 12px 15px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .provider-alert i {
            color: var(--gold);
            font-size: 1.3rem;
        }
        .provider-alert span {
            color: #ddd;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .btn-buy {
            background: var(--gold); 
            color: #000000; 
            font-weight: 900; 
            border-radius: 15px;
            padding: 20px; 
            width: 100%; 
            border: none; 
            font-size: 1.3rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-buy:hover:not(:disabled) { 
            background: #FFFFFF; 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(255,255,255,0.3); 
        }
        .btn-buy:disabled { background: #555; color: #888; transform: none; box-shadow: none; cursor: not-allowed; }
        
        .footer-text {
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.7;
        }

        /* ENTERPRISE REFRACTIVE SPINNER */
        .swal-reflective-spinner {
            position: relative; width: 90px; height: 90px; margin: 20px auto; border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(255,215,0,0.1) 0%, rgba(255,255,255,0.9) 15%, var(--gold) 30%, rgba(255,215,0,0.2) 50%, var(--gold-dim) 70%, rgba(255,255,255,0.8) 85%, rgba(255,215,0,0.1) 100%);
            animation: spinSwalReflect 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite, flashGlow 2s alternate infinite;
            box-shadow: 0 0 40px rgba(255,215,0,0.5);
        }
        .swal-reflective-spinner::before {
            content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #050505 100%);
            border-radius: 50%; border: 1px solid rgba(255,215,0,0.3); z-index: 1;
        }
        .swal-inner-icon {
            position: absolute; z-index: 2; top: 50%; left: 50%; font-size: 2rem; color: var(--gold);
            text-shadow: 0 0 20px var(--gold), 0 0 40px rgba(255,255,255,0.6);
            animation: counterSpinSwal 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spinSwalReflect { 100% { transform: rotate(360deg); } }
        @keyframes counterSpinSwal { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
        @keyframes flashGlow { 0% { box-shadow: 0 0 20px rgba(255,215,0,0.3); filter: brightness(1); } 100% { box-shadow: 0 0 60px rgba(255,215,0,0.8); filter: brightness(1.3); } }

        /* BURST STARS EFFECTS */
        .burst-star {
            position: fixed; top: 50%; left: 50%; z-index: 9999; pointer-events: none;
            color: var(--gold); font-size: 1.5rem; text-shadow: 0 0 10px rgba(255,215,0,0.8);
            animation: starExplode 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .burst-star.failed { color: var(--nater-red); text-shadow: 0 0 10px rgba(211,47,47,0.8); }
        @keyframes starExplode {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-warning rounded-pill px-4" style="font-weight: 800;">Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold); font-size: 2.5rem;">ELECTRICITY</h1>
    
    <div class="power-card">
        <div class="input-group-custom">
            <label>ELECTRICITY COMPANY</label>
            <select id="disco">
                <option value="">-- SELECT COMPANY --</option>
                <option value="ikeja-electric">Ikeja Electric (IKEDC)</option>
                <option value="eko-electric">Eko Electric (EKEDC)</option>
                <option value="abuja-electric">Abuja Electric (AEDC)</option>
                <option value="kano-electric">Kano Electric (KEDCO)</option>
                <option value="port-harcourt-electric">Port Harcourt Electric (PHEDC)</option>
                <option value="jos-electric">Jos Electric (JEDC)</option>
                <option value="ibadan-electric">Ibadan Electric (IBEDC)</option>
                <option value="kaduna-electric">Kaduna Electric (KAEDCO)</option>
                <option value="enugu-electric">Enugu Electric (EEDC)</option>
                <option value="benin-electric">Benin Electric (BEDC)</option>
                <option value="aba-electric">Aba Electric (ABEDC)</option>
                <option value="yola-electric">Yola Electric (YEDC)</option>
            </select>
        </div>
        
        <div class="input-group-custom">
            <label>METER NUMBER</label>
            <input type="text" id="meterNumber" placeholder="Enter meter number...">
        </div>
        
        <div class="input-group-custom">
            <label>METER TYPE</label>
            <select id="meterType">
                <option value="prepaid">Prepaid Meter</option>
                <option value="postpaid">Postpaid Meter</option>
            </select>
        </div>

        <div class="input-group-custom">
            <label>CUSTOMER PHONE NUMBER</label>
            <input type="tel" id="customerPhone" placeholder="Enter recipient phone number...">
        </div>
        
        <label class="amount-label text-center">ENTER AMOUNT (₦)</label>
        <input type="number" id="powerAmount" class="amount-input" placeholder="1000" min="1000">

        <!-- NEW ALERT BOX -->
        <div class="provider-alert">
            <i class="fas fa-info-circle"></i>
            <span><strong>Provider Mandate:</strong> Due to national grid policies, the minimum allowable purchase for electricity tokens is <strong>₦1,000</strong>.</span>
        </div>
        
        <div class="input-group-custom" style="border-color: #555;">
            <label style="color: #bbb;"><i class="fas fa-lock me-1"></i> SECURITY PIN</label>
            <input type="password" id="withdrawalPin" placeholder="Enter 4-digit PIN" maxlength="4" style="letter-spacing: 5px;">
        </div>
        
        <button class="btn-buy" id="btnBuy" onclick="buyElectricity()">
            <i class="fas fa-bolt me-2"></i> PAY ELECTRICITY BILL
        </button>
    </div>
    
    <div class="text-center footer-text mb-5">
        <p class="mb-1">Power Services</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 100; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    function triggerStarBurst(isSuccess = true) {
        const starCount = 40;
        const body = document.body;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.innerHTML = '★';
            star.className = isSuccess ? 'burst-star' : 'burst-star failed';
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 300 + 100;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            const rot = Math.random() * 720 - 360;
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);
            star.style.setProperty('--rot', `${rot}deg`);
            body.appendChild(star);
            setTimeout(() => { star.remove(); }, 1000);
        }
    }
    
    async function buyElectricity() {
        const disco = document.getElementById('disco').value;
        const meterNumber = document.getElementById('meterNumber').value;
        const meterType = document.getElementById('meterType').value;
        const amount = parseFloat(document.getElementById('powerAmount').value);
        const pin = document.getElementById('withdrawalPin').value;
        const phone = document.getElementById('customerPhone').value;
        
        if (!disco || !meterNumber || !phone) {
            Swal.fire({ icon: 'error', title: 'Missing Information', text: 'Please fill in all the required details, including the phone number.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            return;
        }
        
        // UPDATED VALIDATION FOR 1000 MINIMUM
        if (!amount || amount < 1000) {
            Swal.fire({ icon: 'error', title: 'Invalid Amount', text: 'As mandated by utility providers, the minimum electricity purchase is ₦1,000.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            return;
        }
        
        if (!pin || pin.length !== 4) {
            Swal.fire({ icon: 'error', title: 'Invalid PIN', text: 'Please enter your 4-digit security PIN.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            return;
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) { window.location.href = '/index.html'; return; }
        
        const btnBuy = document.getElementById('btnBuy');
        btnBuy.disabled = true;

        try {
            // ENTERPRISE HOLOGRAPHIC LOADER
            Swal.fire({
                title: 'Securing Protocol...',
                html: `
                    <div class="swal-reflective-spinner">
                        <i class="fas fa-bolt swal-inner-icon"></i>
                    </div>
                    <span style="color:#aaa; font-weight:600; font-size:0.85rem;">Encrypting payload & generating Token...</span>
                `,
                allowOutsideClick: false,
                showConfirmButton: false,
                background: '#111111', color: '#FFD700'
            });
            
            const res = await fetch('/api/vtu/electricity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                // Added phone to the payload to comply with VTPass rules
                body: JSON.stringify({ meterNumber, disco, amount, meterType, pin, phone })
            });
            
            const data = await res.json();
            
            if (data.success) {
                triggerStarBurst(true); // Success Stars
                Swal.fire({
                    icon: 'success',
                    title: 'Payment Successful!',
                    html: `<div style="font-size: 1.1rem; color: #FFF;">₦${amount.toLocaleString()} paid successfully.<br><br><strong style="color: #FFD700; font-size: 1.4rem;">Token: ${data.token || 'Check Dashboard'}</strong></div>`,
                    confirmButtonColor: '#FFD700', background: '#111111', color: '#FFFFFF'
                }).then(() => { window.location.href = '/dashboard.html'; });
            } else {
                triggerStarBurst(false); // Fail Stars
                let msg = data.message || "An error occurred.";
                if (msg.toLowerCase().includes("vtpass") || msg.toLowerCase().includes("system error") || msg.toLowerCase().includes("db error")) {
                    msg = "We encountered a temporary issue processing your payment. Please verify your details or try again later.";
                }

                Swal.fire({ icon: 'error', title: 'Transaction Failed', text: msg, confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
                btnBuy.disabled = false;
            }
        } catch (error) {
            triggerStarBurst(false); // Fail Stars
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Unable to connect to NATER-PAY servers. Please check your internet and try again.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            btnBuy.disabled = false;
        }
    }
    
    window.onload = initStars;
</script>

</body>
</html>
