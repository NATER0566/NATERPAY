<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Logging Out...</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --gold: #d4af37; --bg: #050505; }
        body { 
            background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; 
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        
        .logout-container {
            text-align: center;
            max-width: 400px;
            padding: 40px;
        }
        
        .spinner {
            width: 60px; height: 60px;
            border: 4px solid rgba(212, 175, 55, 0.3);
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h2 { font-family: 'Cinzel'; color: var(--gold); font-weight: 900; }
    </style>
</head>
<body>

<div class="logout-container">
    <div class="spinner"></div>
    <h2>SECURING SESSION...</h2>
    <p class="text-muted">Terminating secure connection and clearing credentials.</p>
</div>

<script>
    // Clear local storage
    localStorage.removeItem("naterpay_token");
    localStorage.removeItem("naterpay_profile");
    
    // Redirect after short delay
    setTimeout(() => {
        window.location.href = '/index.html';
    }, 1500);
</script>

</body>
</html>
