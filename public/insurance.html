<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Buy Insurance</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --gold: #FFD700; --bg: #000000; --card-bg: #111111; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #FFFFFF; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 3px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; }
        .site-part-1 { color: var(--gold); font-size: 1.6rem; } 
        .site-part-2 { color: #FF3333; font-size: 1.2rem; letter-spacing: 3px; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 15px; }
        
        .main-card {
            background: var(--card-bg); border: 2px solid #444; border-radius: 20px;
            padding: 30px 20px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 100%;
        }
        
        .provider-btn {
            background: #1A1A1A; border: 2.5px solid #444; border-radius: 15px;
            padding: 15px 5px; cursor: pointer; transition: 0.3s; text-align: center;
            height: 100%; min-height: 130px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden;
        }
        .provider-btn div {
            font-size: 0.95rem; color: #FFFFFF; margin-top: 8px; font-weight: 800;
            word-wrap: break-word; word-break: break-word; white-space: normal; width: 100%;
        }
        .provider-btn:hover, .provider-btn.active {
            border-color: var(--gold); background: rgba(255, 215, 0, 0.15); transform: translateY(-3px);
        }
        .provider-btn.active div { color: var(--gold); font-weight: 900; }
        
        .input-group-custom {
            background: #1A1A1A; border: 2px solid var(--gold); border-radius: 15px; 
            padding: 15px 20px; margin-bottom: 20px; width: 100%;
        }
        .input-group-custom label, .amount-label {
            display: block; font-size: 0.95rem; color: var(--gold); font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
        }
        .input-group-custom input, .input-group-custom select {
            background: transparent; border: none; color: #FFFFFF; width: 100%;
            font-size: 1.1rem; font-weight: 700; outline: none;
        }
        .input-group-custom select option { background: #111; color: #FFF; }
        
        .total-box {
            background: #1A1A1A; border-left: 5px solid var(--gold); padding: 15px 25px;
            border-radius: 0 15px 15px 0; margin-bottom: 25px;
        }
        
        .btn-buy {
            background: var(--gold); color: #000000; font-weight: 900; border-radius: 15px;
            padding: 20px; width: 100%; border: none; font-size: 1.3rem; letter-spacing: 1px;
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-buy:hover { background: #FFFFFF; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.3); }

        .footer-text { color: #FFFFFF; font-size: 0.9rem; font-weight: 600; opacity: 0.7; }
        
        #vehicleDetailsSection { display: none; }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-warning rounded-pill px-4" style="font-weight: 800;">Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold); font-size: 2.5rem;">INSURANCE</h1>
    
    <div class="main-card">
        <label class="amount-label text-center mb-3">1. Select Insurance Type</label>
        
        <div class="row g-2 mb-4">
            <div class="col-12 col-md-4">
                <div class="provider-btn active" onclick="selectProvider(this, 'ui-insure')">
                    <i class="fas fa-car-crash fa-2x" style="color: #4da6ff;"></i>
                    <div>Universal Motor Insurance</div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="provider-btn" onclick="selectProvider(this, 'personal-accident')">
                    <i class="fas fa-user-shield fa-2x" style="color: #2eb82e;"></i>
                    <div>Personal Accident</div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="provider-btn" onclick="selectProvider(this, 'home-cover')">
                    <i class="fas fa-house-damage fa-2x" style="color: #ff3333;"></i>
                    <div>Home Cover</div>
                </div>
            </div>
        </div>

        <div class="input-group-custom">
            <label>INSURANCE PACKAGE</label>
            <select id="insurancePlan" onchange="updateTotal()">
                <option value="1" data-price="3000">Private Vehicle - ₦3,000</option>
                <option value="2" data-price="5000">Commercial Vehicle - ₦5,000</option>
                <option value="3" data-price="1500">Tricycles (Keke) - ₦1,500</option>
                <option value="4" data-price="3000">Motorcycle - ₦3,000</option>
            </select>
        </div>

        <label class="amount-label text-center mt-4 mb-3">2. Personal Details</label>
        
        <div class="row g-2">
            <div class="col-12 col-md-6">
                <div class="input-group-custom">
                    <label>FULL NAME</label>
                    <input type="text" id="fullName" placeholder="Enter Full Name">
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="input-group-custom">
                    <label>PHONE NUMBER</label>
                    <input type="tel" id="phoneNumber" placeholder="08012345678" maxlength="11">
                </div>
            </div>
        </div>

        <div id="vehicleDetailsSection" style="display: block;">
            <label class="amount-label text-center mt-3 mb-3">3. Vehicle Details</label>
            <div class="row g-2">
                <div class="col-12 col-md-6">
                    <div class="input-group-custom">
                        <label>PLATE NUMBER</label>
                        <input type="text" id="plateNumber" placeholder="e.g. ABC123XY" style="text-transform: uppercase;">
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="input-group-custom">
                        <label>CHASSIS NUMBER</label>
                        <input type="text" id="chassisNumber" placeholder="Enter Chassis No">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="input-group-custom mt-3">
            <label>WITHDRAWAL PIN</label>
            <input type="password" id="withdrawalPin" placeholder="Enter 4-digit PIN" maxlength="4">
        </div>
        
        <div class="total-box">
            <span class="amount-label" style="margin-bottom: 4px;">TOTAL PREMIUM</span>
            <div class="h2 fw-bold" style="color: #FFFFFF;" id="totalAmount">₦3,000</div>
        </div>
        
        <button class="btn-buy" onclick="buyInsurance()">
            <i class="fas fa-shield-alt me-2"></i> SECURE POLICY NOW
        </button>
    </div>
    
    <div class="text-center footer-text mb-5">
        <p class="mb-1">Insurance Policies Issued Instantly</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    let selectedProvider = 'ui-insure';
    let currentPrice = 3000;
    
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        for(let i = 0; i < 100; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    function selectProvider(element, provider) {
        document.querySelectorAll('.provider-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedProvider = provider;

        const vehicleSection = document.getElementById('vehicleDetailsSection');
        const planSelect = document.getElementById('insurancePlan');

        if(provider === 'ui-insure') {
            vehicleSection.style.display = 'block';
            planSelect.innerHTML = `
                <option value="1" data-price="3000">Private Vehicle - ₦3,000</option>
                <option value="2" data-price="5000">Commercial Vehicle - ₦5,000</option>
                <option value="3" data-price="1500">Tricycles (Keke) - ₦1,500</option>
                <option value="4" data-price="3000">Motorcycle - ₦3,000</option>
            `;
        } else {
            vehicleSection.style.display = 'none';
            planSelect.innerHTML = `
                <option value="default" data-price="1500">Standard Cover - ₦1,500</option>
                <option value="premium" data-price="5000">Premium Cover - ₦5,000</option>
            `;
        }
        updateTotal();
    }
    
    function updateTotal() {
        const select = document.getElementById('insurancePlan');
        currentPrice = parseFloat(select.options[select.selectedIndex].getAttribute('data-price'));
        document.getElementById('totalAmount').innerText = '₦' + currentPrice.toLocaleString();
    }
    
    async function buyInsurance() {
        const fullName = document.getElementById('fullName').value;
        const phone = document.getElementById('phoneNumber').value;
        const plan = document.getElementById('insurancePlan').value;
        const pin = document.getElementById('withdrawalPin').value;
        const plateNumber = document.getElementById('plateNumber').value;
        const chassisNumber = document.getElementById('chassisNumber').value;
        
        if (!fullName || phone.length < 10) {
            Swal.fire({ icon: 'error', title: 'Invalid Entry', text: 'Please enter a valid Name and Phone Number.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            return;
        }
        if (selectedProvider === 'ui-insure' && (!plateNumber || !chassisNumber)) {
            Swal.fire({ icon: 'error', title: 'Missing Details', text: 'Motor Insurance requires Plate and Chassis numbers.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            return;
        }
        if (!pin || pin.length !== 4) {
            Swal.fire({ icon: 'error', title: 'Invalid PIN', text: 'Please enter your 4-digit security PIN.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            return;
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) { window.location.href = '/index.html'; return; }
        
        try {
            Swal.fire({
                title: 'Securing Policy...',
                html: '<span style="color: #FFF; font-size: 1.1rem;">NATER-PAY is securely generating your Insurance Certificate...</span>',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                background: '#111111', color: '#FFD700'
            });
            
            const res = await fetch('/api/vtu/insurance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ 
                    provider: selectedProvider, 
                    fullName, phone, plan, amount: currentPrice, pin,
                    vehicleDetails: selectedProvider === 'ui-insure' ? { plateNumber, chassisNumber } : null
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({
                    icon: 'success', title: 'Policy Active!',
                    html: `<div style="font-size: 1.1rem; color: #FFF;">Your Insurance Policy has been successfully generated.<br><br><strong style="color: #FFD700; font-size: 1.2rem;">${data.token || 'Certificate sent via SMS/Email'}</strong></div>`,
                    confirmButtonColor: '#FFD700', background: '#111111', color: '#FFFFFF'
                }).then(() => { window.location.href = '/dashboard.html'; });
            } else {
                let msg = data.message || "An error occurred.";
                if (msg.toLowerCase().includes("vtpass") || msg.toLowerCase().includes("db error")) {
                    msg = "We encountered a temporary issue generating your policy. Please verify your details or try again.";
                }
                Swal.fire({ icon: 'error', title: 'Transaction Failed', text: msg, confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Network Connection', text: 'Please check your internet connection and try again.', confirmButtonColor: '#FF3333', background: '#111111', color: '#FFFFFF' });
        }
    }
    
    window.onload = initStars;
</script>

</body>
</html>
