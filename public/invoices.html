<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Smart Invoicing Engine</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.4); --bg: #030303; --card-bg: rgba(15, 15, 15, 0.85); --red: #ff3333; --green: #00ff88; --blue: #00bfff; }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(10px);
        }

        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; line-height: 0.85;}
        .site-part-1 { color: var(--gold); font-size: 1.6rem; text-shadow: 0 0 10px var(--gold-glow); } 
        .site-part-2 { color: var(--red); font-size: 1.1rem; letter-spacing: 3px; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        .header-title { font-family: 'Cinzel', serif; color: var(--gold); font-weight: 900; text-align: center; margin-bottom: 30px; font-size: 2.2rem; text-shadow: 0 0 15px var(--gold-glow); }

        /* Dashboard Mini-Stats */
        .stats-row { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
        .stat-box { 
            flex: 1; min-width: 250px; background: var(--card-bg); border: 1px solid #333; 
            border-radius: 20px; padding: 25px; display: flex; align-items: center; gap: 20px;
            backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .stat-box:hover { border-color: var(--gold); transform: translateY(-5px); }
        .stat-icon { background: rgba(255,215,0,0.1); width: 60px; height: 60px; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; color: var(--gold); }
        .stat-details h6 { color: #888; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
        .stat-details h3 { color: #FFF; font-size: 1.8rem; font-weight: 900; margin: 5px 0 0 0; font-family: 'Cinzel', serif; }

        /* Creator Card */
        .creator-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 25px;
            padding: 40px 30px; margin-bottom: 40px; backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden;
        }
        .creator-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

        .input-group-custom { background: #111; border: 1.5px solid #333; border-radius: 15px; padding: 15px 20px; margin-bottom: 20px; transition: 0.3s; }
        .input-group-custom:focus-within { border-color: var(--gold); box-shadow: 0 0 15px var(--gold-glow); }
        .input-group-custom label { display: block; font-size: 0.75rem; color: var(--gold); font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .input-group-custom input, .input-group-custom textarea {
            background: transparent; border: none; color: white; width: 100%; font-size: 1.1rem; font-weight: 600; outline: none;
        }
        
        /* Interactive Item Rows */
        .item-list-container { background: #0a0a0a; border: 1px solid #222; border-radius: 15px; padding: 20px; margin-bottom: 25px; }
        .item-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .item-input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px 15px; border-radius: 10px; outline: none; font-weight: 600; width: 100%; transition: 0.3s; }
        .item-input:focus { border-color: var(--gold); }
        .btn-remove { background: rgba(255, 51, 51, 0.1); color: var(--red); border: 1px solid rgba(255, 51, 51, 0.3); border-radius: 10px; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
        .btn-remove:hover { background: var(--red); color: #fff; }

        /* Live Total Calculator */
        .live-calc-box { background: linear-gradient(145deg, #111 0%, #1a1a1a 100%); border: 1px solid var(--gold); border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.1); }
        .calc-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; color: #aaa; font-size: 0.95rem; }
        .calc-line.total { border-top: 1px dashed #444; padding-top: 15px; margin-top: 10px; font-size: 1.5rem; color: var(--gold); font-weight: 900; font-family: 'Cinzel', serif; }
        
        .btn-create {
            background: var(--gold); color: black; font-weight: 900; border-radius: 15px;
            padding: 20px; width: 100%; border: none; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s;
        }
        .btn-create:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,255,255,0.2); }

        /* Ledger Grid */
        .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .invoice-item {
            background: rgba(20,20,20,0.9); border: 1px solid #333; border-radius: 20px;
            padding: 25px; transition: 0.3s; position: relative; display: flex; flex-direction: column;
        }
        .invoice-item:hover { border-color: var(--gold); box-shadow: 0 10px 25px rgba(0,0,0,0.8); transform: translateY(-5px); }
        .inv-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .inv-title { font-weight: 900; font-size: 1.2rem; margin: 0; color: #fff; text-transform: uppercase; }
        .inv-email { font-size: 0.8rem; color: #888; font-family: monospace; }
        
        .status-pill { padding: 5px 12px; border-radius: 50px; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; }
        .status-draft { background: rgba(102, 102, 102, 0.2); color: #ccc; border-color: #666; }
        .status-sent { background: rgba(0, 191, 255, 0.2); color: var(--blue); border-color: var(--blue); }
        .status-paid { background: rgba(0, 255, 136, 0.2); color: var(--green); border-color: var(--green); }
        .status-overdue { background: rgba(255, 51, 51, 0.2); color: var(--red); border-color: var(--red); }

        .inv-amount { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 900; color: var(--gold); margin: 15px 0; }
        .inv-date { font-size: 0.8rem; color: #666; font-weight: 600; margin-bottom: 20px; flex-grow: 1; }

        .act-btn { width: 100%; background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; transition: 0.3s; text-align: center; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .act-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4 fw-bold"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
</header>

<div class="container">
    <h1 class="header-title"><i class="fas fa-file-invoice-dollar me-2"></i> SMART LEDGER</h1>

    <div class="stats-row">
        <div class="stat-box">
            <div class="stat-icon" style="color: var(--blue); background: rgba(0, 191, 255, 0.1);"><i class="fas fa-file-export"></i></div>
            <div class="stat-details">
                <h6>Total Billed (Sent)</h6>
                <h3 id="dashTotalBilled">₦0.00</h3>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-icon" style="color: var(--green); background: rgba(0, 255, 136, 0.1);"><i class="fas fa-check-double"></i></div>
            <div class="stat-details">
                <h6>Total Collected</h6>
                <h3 id="dashTotalPaid">₦0.00</h3>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-icon" style="color: var(--red); background: rgba(255, 51, 51, 0.1);"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="stat-details">
                <h6>Outstanding</h6>
                <h3 id="dashOutstanding">₦0.00</h3>
            </div>
        </div>
    </div>

    <div class="creator-card">
        <h5 class="mb-4 text-center" style="font-family: 'Cinzel'; color: var(--gold); font-weight: 900; letter-spacing: 1px;">DRAFT NEW INVOICE</h5>
        
        <div class="row g-3">
            <div class="col-md-4">
                <div class="input-group-custom">
                    <label>CUSTOMER NAME</label>
                    <input type="text" id="customerName" placeholder="Business or Client Name">
                </div>
            </div>
            <div class="col-md-4">
                <div class="input-group-custom">
                    <label>CUSTOMER EMAIL</label>
                    <input type="email" id="customerEmail" placeholder="client@domain.com">
                </div>
            </div>
            <div class="col-md-4">
                <div class="input-group-custom">
                    <label>DUE DATE</label>
                    <input type="date" id="dueDate" style="color: #var(--gold);">
                </div>
            </div>
        </div>
        
        <label style="color: var(--gold); font-weight: 900; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px; display: block;">INVOICE ITEMS</label>
        <div class="item-list-container">
            <div id="itemsContainer">
                <div class="item-row">
                    <input type="text" class="item-input" style="flex: 3;" placeholder="Item Description" oninput="calculateLiveTotal()">
                    <input type="number" class="item-input text-center" style="flex: 1;" placeholder="Qty" value="1" min="1" oninput="calculateLiveTotal()">
                    <input type="number" class="item-input text-end" style="flex: 1.5;" placeholder="Unit Price (₦)" oninput="calculateLiveTotal()">
                    <div class="btn-remove" onclick="removeItem(this)"><i class="fas fa-times"></i></div>
                </div>
            </div>
            <button type="button" class="btn btn-outline-warning btn-sm rounded-pill mt-3 fw-bold px-3" onclick="addItem()">
                <i class="fas fa-plus me-1"></i> Add Another Row
            </button>
        </div>
        
        <div class="row g-3">
            <div class="col-md-6">
                <div class="input-group-custom">
                    <label>TAX RATE (%)</label>
                    <input type="number" id="taxRate" placeholder="0" value="0" min="0" oninput="calculateLiveTotal()">
                </div>
            </div>
            <div class="col-md-6">
                <div class="input-group-custom">
                    <label>DISCOUNT RATE (%)</label>
                    <input type="number" id="discountRate" placeholder="0" value="0" min="0" oninput="calculateLiveTotal()">
                </div>
            </div>
        </div>

        <div class="live-calc-box">
            <div class="calc-line"><span>Subtotal:</span> <span id="liveSubtotal">₦0.00</span></div>
            <div class="calc-line"><span>Tax Amount:</span> <span id="liveTax" style="color: var(--red);">+ ₦0.00</span></div>
            <div class="calc-line"><span>Discount:</span> <span id="liveDiscount" style="color: var(--green);">- ₦0.00</span></div>
            <div class="calc-line total"><span>FINAL TOTAL:</span> <span id="liveTotal">₦0.00</span></div>
        </div>
        
        <div class="input-group-custom mb-4">
            <label>PAYMENT NOTES (OPTIONAL)</label>
            <textarea id="invoiceNotes" rows="2" placeholder="e.g. Thank you for your business. Please pay within 7 days."></textarea>
        </div>
        
        <button class="btn-create" onclick="createInvoice()">
            <i class="fas fa-paper-plane me-2"></i> ISSUE INVOICE
        </button>
    </div>
    
    <h5 class="mb-4" style="font-family: 'Cinzel'; color: #fff; font-weight: 800; border-left: 4px solid var(--gold); padding-left: 10px;">INVOICE LEDGER</h5>
    
    <div id="invoicesContainer" class="links-grid">
        <div class="text-center py-5 opacity-50 w-100" style="grid-column: 1 / -1;">
            <i class="fas fa-spinner fa-spin fa-2x mb-3 text-warning"></i><br>Decrypting Ledger Records...
        </div>
    </div>
    
    <div class="text-center text-muted small mt-5 mb-4 fw-bold">
        <p class="mb-1">Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    function initStars() {
        const c = document.getElementById('starCanvas');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const ctx = c.getContext('2d');
        const stars = [];
        for(let i = 0; i < 100; i++) stars.push({ x: Math.random() * c.width, y: Math.random() * c.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        function animate() {
            ctx.clearRect(0, 0, c.width, c.height);
            stars.forEach(s => { ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white"; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; s.y += s.v; if(s.y > c.height) s.y = -5; });
            requestAnimationFrame(animate);
        }
        animate();
        
        // Pre-fill date to today
        document.getElementById('dueDate').valueAsDate = new Date();
    }
    
    function addItem() {
        const container = document.getElementById('itemsContainer');
        const newRow = document.createElement('div');
        newRow.className = 'item-row';
        newRow.innerHTML = `
            <input type="text" class="item-input" style="flex: 3;" placeholder="Item Description" oninput="calculateLiveTotal()">
            <input type="number" class="item-input text-center" style="flex: 1;" placeholder="Qty" value="1" min="1" oninput="calculateLiveTotal()">
            <input type="number" class="item-input text-end" style="flex: 1.5;" placeholder="Unit Price (₦)" oninput="calculateLiveTotal()">
            <div class="btn-remove" onclick="removeItem(this)"><i class="fas fa-times"></i></div>
        `;
        container.appendChild(newRow);
    }
    
    function removeItem(button) {
        const row = button.closest('.item-row');
        if (document.querySelectorAll('.item-row').length > 1) {
            row.remove();
            calculateLiveTotal();
        } else {
            // If it's the last row, just clear it
            const inputs = row.querySelectorAll('input');
            inputs[0].value = ''; inputs[1].value = '1'; inputs[2].value = '';
            calculateLiveTotal();
        }
    }

    // Dynamic Math Engine
    function calculateLiveTotal() {
        let subtotal = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const inputs = row.querySelectorAll('input');
            const qty = parseFloat(inputs[1].value) || 0;
            const price = parseFloat(inputs[2].value) || 0;
            subtotal += (qty * price);
        });

        const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
        const discountRate = parseFloat(document.getElementById('discountRate').value) || 0;

        const taxAmount = subtotal * (taxRate / 100);
        const discountAmount = subtotal * (discountRate / 100);
        const finalTotal = subtotal + taxAmount - discountAmount;

        document.getElementById('liveSubtotal').innerText = '₦' + subtotal.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
        document.getElementById('liveTax').innerText = '+ ₦' + taxAmount.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
        document.getElementById('liveDiscount').innerText = '- ₦' + discountAmount.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
        document.getElementById('liveTotal').innerText = '₦' + Math.max(0, finalTotal).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    
    async function createInvoice() {
        const customerName = document.getElementById('customerName').value.trim();
        const customerEmail = document.getElementById('customerEmail').value.trim();
        const dueDate = document.getElementById('dueDate').value;
        const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
        const discountRate = parseFloat(document.getElementById('discountRate').value) || 0;
        const notes = document.getElementById('invoiceNotes').value.trim();
        
        const items = [];
        document.querySelectorAll('.item-row').forEach(row => {
            const inputs = row.querySelectorAll('input');
            const description = inputs[0].value.trim();
            const quantity = parseFloat(inputs[1].value) || 0;
            const unitPrice = parseFloat(inputs[2].value) || 0;
            if (description && quantity > 0 && unitPrice > 0) items.push({ description, quantity, unitPrice });
        });
        
        if (!customerName || !customerEmail || items.length === 0) {
            Swal.fire({ icon: 'error', title: 'Incomplete Ledger', text: 'Provide Name, Email, and at least 1 valid item with a price.', confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
            return;
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) { window.location.href = '/index.html'; return; }
        
        try {
            Swal.fire({ title: 'Minting Invoice...', html: '<span style="color:#aaa;">Encrypting billing data into the ledger...</span>', allowOutsideClick: false, didOpen: () => Swal.showLoading(), background: '#111', color: '#FFD700' });
            
            const res = await fetch('/api/invoices', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ customerName, customerEmail, items, taxRate, discountRate, dueDate, notes })
            });
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({ icon: 'success', title: 'Invoice Issued!', text: `The billing route is open and ready.`, confirmButtonColor: '#d4af37', background: '#111', color: '#fff' });
                
                // Clear Form
                document.getElementById('customerName').value = '';
                document.getElementById('customerEmail').value = '';
                document.getElementById('invoiceNotes').value = '';
                document.getElementById('itemsContainer').innerHTML = `
                    <div class="item-row">
                        <input type="text" class="item-input" style="flex: 3;" placeholder="Item Description" oninput="calculateLiveTotal()">
                        <input type="number" class="item-input text-center" style="flex: 1;" placeholder="Qty" value="1" min="1" oninput="calculateLiveTotal()">
                        <input type="number" class="item-input text-end" style="flex: 1.5;" placeholder="Unit Price (₦)" oninput="calculateLiveTotal()">
                        <div class="btn-remove" onclick="removeItem(this)"><i class="fas fa-times"></i></div>
                    </div>
                `;
                calculateLiveTotal();
                loadInvoices();
            } else {
                Swal.fire({ icon: 'error', title: 'Generation Failed', text: data.message, confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Network Connection', text: 'Server unreachable.', confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
        }
    }
    
    async function loadInvoices() {
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) { window.location.href = '/index.html'; return; }
        
        try {
            const res = await fetch('/api/invoices', { headers: { 'Authorization': `Bearer ${authToken}` } });
            const data = await res.json();
            
            const container = document.getElementById('invoicesContainer');
            
            if (data.success) {
                if (data.invoices && data.invoices.length > 0) {
                    
                    let billed = 0, paid = 0, outstanding = 0;
                    const statusClassMap = {
                        'draft': { cls: 'status-draft', icon: 'fa-pen' },
                        'sent': { cls: 'status-sent', icon: 'fa-paper-plane' },
                        'paid': { cls: 'status-paid', icon: 'fa-check-circle' },
                        'overdue': { cls: 'status-overdue', icon: 'fa-exclamation-circle' }
                    };
                    
                    container.innerHTML = data.invoices.map(inv => {
                        const amount = Number(inv.total || 0);
                        billed += amount;
                        if(inv.status === 'paid') paid += amount;
                        else outstanding += amount;

                        const sMap = statusClassMap[inv.status] || statusClassMap['draft'];
                        const linkUrl = `${window.location.origin}/invoice/${inv.invoiceId}`;
                        const dateStr = inv.dueDate ? new Date(inv.dueDate).toLocaleDateString() : 'N/A';

                        return `
                        <div class="invoice-item">
                            <div class="inv-header">
                                <div>
                                    <h3 class="inv-title">${inv.customerName}</h3>
                                    <div class="inv-email">${inv.customerEmail}</div>
                                </div>
                                <span class="status-pill ${sMap.cls}"><i class="fas ${sMap.icon}"></i> ${inv.status}</span>
                            </div>
                            
                            <div class="inv-amount">₦${amount.toLocaleString(undefined, {minimumFractionDigits:2})}</div>
                            <div class="inv-date"><i class="fas fa-calendar-alt text-secondary me-1"></i> Due: ${dateStr}</div>
                            
                            <div class="act-btn" onclick="copyInvoiceLink('${linkUrl}')">
                                <i class="fas fa-link text-warning"></i> COPY INVOICE LINK
                            </div>
                        </div>
                        `;
                    }).join('');

                    document.getElementById('dashTotalBilled').innerText = '₦' + billed.toLocaleString(undefined, {minimumFractionDigits:2});
                    document.getElementById('dashTotalPaid').innerText = '₦' + paid.toLocaleString(undefined, {minimumFractionDigits:2});
                    document.getElementById('dashOutstanding').innerText = '₦' + outstanding.toLocaleString(undefined, {minimumFractionDigits:2});

                } else {
                    container.innerHTML = '<div class="text-center py-5 opacity-50 w-100" style="grid-column: 1 / -1;"><i class="fas fa-file-invoice fa-3x mb-3 text-secondary"></i><br>No invoices generated yet.</div>';
                }
            }
        } catch (e) {
            container.innerHTML = '<div class="text-center py-5 text-danger w-100" style="grid-column: 1 / -1;">Failed to sync invoice ledger.</div>';
        }
    }
    
    function copyInvoiceLink(linkUrl) {
        navigator.clipboard.writeText(linkUrl).then(() => {
            Swal.fire({ icon: 'success', title: 'Route Copied', text: 'Invoice link copied to clipboard', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, background: '#111', color: '#fff' });
        });
    }
    
    window.onload = () => { initStars(); loadInvoices(); };
    window.onresize = initStars;
</script>

</body>
</html>
