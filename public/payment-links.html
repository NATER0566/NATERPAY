<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Payment Links</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card-bg: rgba(20, 20, 20, 0.95); }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 2.5px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.4rem; } 
        .site-part-2 { color: #d32f2f; font-size: 1rem; letter-spacing: 3px; }

        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        
        .link-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 20px;
            padding: 30px; margin-bottom: 30px;
        }
        
        .input-group-custom {
            background: rgba(0,0,0,0.6); border: 1.5px solid rgba(212,175,55,0.35);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
        }
        .input-group-custom label {
            display: block; font-size: 0.75rem; color: var(--gold); font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
        }
        .input-group-custom input, .input-group-custom textarea {
            background: transparent; border: none; color: white; width: 100%;
            font-size: 1.1rem; font-weight: 700; outline: none;
        }
        
        .amount-input {
            background: rgba(0,0,0,0.6); border: 2px solid rgba(212,175,55,0.3); border-radius: 15px;
            padding: 25px; font-size: 2rem; color: white; font-weight: 700; text-align: center;
            width: 100%; outline: none; transition: 0.3s;
        }
        .amount-input:focus { border-color: var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        
        .btn-create {
            background: var(--gold); color: black; font-weight: 900; border-radius: 15px;
            padding: 18px; width: 100%; border: none; font-size: 1.1rem; letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-create:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
        
        .existing-link {
            background: rgba(30,30,30,0.95); border: 1px solid #444; border-radius: 15px;
            padding: 20px; margin-bottom: 15px;
        }
        
        .copy-btn {
            background: rgba(212,175,55,0.2); border: 1px solid var(--gold); color: var(--gold);
            padding: 8px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600;
            transition: 0.3s;
        }
        .copy-btn:hover { background: var(--gold); color: black; }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4">Back to Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold);">PAYMENT LINKS</h1>
    
    <div class="link-card">
        <h5 class="mb-3" style="font-family: 'Cinzel'; color: var(--gold);">CREATE NEW PAYMENT LINK</h5>
        
        <div class="input-group-custom">
            <label>LINK TITLE</label>
            <input type="text" id="linkTitle" placeholder="e.g. Product Payment">
        </div>
        
        <div class="input-group-custom">
            <label>DESCRIPTION</label>
            <textarea id="linkDescription" rows="2" placeholder="Brief description of what this payment is for"></textarea>
        </div>
        
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <div class="input-group-custom">
                    <label>AMOUNT (₦)</label>
                    <input type="number" id="linkAmount" placeholder="0.00">
                </div>
            </div>
            <div class="col-md-6">
                <div class="input-group-custom">
                    <label>CURRENCY</label>
                    <select id="linkCurrency">
                        <option value="NGN">NGN</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="flexibleAmount">
            <label class="form-check-label" for="flexibleAmount">Allow customers to enter their own amount</label>
        </div>
        
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="collectName" checked>
            <label class="form-check-label" for="collectName">Collect customer name</label>
        </div>
        
        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="collectEmail" checked>
            <label class="form-check-label" for="collectEmail">Collect customer email</label>
        </div>
        
        <button class="btn-create" onclick="createPaymentLink()">
            <i class="fas fa-link me-2"></i> CREATE PAYMENT LINK
        </button>
    </div>
    
    <div class="link-card">
        <h5 class="mb-3" style="font-family: 'Cinzel'; color: var(--gold);">YOUR PAYMENT LINKS</h5>
        
        <div id="linksContainer">
            <div class="text-center py-5 opacity-50">
                <i class="fas fa-spinner fa-spin me-2"></i> Loading payment links...
            </div>
        </div>
    </div>
    
    <div class="text-center text-muted small">
        <p class="mb-1">Accept payments from anyone, anywhere</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 150; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    async function createPaymentLink() {
        const title = document.getElementById('linkTitle').value;
        const description = document.getElementById('linkDescription').value;
        const amount = parseFloat(document.getElementById('linkAmount').value);
        const currency = document.getElementById('linkCurrency').value;
        const isFlexibleAmount = document.getElementById('flexibleAmount').checked;
        const collectName = document.getElementById('collectName').checked;
        const collectEmail = document.getElementById('collectEmail').checked;
        
        if (!title || !amount) {
            Swal.fire({
                icon: 'error',
                title: 'Missing Information',
                text: 'Please provide a title and amount',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
            return;
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            Swal.fire({
                title: 'Creating Link...',
                text: 'Generating your payment link',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                background: '#0a0a0a',
                color: '#fff'
            });
            
            const res = await fetch('/api/payment-links', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ 
                    title, description, amount, currency, isFlexibleAmount,
                    collectCustomerName: collectName, collectCustomerEmail: collectEmail
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Payment Link Created',
                    text: `Your payment link is ready to share`,
                    confirmButtonColor: '#d4af37',
                    background: '#0a0a0a',
                    color: '#fff'
                });
                loadPaymentLinks();
                
                // Clear form
                document.getElementById('linkTitle').value = '';
                document.getElementById('linkDescription').value = '';
                document.getElementById('linkAmount').value = '';
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Creation Failed',
                    text: data.message,
                    confirmButtonColor: '#d32f2f',
                    background: '#0a0a0a',
                    color: '#fff'
                });
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Creation Error',
                text: 'Unable to create payment link. Please try again.',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
        }
    }
    
    async function loadPaymentLinks() {
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            const res = await fetch('/api/payment-links', {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const data = await res.json();
            
            if (data.success) {
                const container = document.getElementById('linksContainer');
                
                if (data.links && data.links.length > 0) {
                    container.innerHTML = data.links.map(link => `
                        <div class="existing-link">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h6 class="fw-bold mb-1">${link.title}</h6>
                                    <small class="text-muted">${link.description || 'No description'}</small>
                                </div>
                                <span class="badge ${link.isActive ? 'bg-success' : 'bg-danger'}">${link.isActive ? 'Active' : 'Inactive'}</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="fw-bold text-warning">₦${Number(link.amount).toLocaleString()}</span>
                                    <small class="text-muted ms-2">${link.transactionCount || 0} transactions</small>
                                </div>
                                <button class="copy-btn" onclick="copyLink('${link.linkId}')">
                                    <i class="fas fa-copy me-1"></i> Copy Link
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="text-center py-5 opacity-50">No payment links created yet</div>';
                }
            }
        } catch (e) {
            console.error('Failed to load payment links');
            document.getElementById('linksContainer').innerHTML = '<div class="text-center py-5 opacity-50">Failed to load payment links</div>';
        }
    }
    
    function copyLink(linkId) {
        const linkUrl = `${window.location.origin}/pay/${linkId}`;
        navigator.clipboard.writeText(linkUrl).then(() => {
            Swal.fire({
                icon: 'success',
                title: 'Link Copied',
                text: 'Payment link copied to clipboard',
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2000,
                background: '#0a0a0a',
                color: '#fff'
            });
        });
    }
    
    window.onload = () => {
        initStars();
        loadPaymentLinks();
    };
</script>

</body>
</html>
