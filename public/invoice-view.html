<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NATERPAY Invoice</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030303;color:#fff;font-family:Arial,sans-serif}
    main{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #d4af37;border-radius:16px}
    h1{color:#d4af37}label{display:block;margin:14px 0 6px}input,button{width:100%;padding:12px;border-radius:8px;box-sizing:border-box}input{background:#111;color:#fff;border:1px solid #555}button{margin-top:20px;background:#d4af37;border:0;font-weight:700;cursor:pointer}.muted{color:#aaa}.error{color:#ff8b8b}
  </style>
</head>
<body>
<main>
  <h1 id="title">Invoice Checkout</h1>
  <p id="details" class="muted">Loading invoice...</p>
  <form id="checkout" hidden>
    <label for="customerEmail">Email</label><input id="customerEmail" type="email" required autocomplete="email">
    <label for="customerName">Name</label><input id="customerName" autocomplete="name">
    <button type="submit">Continue to Flutterwave</button>
  </form>
  <p id="status" class="muted"></p>
</main>
<script>
  const id = new URLSearchParams(location.search).get('invoiceId') || new URLSearchParams(location.search).get('id');
  const ref = new URLSearchParams(location.search).get('tx_ref');
  const $ = (name) => document.getElementById(name);
  async function load() {
    if (!id) throw new Error('Invoice is missing.');
    const response = await fetch('/api/invoices/' + encodeURIComponent(id));
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.message || 'Invoice unavailable.');
    const invoice = data.invoice;
    $('title').textContent = `Invoice ${invoice.invoiceId}`;
    $('details').textContent = `${invoice.currency} ${invoice.total} - ${invoice.customerName}`;
    $('checkout').hidden = invoice.status === 'paid' || invoice.status === 'cancelled';
  }
  async function verify(reference) {
    const response = await fetch(`/api/invoices/${encodeURIComponent(id)}/pay/verify?tx_ref=${encodeURIComponent(reference)}`);
    const data = await response.json();
    $('status').textContent = data.status === 'success' ? 'Payment confirmed.' : 'Payment is still being confirmed.';
    if (data.status === 'pending') setTimeout(() => verify(reference), 5000);
  }
  $('checkout').addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = event.target.querySelector('button');
    button.disabled = true;
    try {
      const response = await fetch(`/api/invoices/${encodeURIComponent(id)}/pay`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({paymentMethod:'card', customerEmail:$('customerEmail').value, customerName:$('customerName').value})
      });
      const data = await response.json();
      if (!response.ok || !data.success) throw new Error(data.message || 'Unable to initialize payment.');
      location.href = data.checkoutUrl;
    } catch (error) { $('status').textContent = error.message; $('status').className = 'error'; button.disabled = false; }
  });
  (async () => { try { await load(); if (ref) verify(ref); } catch (error) { $('status').textContent = error.message; $('status').className = 'error'; } })();
</script>
</body>
</html>
