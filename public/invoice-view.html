<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Secure Invoice Checkout</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <style>
        :root { --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.4); --bg: #030303; --card-bg: rgba(15, 15, 15, 0.95); --red: #ff3333; --green: #00ff88; }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        /* Premium Header */
        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 2px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(15px);
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
        }
        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; line-height: 0.85; }
        .site-part-1 { color: var(--gold); font-size: 1.6rem; text-shadow: 0 0 10px var(--gold-glow); } 
        .site-part-2 { color: var(--red); font-size: 1.1rem; letter-spacing: 3px; }
        
        .secure-header-badge { background: rgba(0, 255, 136, 0.1); border: 1px solid var(--green); color: var(--green); padding: 8px 15px; border-radius: 50px; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }

        .main-wrapper { flex: 1; padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start; }

        .invoice-container { 
            background: var(--card-bg); border: 1px solid #333; border-radius: 20px; 
            width: 100%; max-width: 850px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); 
            overflow: hidden; position: relative;
        }
        .invoice-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, var(--gold), #ff4d4d, var(--gold)); }

        .invoice-header { background: #0a0a0a; padding: 40px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; }
        
        .business-logo { max-width: 160px; max-height: 80px; object-fit: contain; border-radius: 8px; }
        .fallback-logo { font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; margin: 0; text-shadow: 0 0 15px rgba(255,215,0,0.3); }
        
        .invoice-meta { text-align: right; }
        .invoice-meta h2 { color: #fff; font-family: 'Cinzel', serif; font-weight: 900; margin: 0 0 5px 0; letter-spacing: 3px; font-size: 2.5rem; }
        .invoice-id { color: var(--gold); font-family: monospace; font-size: 1.1rem; font-weight: 700; background: rgba(255,215,0,0.1); padding: 4px 10px; border-radius: 6px; display: inline-block; }

        .invoice-body { padding: 40px; }
        
        .bill-to-section { display: flex; justify-content: space-between; margin-bottom: 40px; flex-wrap: wrap; gap: 30px; background: #111; padding: 25px; border-radius: 15px; border: 1px solid #222; }
        .bill-to-box h6 { color: #888; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-size: 0.75rem; }
        .client-name { font-size: 1.3rem; font-weight: 800; margin: 0; color: #fff; }
        .client-email { color: var(--gold); margin: 5px 0 0 0; font-weight: 600; font-size: 0.9rem; }

        .status-badge { padding: 8px 25px; border-radius: 50px; font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; display: inline-flex; align-items: center; gap: 8px; }
        .status-unpaid { background: rgba(255, 51, 51, 0.1); color: var(--red); border: 1px solid rgba(255, 51, 51, 0.3); }
        .status-paid { background: rgba(0, 255, 136, 0.1); color: var(--green); border: 1px solid rgba(0, 255, 136, 0.3); }

        .table-responsive { border-radius: 12px; border: 1px solid #222; overflow: hidden; margin-bottom: 30px; }
        .table-custom { width: 100%; border-collapse: collapse; margin: 0; background: #0a0a0a; }
        .table-custom th { background: #111; color: var(--gold); padding: 18px 20px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; text-align: left; border-bottom: 2px solid #222; }
        .table-custom th.text-right, .table-custom td.text-right { text-align: right; }
        .table-custom td { padding: 18px 20px; border-bottom: 1px solid #1a1a1a; font-weight: 600; color: #ddd; font-size: 0.95rem; }
        .table-custom tr:last-child td { border-bottom: none; }

        .totals-wrapper { display: flex; justify-content: flex-end; margin-bottom: 40px; }
        .totals-box { width: 100%; max-width: 400px; background: #111; border: 1px solid #333; border-radius: 15px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .total-line { display: flex; justify-content: space-between; margin-bottom: 12px; color: #aaa; font-weight: 600; font-size: 0.95rem; }
        .total-line.fee-line { color: #ff9900; font-size: 0.85rem; border-top: 1px dashed #333; padding-top: 12px; margin-top: 5px; }
        .total-line.grand-total { border-top: 2px solid #333; margin-top: 15px; padding-top: 20px; font-size: 1.8rem; color: var(--gold); font-weight: 900; font-family: 'Cinzel', serif; align-items: center; }

        .info-blocks { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 40px; }
        .info-card { background: #0a0a0a; border: 1px solid #222; padding: 20px; border-radius: 12px; }
        .info-card h6 { color: var(--gold); font-weight: 800; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px; }
        .info-card p { color: #aaa; font-size: 0.85rem; line-height: 1.6; margin: 0; white-space: pre-wrap; }

        .payment-section { text-align: center; padding: 0 40px 50px 40px; }
        .btn-pay { background: linear-gradient(90deg, var(--gold), #ffcc00); color: #000; font-weight: 900; border-radius: 15px; padding: 22px 40px; border: none; font-size: 1.3rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(255,215,0,0.3); display: inline-flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; }
        .btn-pay:hover { background: #fff; transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255,255,255,0.3); }

        .secure-badge { color: #666; font-size: 0.75rem; font-weight: 800; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .secure-badge img { height: 20px; opacity: 0.5; }

        footer { background: #000; border-top: 1px solid #222; padding: 20px; text-align: center; margin-top: auto; }
        .footer-tag { color: #555; font-weight: 800; font-size: 0.75rem; letter-spacing: 2px; margin: 0; }

        @media (min-width: 768px) {
            .info-blocks { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <div class="secure-header-badge">
        <i class="fas fa-lock"></i> SECURE CHECKOUT
    </div>
</header>

<div class="main-wrapper">
    <div class="invoice-container" id="invoiceCard">
        <div class="py-5 text-center">
            <i class="fas fa-spinner fa-spin fa-3x text-warning mb-4 mt-5"></i>
            <h4 class="fw-bold" style="letter-spacing: 1px;">Decrypting Invoice Ledger...</h4>
        </div>
    </div>
</div>

<footer>
    <p class="footer-tag">POWERED BY NATER-PAY SECURE INFRASTRUCTURE</p>
</footer>

<script>
    let globalInvoiceData = null;
    let dynamicPaystackKey = null;
    let grandTotalToCharge = 0; 

    const currMap = { NGN: '₦', USD: '$', GBP: '£', EUR: '€', GHS: 'GH₵', KES: 'KSh', ZAR: 'R' };

    function initStars() {
        const c = document.getElementById('starCanvas');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const ctx = c.getContext('2d');
        const stars = [];
        for(let i = 0; i < 120; i++) stars.push({ x: Math.random() * c.width, y: Math.random() * c.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        function animate() {
            ctx.clearRect(0, 0, c.width, c.height);
            stars.forEach(s => { ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white"; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; s.y += s.v; if(s.y > c.height) s.y = -5; });
            requestAnimationFrame(animate);
        }
        animate();
    }

    async function loadInvoice() {
        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = urlParams.get('id');

        if (!invoiceId) {
            document.getElementById('invoiceCard').innerHTML = '<div class="py-5 text-center"><h4 class="text-danger fw-bold"><i class="fas fa-exclamation-triangle d-block mb-3 fa-3x"></i>Invalid Route</h4><p class="text-secondary">No invoice ID provided.</p></div>';
            return;
        }

        try {
            const res = await fetch(`/api/invoices/${invoiceId}`);
            const data = await res.json();

            if (data.success) {
                globalInvoiceData = data.invoice;
                dynamicPaystackKey = data.paystackPublicKey;
                renderInvoice(globalInvoiceData);
            } else {
                document.getElementById('invoiceCard').innerHTML = '<div class="py-5 text-center"><h4 class="text-danger fw-bold"><i class="fas fa-file-excel d-block mb-3 fa-3x"></i>Invoice Not Found</h4><p class="text-secondary mt-3">This invoice may have been deleted or the link is incorrect.</p></div>';
            }
        } catch (e) {
            document.getElementById('invoiceCard').innerHTML = '<div class="py-5 text-center"><h4 class="text-danger fw-bold"><i class="fas fa-wifi d-block mb-3 fa-3x"></i>Connection Error</h4><p class="text-secondary mt-3">Could not reach the NATERPAY ledger. Check your network.</p></div>';
        }
    }

    function renderInvoice(invoice) {
        const sym = currMap[invoice.currency] || '₦';

        // 1. Logo Logic (Check Cloudinary URL first, fallback to Base64, fallback to text)
        let logoHTML = `<h1 class="fallback-logo">INVOICE</h1>`;
        const logoSrc = (invoice.businessDetails && invoice.businessDetails.logoUrl) ? invoice.businessDetails.logoUrl : invoice.businessLogoBase64;
        
        if (logoSrc) {
            logoHTML = `<img src="${logoSrc}" class="business-logo" alt="Business Logo">`;
        }

        // 2. Items Engine
        let itemsHTML = '';
        if (invoice.items && invoice.items.length > 0) {
            itemsHTML = invoice.items.map(item => `
                <tr>
                    <td>${item.description}</td>
                    <td class="text-right">${item.quantity}</td>
                    <td class="text-right">${sym}${Number(item.unitPrice).toLocaleString(undefined, {minimumFractionDigits:2})}</td>
                    <td class="text-right" style="color: var(--gold);">${sym}${Number(item.total).toLocaleString(undefined, {minimumFractionDigits:2})}</td>
                </tr>
            `).join('');
        }

        // 3. Status Engine
        const isPaid = invoice.status === 'paid';
        const isOverdue = invoice.status === 'overdue';
        
        let statusHTML = `<div class="status-badge status-unpaid"><i class="fas fa-exclamation-circle"></i> OUTSTANDING</div>`;
        if (isPaid) statusHTML = `<div class="status-badge status-paid"><i class="fas fa-check-circle"></i> PAYMENT SETTLED</div>`;
        else if (isOverdue) statusHTML = `<div class="status-badge" style="background: rgba(255, 51, 51, 0.2); color: #ff3333; border: 1px solid #ff3333;"><i class="fas fa-clock"></i> OVERDUE</div>`;

        // 4. Mathematics & Fee Shifting Engine
        const subtotal = parseFloat(invoice.subtotal) || 0;
        const taxRate = parseFloat(invoice.taxRate) || 0;
        const discRate = parseFloat(invoice.discountRate) || 0;
        
        const taxAmt = subtotal * (taxRate / 100);
        const discAmt = subtotal * (discRate / 100);
        const baseTotal = parseFloat(invoice.total) || 0;

        // The exact Paystack gateway fee shifted to the customer (1.5%)
        const gatewayProcessingFee = baseTotal * 0.015;
        grandTotalToCharge = baseTotal + gatewayProcessingFee;

        // 5. Notes & Terms
        let infoBlocksHTML = '';
        if (invoice.notes || invoice.terms) {
            infoBlocksHTML = '<div class="info-blocks">';
            if (invoice.notes) infoBlocksHTML += `<div class="info-card"><h6><i class="fas fa-comment-dots me-2"></i>Message to Customer</h6><p>${invoice.notes}</p></div>`;
            if (invoice.terms) infoBlocksHTML += `<div class="info-card"><h6><i class="fas fa-file-contract me-2"></i>Terms & Conditions</h6><p>${invoice.terms}</p></div>`;
            infoBlocksHTML += '</div>';
        }

        // 6. Payment Section
        const paymentSectionHTML = isPaid 
            ? `<div class="text-center py-5 border-top border-secondary"><i class="fas fa-shield-check fa-4x mb-3" style="color: var(--green); text-shadow: 0 0 20px rgba(0,255,136,0.4);"></i><h3 style="color: var(--green); font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px;">PAYMENT SETTLED</h3><p class="text-secondary fw-bold mt-2">This invoice has been successfully paid and recorded in the ledger.</p></div>`
            : `
                <div class="payment-section border-top border-secondary pt-5">
                    <button class="btn-pay" onclick="payInvoiceWithPaystack()">
                        <i class="fas fa-lock"></i> PAY ${sym}${grandTotalToCharge.toLocaleString(undefined, {minimumFractionDigits:2})} SECURELY
                    </button>
                    <div class="secure-badge"><i class="fas fa-shield-alt"></i> Payments Processed by NATER-PAY & Paystack</div>
                </div>
            `;

        const dateStr = invoice.dueDate ? new Date(invoice.dueDate).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'N/A';
        const createStr = invoice.createdAt ? new Date(invoice.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'N/A';

        // Render HTML
        document.getElementById('invoiceCard').innerHTML = `
            <div class="invoice-header">
                <div>${logoHTML}</div>
                <div class="invoice-meta">
                    <h2>INVOICE</h2>
                    <div class="invoice-id">#${invoice.invoiceId}</div>
                </div>
            </div>

            <div class="invoice-body">
                <div class="bill-to-section">
                    <div class="bill-to-box">
                        <h6>Billed To:</h6>
                        <h4 class="client-name">${invoice.customerName}</h4>
                        <p class="client-email"><i class="fas fa-envelope me-1"></i> ${invoice.customerEmail}</p>
                    </div>
                    <div class="bill-to-box text-md-end">
                        <h6>Status & Timeline:</h6>
                        ${statusHTML}
                        <p class="mt-3 text-secondary fw-bold mb-1" style="font-size: 0.8rem;">Issued: ${createStr}</p>
                        <p class="text-white fw-bold m-0" style="font-size: 0.9rem;">Due: ${dateStr}</p>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>Item Description</th>
                                <th class="text-right">Qty</th>
                                <th class="text-right">Unit Price</th>
                                <th class="text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHTML}
                        </tbody>
                    </table>
                </div>

                <div class="totals-wrapper">
                    <div class="totals-box">
                        <div class="total-line"><span>Subtotal:</span> <span>${sym}${subtotal.toLocaleString(undefined, {minimumFractionDigits:2})}</span></div>
                        <div class="total-line"><span>Tax (${taxRate}%):</span> <span>+ ${sym}${taxAmt.toLocaleString(undefined, {minimumFractionDigits:2})}</span></div>
                        <div class="total-line" style="color: var(--green);"><span>Discount (${discRate}%):</span> <span>- ${sym}${discAmt.toLocaleString(undefined, {minimumFractionDigits:2})}</span></div>
                        <div class="total-line" style="border-top: 1px solid #333; padding-top: 12px; margin-top: 12px;"><span>Invoice Total:</span> <span style="color: #fff;">${sym}${baseTotal.toLocaleString(undefined, {minimumFractionDigits:2})}</span></div>
                        
                        ${!isPaid ? `<div class="total-line fee-line"><span>Gateway Processing Fee (1.5%):</span> <span>+ ${sym}${gatewayProcessingFee.toLocaleString(undefined, {minimumFractionDigits:2})}</span></div>` : ''}
                        
                        <div class="total-line grand-total"><span>${isPaid ? 'PAID:' : 'AMOUNT DUE:'}</span> <span>${sym}${(!isPaid ? grandTotalToCharge : baseTotal).toLocaleString(undefined, {minimumFractionDigits:2})}</span></div>
                    </div>
                </div>
                
                ${infoBlocksHTML}
            </div>
            
            ${paymentSectionHTML}
        `;
    }

    function payInvoiceWithPaystack() {
        if (!dynamicPaystackKey) {
            Swal.fire({ icon: 'error', title: 'Gateway Error', text: 'Payment system offline. Please contact the merchant.', background: '#111', color: '#fff' });
            return;
        }

        // Convert the Grand Total (Invoice + Processing Fee) to Kobo/Cents
        const amountInSubUnit = Math.round(grandTotalToCharge * 100);

        let handler = PaystackPop.setup({
            key: dynamicPaystackKey, 
            email: globalInvoiceData.customerEmail,
            amount: amountInSubUnit,
            currency: globalInvoiceData.currency || 'NGN',
            ref: 'INV_PAY_' + Math.floor((Math.random() * 1000000000) + 1),
            callback: function(response) {
                verifyInvoicePayment(response.reference);
            },
            onClose: function() {
                Swal.fire({ icon: 'info', title: 'Cancelled', text: 'Secure payment window closed.', background: '#111', color: '#fff' });
            }
        });

        handler.openIframe();
    }

    async function verifyInvoicePayment(reference) {
        Swal.fire({ title: 'Verifying...', text: 'Settling invoice ledger securely...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), background: '#111', color: '#FFD700' });
        
        try {
            const res = await fetch(`/api/invoices/${globalInvoiceData.invoiceId}/pay`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gatewayReference: reference, paymentMethod: 'paystack' })
            });
            
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({ 
                    icon: 'success', 
                    title: 'Payment Successful!', 
                    text: 'The merchant has been credited and a receipt has been logged.', 
                    confirmButtonColor: '#d4af37', background: '#111', color: '#fff' 
                }).then(() => {
                    window.location.reload();
                });
            } else {
                Swal.fire({ icon: 'error', title: 'Verification Failed', text: data.message, confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
            }
        } catch (err) {
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Failed to communicate with server.', confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
        }
    }

    window.onload = loadInvoice;
    window.onresize = initStars;
</script>

</body>
</html>
