<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Secure Checkout</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <style>
        :root { 
            --gold: #FFD700; 
            --gold-glow: rgba(255, 215, 0, 0.6); 
            --gold-subtle: rgba(255, 215, 0, 0.15);
            --gold-dim: #d4af37;
            --bg: #030303; 
            --card-bg: #0a0a0a; 
            --green: #00e676;
            --nater-red: #d32f2f;
        }
        
        * { box-sizing: border-box; }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-weight: 900;
        }

        /* HEADER */
        header {
            position: sticky; top: 0; width: 100%; padding: 12px 5%;
            background: rgba(0, 0, 0, 0.95); border-bottom: 3px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            margin-bottom: 40px;
        }
        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; line-height: 0.85;}
        .site-part-1 { color: var(--gold); font-size: 1.8rem; text-shadow: 0 0 15px var(--gold-glow); } 
        .site-part-2 { color: var(--nater-red); font-size: 1.2rem; letter-spacing: 3px; }

        @media (max-width: 480px) {
            .site-part-1 { font-size: 1.4rem; }
            .site-part-2 { font-size: 1rem; }
            header .btn { font-size: 0.8rem !important; padding: 8px 14px !important; }
        }

        /* MARKETPLACE STYLE CARD */
        .checkout-container {
            width: 100%; max-width: 500px;
            padding: 0 15px;
            margin-bottom: 60px;
        }

        .product-card {
            background: var(--card-bg); border: 2px solid var(--gold); border-radius: 20px;
            overflow: hidden; 
            position: relative; display: flex; flex-direction: column;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255,215,0,0.15);
        }

        /* COMPACT IMAGE CONTAINER */
        .product-image-header {
            width: 100%; height: 250px; background-color: #111;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            border-bottom: 2px solid #333; position: relative; cursor: pointer;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        
        .store-icon-fallback { 
            background: #111; width: 100%; height: 250px; 
            display: flex; align-items: center; justify-content: center; font-size: 3.5rem; 
            color: #333; border-bottom: 2px solid #333; position: relative; cursor: pointer;
        }

        .click-to-view {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--gold);
            color: var(--gold); padding: 5px 15px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px; pointer-events: none; z-index: 3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6); white-space: nowrap;
        }

        .badge-category {
            position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.9);
            border: 2px solid #555; color: #fff; padding: 8px 16px; border-radius: 50px; 
            font-size: 0.85rem; font-weight: 900; z-index: 2; text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .badge-verified {
            position: absolute; top: 15px; right: 15px; background: #000;
            border: 2px solid var(--green); color: var(--green); padding: 8px 16px;
            border-radius: 50px; font-size: 0.85rem; font-weight: 900; letter-spacing: 0.5px; z-index: 2;
        }

        @media (max-width: 600px) {
            .badge-verified { top: 60px; }
        }

        /* DETAILS AREA */
        .product-details { padding: 30px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        
        .product-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.5rem; margin-bottom: 20px; color: #fff; line-height: 1.3; text-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        
        .creator-info-box {
            background: rgba(0,0,0,0.6); border: 2px solid #333; border-radius: 12px;
            padding: 15px; margin-bottom: 25px; width: 100%;
            display: flex; flex-direction: column; align-items: center;
        }
        .owner-header { color: var(--gold); font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .owner-sub { color: #888; font-size: 0.85rem; font-weight: 900; margin-bottom: 12px; font-style: italic; } 
        
        .creator-info-box div.contact-row { 
            margin-bottom: 5px; font-size: 1rem; font-weight: 900; color: #eee; 
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; word-break: break-all;
        }
        .creator-info-box div.contact-row:last-child { margin-bottom: 0; }
        .creator-info-box i { width: 18px; text-align: center; font-size: 1.1rem; }
        .creator-name i { color: #fff; }
        .creator-email i { color: var(--gold); }
        
        .product-desc { 
            color: #ddd; font-size: 1rem; font-weight: 900; margin-bottom: 25px; 
            line-height: 1.6; background: rgba(0, 0, 0, 0.5); border: 2px solid #333;
            padding: 18px; border-radius: 12px; max-height: 120px; overflow-y: auto;
            word-wrap: break-word; width: 100%; box-shadow: inset 0 3px 10px rgba(0,0,0,0.5);
        }
        .product-desc::-webkit-scrollbar { width: 4px; }
        .product-desc::-webkit-scrollbar-track { background: transparent; }
        .product-desc::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
        .product-desc::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        .card-footer-info { 
            display: flex; flex-direction: column; align-items: center; 
            margin-bottom: 25px; width: 100%; gap: 15px;
        }
        
        .price-label { font-size: 0.9rem; color: #888; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px;}
        .product-price { font-family: 'Cinzel', serif; color: var(--gold); font-size: 2rem; font-weight: 900; text-shadow: 0 0 10px var(--gold-glow);}
        .sales-stats { font-size: 0.95rem; color: #fff; font-weight: 900; background: #222; padding: 10px 20px; border-radius: 50px; border: 2px solid #444;}

        .checkout-form-area { width: 100%; border-top: 2px solid #333; padding-top: 25px; margin-top: 10px;}

        .input-group-custom { background: #111; border: 1.5px solid #333; border-radius: 12px; padding: 15px 20px; margin-bottom: 20px; text-align: left; transition: 0.3s; }
        .input-group-custom:focus-within { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.2); }
        .input-group-custom label { display: block; font-size: 0.8rem; color: var(--gold); font-weight: 900; text-transform: uppercase; margin-bottom: 8px; }
        .input-group-custom input { background: transparent; border: none; color: white; width: 100%; font-size: 1.1rem; font-weight: 900; outline: none; font-family: 'Montserrat', sans-serif;}
        
        .btn-pay {
            background: linear-gradient(90deg, #111, #222); color: #fff; font-weight: 900; border-radius: 12px;
            padding: 18px; width: 100%; border: 2px solid var(--gold); font-size: 1.1rem;
            letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.4s; 
            text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
        }
        .btn-pay i { font-size: 1.3rem; transition: transform 0.3s; }
        .btn-pay:hover { background: var(--gold); color: #000; box-shadow: 0 10px 25px var(--gold-glow); transform: translateY(-3px); }

        .secure-badge { color: #555; font-size: 0.8rem; font-weight: 800; margin-top: 25px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .modal-dialog { max-width: 95vw; margin: 1.75rem auto; }
        .modal-content { background: rgba(5,5,5,0.95); border: 2px solid var(--gold); box-shadow: 0 0 40px var(--gold-glow); border-radius: 15px;}
        .modal-header { border-bottom: none; }
        #fullSizeImage { width: 100%; max-height: 85vh; object-fit: contain; border-radius: 10px; }

        /* EXTRAVAGANT SWEETALERT MODAL REFRACTIVE LOADERS */
        .swal-reflective-spinner {
            position: relative; width: 110px; height: 110px; margin: 20px auto;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(255,215,0,0.1) 0%, rgba(255,255,255,0.9) 15%, var(--gold) 30%, rgba(255,215,0,0.2) 50%, var(--gold-dim) 70%, rgba(255,255,255,0.8) 85%, rgba(255,215,0,0.1) 100%);
            animation: spinSwalReflect 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite, flashGlow 2s alternate infinite;
            box-shadow: 0 0 40px rgba(255,215,0,0.5);
        }
        .swal-reflective-spinner::before {
            content: ''; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #050505 100%);
            border-radius: 50%; border: 1px solid rgba(255,215,0,0.3); z-index: 1;
        }
        .swal-inner-icon {
            position: absolute; z-index: 2; top: 50%; left: 50%; font-size: 2.5rem; color: var(--gold);
            text-shadow: 0 0 20px var(--gold), 0 0 40px rgba(255,255,255,0.6);
            animation: counterSpinSwal 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spinSwalReflect { 100% { transform: rotate(360deg); } }
        @keyframes counterSpinSwal { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
        @keyframes flashGlow { 0% { box-shadow: 0 0 20px rgba(255,215,0,0.3); filter: brightness(1); } 100% { box-shadow: 0 0 60px rgba(255,215,0,0.8); filter: brightness(1.3); } }

        /* BURST STARS EFFECTS */
        .burst-star {
            position: fixed; top: 50%; left: 50%; z-index: 9999; pointer-events: none;
            color: var(--gold); font-size: 1.5rem; text-shadow: 0 0 10px rgba(255,215,0,0.8);
            animation: starExplode 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .burst-star.failed { color: var(--nater-red); text-shadow: 0 0 10px rgba(211,47,47,0.8); }
        @keyframes starExplode {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

    </style>
</head>
<body>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">MARKET</span>
    </div>
    <a href="javascript:history.back()" class="btn btn-outline-warning rounded-pill px-4 py-2 fw-bold" style="font-size: 1.1rem; border-width: 2px;">
        <i class="fas fa-arrow-left me-2"></i> Go Back
    </a>
</header>

<div class="checkout-container">
    <div class="product-card" id="checkoutCard">
        <div class="py-5 text-center w-100" id="loadingState">
            <div class="swal-reflective-spinner mx-auto mb-4" style="width: 80px; height: 80px;">
                <i class="fas fa-shield-alt swal-inner-icon" style="font-size: 1.8rem;"></i>
            </div>
            <p class="fw-bold fs-5" style="font-family:'Cinzel';">Securing Storefront Route...</p>
        </div>
    </div>
</div>

<!-- FULL SCREEN UNRESTRICTED IMAGE VIEWER MODAL -->
<div class="modal fade" id="imageViewerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header pb-0">
        <h5 class="modal-title text-warning fw-bold fs-5 ms-2" style="font-family: 'Cinzel';"><i class="fas fa-image"></i> Product Image Preview</h5>
        <button type="button" class="btn-close btn-close-white fs-5" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center p-4">
        <img id="fullSizeImage" src="" alt="Full Product Image">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let globalLinkData = null;
    let dynamicPaystackKey = null;

    function triggerStarBurst(isSuccess = true) {
        const starCount = 40;
        const body = document.body;
        
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.innerHTML = '★';
            star.className = isSuccess ? 'burst-star' : 'burst-star failed';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 300 + 100;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            const rot = Math.random() * 720 - 360;
            
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);
            star.style.setProperty('--rot', `${rot}deg`);
            
            body.appendChild(star);
            
            setTimeout(() => { star.remove(); }, 1000);
        }
    }

    function viewFullImage(base64String) {
        document.getElementById('fullSizeImage').src = base64String;
        const modal = new bootstrap.Modal(document.getElementById('imageViewerModal'));
        modal.show();
    }

    async function loadPaymentLink() {
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');

        if (!linkId) {
            document.getElementById('checkoutCard').innerHTML = '<div class="py-5 text-center w-100"><h4 class="text-danger fw-bold"><i class="fas fa-times-circle d-block mb-3 fa-2x"></i>Invalid Checkout Link</h4></div>';
            return;
        }

        try {
            const res = await fetch(`/api/payment-links/${linkId}`);
            const data = await res.json();

            if (data.success) {
                globalLinkData = data.link;
                dynamicPaystackKey = data.paystackPublicKey;
                
                // Add default data for display safety
                globalLinkData.merchantName = data.link.merchantName || data.link.creatorName || 'Verified Merchant';
                globalLinkData.email = data.link.email || data.link.creatorEmail || (data.link.merchantSupport && data.link.merchantSupport.email) || 'Not Provided';
                globalLinkData.category = data.link.category || 'General';
                globalLinkData.transactionCount = data.link.transactionCount || 0;
                globalLinkData.shortDesc = data.link.description || 'Secure NATERPAY Checkout';

                renderCheckout(globalLinkData);
            } else {
                document.getElementById('checkoutCard').innerHTML = '<div class="py-5 text-center w-100"><h4 class="text-danger fw-bold"><i class="fas fa-store-slash d-block mb-3 fa-2x"></i>Product Unavailable</h4><p class="text-secondary">This link may be expired or disabled by the merchant.</p></div>';
            }
        } catch (e) {
            document.getElementById('checkoutCard').innerHTML = '<div class="py-5 text-center w-100"><h4 class="text-danger fw-bold">Connection Error</h4><p class="text-secondary">Could not reach the NATERPAY ledger.</p></div>';
        }
    }

    function renderCheckout(link) {
        const displayPrice = link.isFlexibleAmount ? 'Flexible' : `₦${Number(link.amount).toLocaleString(undefined, {minimumFractionDigits:2})}`;
        
        let amountHTML = '';
        if (link.isFlexibleAmount) {
            amountHTML = `
                <div class="input-group-custom">
                    <label>Enter Amount to Pay (₦)</label>
                    <input type="number" id="customAmount" placeholder="0.00" min="100">
                </div>
            `;
        }

        let mediaHeaderHTML = '';
        if (link.productImageBase64) {
            mediaHeaderHTML = `
                <div class="product-image-header" onclick="viewFullImage('${link.productImageBase64}')" style="background-image: url('${link.productImageBase64}');">
                    <div class="badge-category"><i class="fas fa-tag me-1"></i> ${link.category}</div>
                    <div class="badge-verified"><i class="fas fa-circle text-success me-1"></i> VERIFIED</div>
                    <div class="click-to-view"><i class="fas fa-search-plus"></i> Click image to view</div>
                </div>`;
        } else {
            mediaHeaderHTML = `
                <div class="store-icon-fallback" title="No image uploaded">
                    <i class="fas fa-box-open text-secondary"></i>
                    <div class="badge-category"><i class="fas fa-tag me-1"></i> ${link.category}</div>
                    <div class="badge-verified"><i class="fas fa-circle text-success me-1"></i> VERIFIED</div>
                </div>`;
        }

        document.getElementById('checkoutCard').innerHTML = `
            ${mediaHeaderHTML}
            
            <div class="product-details">
                <h3 class="product-title">${link.title}</h3>
                
                <div class="creator-info-box">
                    <div class="owner-header"><i class="fas fa-crown"></i> Product Owner Details</div>
                    <div class="owner-sub">Contact him/her through the email if needed</div>
                    <div class="contact-row creator-name"><i class="fas fa-user-circle"></i> ${link.merchantName}</div>
                    <div class="contact-row creator-email"><i class="fas fa-envelope"></i> ${link.email}</div>
                </div>

                <div class="product-desc">${link.shortDesc}</div>

                <div class="card-footer-info">
                    <div class="price-col text-center">
                        <div class="price-label">Secure Access Price</div>
                        <div class="product-price">${displayPrice}</div>
                    </div>
                    <div class="sales-col mt-2">
                        <span class="sales-stats"><i class="fas fa-chart-line text-success me-2"></i> ${link.transactionCount} Successfully Sold</span>
                    </div>
                </div>
                
                <div class="checkout-form-area">
                    ${amountHTML}
                    <div class="input-group-custom">
                        <label>Your Full Name</label>
                        <input type="text" id="customerName" placeholder="e.g. John Doe">
                    </div>
                    <div class="input-group-custom">
                        <label>Your Email Address</label>
                        <input type="email" id="customerEmail" placeholder="e.g. email@domain.com">
                    </div>

                    <button class="btn-pay" onclick="payWithPaystack()">
                        <i class="fas fa-lock"></i> PAY SECURELY
                    </button>
                    
                    <div class="secure-badge">
                        <i class="fas fa-shield-alt"></i> Secured by Paystack
                    </div>
                </div>
            </div>
        `;
    }

    function payWithPaystack() {
        const name = document.getElementById('customerName').value.trim();
        const email = document.getElementById('customerEmail').value.trim();
        
        let finalAmount = globalLinkData.amount;
        
        if (globalLinkData.isFlexibleAmount) {
            finalAmount = parseFloat(document.getElementById('customAmount').value);
            if (!finalAmount || finalAmount < 100) {
                Swal.fire({ icon: 'error', title: 'Invalid Amount', text: 'Minimum payment is ₦100', background: '#111', color: '#fff' });
                return;
            }
        }

        if (!name || !email) {
            Swal.fire({ icon: 'error', title: 'Missing Info', text: 'Please provide your name and email so the merchant can contact you.', background: '#111', color: '#fff' });
            return;
        }

        if (!dynamicPaystackKey) {
            Swal.fire({ icon: 'error', title: 'Gateway Error', text: 'Payment system offline.', background: '#111', color: '#fff' });
            return;
        }

        const amountInKobo = Math.round(finalAmount * 100);

        let handler = PaystackPop.setup({
            key: dynamicPaystackKey, 
            email: email,
            amount: amountInKobo,
            currency: 'NGN',
            ref: 'PAY_' + Math.floor((Math.random() * 1000000000) + 1),
            callback: function(response) {
                verifyPayment(response.reference, finalAmount, name, email);
            },
            onClose: function() {
                Swal.fire({ icon: 'info', title: 'Cancelled', text: 'Payment window closed.', background: '#111', color: '#fff' });
            }
        });

        handler.openIframe();
    }

    async function verifyPayment(reference, amountPaid, customerName, customerEmail) {
        // Updated Extravagant Loader
        Swal.fire({ 
            title: 'Verifying...', 
            html: `
                <div class="swal-reflective-spinner">
                    <i class="fas fa-shield-alt swal-inner-icon"></i>
                </div>
                <span style="color:#aaa; font-weight:600; font-size:0.85rem;">Encrypting payload & verifying ledger...</span>
            `, 
            showConfirmButton: false,
            allowOutsideClick: false, 
            background: '#0a0a0a', 
            color: '#FFD700' 
        });
        
        try {
            const res = await fetch(`/api/payment-links/${globalLinkData.linkId}/pay`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gatewayReference: reference, amount: amountPaid, customerName, customerEmail })
            });
            
            const data = await res.json();
            
            if (data.success) {
                // Trigger Success Starburst
                triggerStarBurst(true);

                let redirectMessage = '';
                if (data.redirectUrl) {
                    redirectMessage = `<p class="mt-4 text-warning fw-bold"><i class="fas fa-spinner fa-spin me-2"></i> Redirecting you to your product...</p>`;
                }

                document.getElementById('checkoutCard').innerHTML = `
                    <div class="product-details py-5">
                        <div class="store-icon-fallback bg-transparent mx-auto mb-4" style="color: #00ff88; border: 2px solid #00ff88; width:100px; height:100px; border-radius:50%;"><i class="fas fa-check"></i></div>
                        <h2 class="product-title" style="color: #00ff88;">Payment Successful</h2>
                        <div class="product-desc mb-0 border-0 bg-transparent text-center">Thank you, ${customerName}. Your secure access has been granted.</div>
                        ${redirectMessage}
                    </div>
                `;
                Swal.close();

                if (data.redirectUrl) {
                    setTimeout(() => {
                        window.location.href = data.redirectUrl;
                    }, 3000); 
                }

            } else {
                // Trigger Failed Starburst
                triggerStarBurst(false);
                Swal.fire({ icon: 'error', title: 'Verification Failed', text: data.message, confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
            }
        } catch (err) {
            // Trigger Failed Starburst
            triggerStarBurst(false);
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Failed to communicate with server.', confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
        }
    }

    window.onload = loadPaymentLink;
</script>

</body>
</html>
