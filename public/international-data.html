<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Bulk SMS Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root { --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.4); --bg: #030303; --card-bg: rgba(15, 15, 15, 0.95); --sms-color: #00E5FF; }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(10px);
        }

        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; line-height: 0.85;}
        .site-part-1 { color: var(--gold); font-size: 1.6rem; text-shadow: 0 0 10px var(--gold-glow); } 
        .site-part-2 { color: #d32f2f; font-size: 1.1rem; letter-spacing: 3px; }

        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        
        .header-title { font-family: 'Cinzel', serif; color: var(--sms-color); font-weight: 900; text-align: center; margin-bottom: 20px; font-size: 2.2rem; text-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        .vtu-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 25px;
            padding: 40px 30px; margin-bottom: 30px; backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden;
        }
        .vtu-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, var(--sms-color), transparent); }

        .input-group-custom { background: #111; border: 1.5px solid #333; border-radius: 15px; padding: 15px 20px; margin-bottom: 20px; transition: 0.3s; }
        .input-group-custom:focus-within { border-color: var(--sms-color); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        .input-group-custom label { display: block; font-size: 0.75rem; color: var(--gold); font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .input-group-custom input, .input-group-custom textarea { background: transparent; border: none; color: white; width: 100%; font-size: 1.1rem; font-weight: 700; outline: none; resize: none; }
        .input-group-custom input::placeholder, .input-group-custom textarea::placeholder { color: #555; font-size: 0.95rem; }

        .btn-pay {
            background: var(--sms-color); color: black; font-weight: 900; border-radius: 15px;
            padding: 20px; width: 100%; border: none; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s;
        }
        .btn-pay:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4 fw-bold"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
</header>

<div class="container">
    <div class="text-center">
        <h1 class="header-title"><i class="fas fa-paper-plane me-2"></i> BULK SMS DISPATCH</h1>
        <p class="text-muted small fw-bold mb-4" style="letter-spacing: 1px;">POWERED BY VTPASS MESSAGING API V2</p>
    </div>
    
    <div class="vtu-card">
        <div class="input-group-custom">
            <label>Sender ID / Name</label>
            <input type="text" id="smsSender" placeholder="e.g. NATERPAY" maxlength="11">
        </div>

        <div class="input-group-custom">
            <label>Recipient Phone Numbers (Comma Separated)</label>
            <input type="text" id="smsRecipient" placeholder="e.g. 08012345678,08098765432">
        </div>

        <div class="input-group-custom">
            <label>Message Content</label>
            <textarea id="smsMessage" rows="4" placeholder="Type your notification or marketing message here..."></textarea>
        </div>

        <div class="input-group-custom mt-4 border-warning">
            <label><i class="fas fa-lock me-1"></i> AUTHORIZATION PIN</label>
            <input type="password" id="transactionPin" placeholder="Enter 4-digit PIN" maxlength="4" style="letter-spacing: 10px; font-size: 1.5rem; text-align: center;">
        </div>
        
        <button class="btn-pay" onclick="dispatchBulkSms()">
            <i class="fas fa-satellite-dish me-2"></i> SEND MESSAGES
        </button>
    </div>
</div>

<script>
    function initStars() {
        const c = document.getElementById('starCanvas');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const ctx = c.getContext('2d');
        const stars = [];
        for(let i = 0; i < 100; i++) stars.push({ x: Math.random() * c.width, y: Math.random() * c.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        function animate() {
            ctx.clearRect(0, 0, c.width, c.height);
            stars.forEach(s => { ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill(); s.y += s.v; if(s.y > c.height) s.y = -5; });
            requestAnimationFrame(animate);
        }
        animate();
    }

    async function dispatchBulkSms() {
        const sender = document.getElementById('smsSender').value.trim();
        const recipient = document.getElementById('smsRecipient').value.trim();
        const message = document.getElementById('smsMessage').value.trim();
        const pin = document.getElementById('transactionPin').value.trim();
        
        if (!sender || !recipient || !message) {
            return Swal.fire({ icon: 'warning', title: 'Incomplete', text: 'Please fill out the sender ID, recipients, and message.', background: '#111', color: '#fff' });
        }
        if (pin.length !== 4) {
            return Swal.fire({ icon: 'warning', title: 'Security Pin', text: 'Enter your 4-digit transaction PIN.', background: '#111', color: '#fff' });
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        
        Swal.fire({ 
            title: 'Broadcasting...', 
            html: '<i class="fas fa-spinner fa-spin fa-3x" style="color: var(--sms-color);"></i><br><br><span style="color:#aaa;">Sending SMS via Messaging Gateway...</span>', 
            showConfirmButton: false, allowOutsideClick: false, background: '#0a0a0a', color: '#fff' 
        });
        
        try {
            const res = await fetch('/api/vtu/sms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ sender, recipient, message, pin })
            });
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({ icon: 'success', title: 'Dispatch Successful!', text: 'Your bulk messages have been successfully queued and sent.', confirmButtonColor: '#00E5FF', background: '#111', color: '#fff' }).then(() => {
                    document.getElementById('smsSender').value = '';
                    document.getElementById('smsRecipient').value = '';
                    document.getElementById('smsMessage').value = '';
                    document.getElementById('transactionPin').value = '';
                });
            } else {
                Swal.fire({ icon: 'error', title: 'Dispatch Failed', text: data.message, confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Unable to connect to the messaging gateway.', confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
        }
    }
    
    window.onload = () => { initStars(); };
    window.onresize = initStars;
</script>
</body>
</html>
