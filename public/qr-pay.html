<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | QR Collect & Pay</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root { --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.4); --bg: #050505; --card-bg: #111111; --red: #d32f2f; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #FFFFFF; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 2px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; line-height: 0.85; }
        .site-part-1 { color: var(--gold); font-size: 1.6rem; text-shadow: 0 2px 5px var(--gold-glow); } 
        .site-part-2 { color: var(--red); font-size: 1.1rem; letter-spacing: 3px; }

        .container { max-width: 600px; margin: 40px auto; padding: 0 15px; }

        .header-title { font-family: 'Cinzel', serif; color: var(--gold); font-weight: 900; text-align: center; margin-bottom: 30px; font-size: 2.2rem; text-shadow: 0 0 15px var(--gold-glow); }

        .main-card {
            background: var(--card-bg); border: 2px solid #333; border-radius: 20px;
            padding: 35px 20px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center; position: relative; overflow: hidden;
        }

        /* QR Receive Styling */
        .qr-frame {
            background: #fff; padding: 15px; border-radius: 15px; display: inline-block;
            margin: 15px auto 25px auto; position: relative;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            border: 4px solid var(--gold);
        }
        #qrcode { display: flex; justify-content: center; align-items: center; }
        #qrcode img { display: block; border-radius: 5px; }

        .my-id-display {
            background: #1a1a1a; padding: 10px 20px; border-radius: 10px; border: 1px dashed var(--gold);
            font-family: monospace; font-size: 1.2rem; color: var(--gold); font-weight: bold; letter-spacing: 2px;
            display: inline-block; margin-bottom: 20px;
        }

        .action-btn {
            background: var(--gold); color: #000; font-weight: 900; border-radius: 15px;
            padding: 18px; width: 100%; border: none; font-size: 1.1rem; letter-spacing: 1px;
            text-transform: uppercase; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 15px;
        }
        .action-btn:hover { background: #FFF; box-shadow: 0 10px 20px rgba(255,255,255,0.3); transform: translateY(-3px); }
        
        .action-btn.secondary { background: #222; color: #FFF; border: 1px solid #555; }
        .action-btn.secondary:hover { background: #333; border-color: var(--gold); }

        /* Scanner Modal Styling */
        #scannerModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        .scanner-content {
            background: #111; width: 90%; max-width: 500px; padding: 25px; border-radius: 20px;
            border: 2px solid var(--gold); text-align: center;
        }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; border: 2px solid var(--gold) !important; box-shadow: 0 0 20px var(--gold-glow); background: #000; }
        
        .footer-text { color: #FFFFFF; font-size: 0.85rem; font-weight: 600; opacity: 0.6; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<div id="scannerModal">
    <div class="scanner-content">
        <h4 class="fw-bold mb-3" style="color: var(--gold); font-family: 'Cinzel';"><i class="fas fa-camera me-2"></i> SCAN QR</h4>
        <p class="text-secondary small mb-3">Align the NATERPAY QR code within the frame</p>
        <div id="reader"></div>
        <button class="btn btn-outline-danger fw-bold mt-4 px-4 w-100 py-2 rounded-pill" onclick="closeScanner()">Cancel Scan</button>
    </div>
</div>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-warning rounded-pill px-4 fw-bold">Dashboard</a>
</header>

<div class="container">
    <h1 class="header-title"><i class="fas fa-qrcode me-2"></i> QR COLLECT & PAY</h1>

    <div class="main-card">
        <h5 class="fw-bold mb-1" style="color: #fff;">YOUR RECEIVING CODE</h5>
        <p class="small text-secondary mb-3">Let another user scan this to transfer money to you instantly.</p>

        <div class="qr-frame">
            <div id="qrcode">
                <i class="fas fa-spinner fa-spin text-warning fa-2x my-4"></i>
            </div>
        </div>

        <div>
            <span class="small text-secondary d-block mb-1">YOUR PAY ID</span>
            <div class="my-id-display" id="myIdDisplay">Loading...</div>
        </div>

        <div class="d-flex gap-2 mt-2 mb-4">
            <button class="action-btn secondary py-3" onclick="downloadQR()">
                <i class="fas fa-download"></i> Save Code
            </button>
        </div>

        <hr style="border-color: #333; margin: 30px 0;">

        <h5 class="fw-bold mb-3" style="color: #fff;">MAKE A PAYMENT</h5>
        <button class="action-btn" onclick="openScanner()">
            <i class="fas fa-qrcode fa-lg"></i> SCAN TO PAY SOMEONE
        </button>
        <button class="action-btn secondary" onclick="manualPayInit()">
            <i class="fas fa-keyboard"></i> TYPE ID MANUALLY
        </button>
    </div>

    <div class="footer-text">
        <p class="mb-1">Encrypted Peer-to-Peer Transfer</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    let myUserId = ""; 
    let html5QrcodeScanner = null;

    function initStars() {
        const c = document.getElementById('starCanvas');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const ctx = c.getContext('2d');
        const stars = [];
        for(let i = 0; i < 120; i++) {
            stars.push({ x: Math.random() * c.width, y: Math.random() * c.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        function animate() {
            ctx.clearRect(0, 0, c.width, c.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 5; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > c.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    async function fetchUserData() {
        const authToken = localStorage.getItem("naterpay_token");
        if(!authToken) { window.location.href = '/index.html'; return; }

        try {
            const res = await fetch('/api/user/dashboard-data', { headers: { 'Authorization': `Bearer ${authToken}` } });
            const data = await res.json();
            if(data.success && data.userPhone) {
                myUserId = data.userPhone; 
                document.getElementById('myIdDisplay').innerText = myUserId;
                generateQR();
            } else {
                document.getElementById('myIdDisplay').innerText = "Error Loading ID";
            }
        } catch(e) { 
            document.getElementById('myIdDisplay').innerText = "Network Error";
        }
    }

    function generateQR() {
        if(!myUserId) return;
        const baseUrl = window.location.origin + window.location.pathname;
        const qrPayload = `${baseUrl}?pay=${myUserId}`;
        
        document.getElementById('qrcode').innerHTML = ""; 
        new QRCode(document.getElementById("qrcode"), {
            text: qrPayload, width: 220, height: 220,
            colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
        });
    }

    function downloadQR() {
        const img = document.querySelector('#qrcode img');
        if(!img) return;
        const link = document.createElement('a');
        link.href = img.src;
        link.download = 'My_NATERPAY_Code.png';
        link.click();
    }

    function checkUrlForPayment() {
        const params = new URLSearchParams(window.location.search);
        const payId = params.get('pay');
        if(payId) {
            window.history.replaceState({}, document.title, window.location.pathname);
            processTransferUI(payId);
        }
    }

    function openScanner() {
        document.getElementById('scannerModal').style.display = 'flex';
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function closeScanner() {
        if(html5QrcodeScanner) {
            html5QrcodeScanner.clear().catch(e => console.log(e));
        }
        document.getElementById('scannerModal').style.display = 'none';
    }

    function onScanFailure(error) { /* Ignore */ }

    // THE FIX: SMART SCANNER LOGIC
    function onScanSuccess(decodedText) {
        closeScanner();

        // 1. If they scanned an external Payment Link or Invoice URL, redirect them directly!
        if (decodedText.includes('pay.html?id=') || decodedText.includes('invoice-view.html?id=')) {
            window.location.href = decodedText;
            return; // Stop the P2P transfer popup
        }

        // 2. Otherwise, treat it as a P2P Transfer request
        let targetId = decodedText;
        if(decodedText.includes("?pay=")) {
            targetId = decodedText.split("?pay=")[1];
        } else if(decodedText.startsWith("NATERPAY:")) {
            targetId = decodedText.replace("NATERPAY:", "").trim();
        }

        processTransferUI(targetId.trim());
    }

    function manualPayInit() {
        Swal.fire({
            title: 'MANUAL ENTRY',
            text: 'Enter the receiver\'s NATERPAY ID or Phone Number',
            input: 'text',
            inputPlaceholder: 'e.g. 08012345678',
            background: '#111', color: '#fff', confirmButtonColor: '#d4af37',
            showCancelButton: true, cancelButtonColor: '#333'
        }).then((result) => {
            if (result.isConfirmed && result.value) {
                processTransferUI(result.value.trim());
            }
        });
    }

    async function processTransferUI(recipientId) {
        if(!recipientId) return;

        const { value: formValues } = await Swal.fire({
            title: 'SEND MONEY',
            html: `
                <div style="text-align:left;">
                    <p style="color:#aaa; font-size:0.9rem; margin-bottom:5px;">Recipient ID:</p>
                    <div style="background:#222; padding:10px; border-radius:8px; color:var(--gold); font-weight:bold; margin-bottom:15px; font-family:monospace;">${recipientId}</div>
                    
                    <p style="color:#aaa; font-size:0.9rem; margin-bottom:5px;">Amount (₦):</p>
                    <input id="swal-amount" class="swal2-input" type="number" placeholder="Enter Amount" min="100" style="margin:0 0 15px 0; width:100%;">
                    
                    <p style="color:#aaa; font-size:0.9rem; margin-bottom:5px;">Your 4-Digit PIN:</p>
                    <input id="swal-pin" class="swal2-input" type="password" placeholder="****" maxlength="4" style="margin:0; width:100%; letter-spacing: 5px; text-align:center; font-size: 1.5rem;">
                </div>
            `,
            focusConfirm: false,
            background: '#111', color: '#fff', confirmButtonColor: '#d4af37', confirmButtonText: 'CONFIRM TRANSFER <i class="fas fa-check ms-2"></i>',
            showCancelButton: true, cancelButtonColor: '#333',
            preConfirm: () => {
                return [ document.getElementById('swal-amount').value, document.getElementById('swal-pin').value ]
            }
        });

        if (formValues) {
            const amount = formValues[0];
            const pin = formValues[1];

            if(!amount || amount < 100 || !pin || pin.length !== 4) {
                Swal.fire({ icon: 'error', title: 'Invalid Entry', text: 'Minimum transfer is ₦100. PIN must be 4 digits.', background: '#111', color: '#fff', confirmButtonColor: '#d32f2f' });
                return;
            }

            executeTransfer(recipientId, amount, pin);
        }
    }

    async function executeTransfer(recipientId, amount, pin) {
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) { window.location.href = '/index.html'; return; }

        Swal.fire({ title: 'Processing...', html: '<span style="color: #aaa;">Authorizing ledger transfer...</span>', allowOutsideClick: false, didOpen: () => Swal.showLoading(), background: '#111', color: '#FFD700' });

        try {
            const res = await fetch('/api/wallet/transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ recipient: recipientId, amount: amount, pin: pin })
            });
            const data = await res.json();
            
            if (data.success) {
                const receiverName = data.recipientName || recipientId;
                Swal.fire({
                    icon: 'success', 
                    title: 'Transfer Complete!',
                    html: `You successfully sent <strong style="color: #FFD700;">₦${parseFloat(amount).toLocaleString()}</strong> to <br><span style="color: #00ff88; font-size: 1.1rem; font-weight: bold;">${receiverName}</span>.`,
                    confirmButtonColor: '#FFD700', background: '#111', color: '#FFFFFF'
                }).then(() => { window.location.href = 'dashboard.html'; });
            } else {
                Swal.fire({ icon: 'error', title: 'Transfer Failed', text: data.message, confirmButtonColor: '#FF3333', background: '#111', color: '#FFFFFF' });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Please check your connection to the server.', confirmButtonColor: '#FF3333', background: '#111', color: '#FFFFFF' });
        }
    }

    window.onload = () => { initStars(); fetchUserData(); checkUrlForPayment(); };
    window.onresize = initStars;
</script>
</body>
</html>
