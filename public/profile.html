<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Profile</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card-bg: rgba(20, 20, 20, 0.95); }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.98); border-bottom: 2.5px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-text { 
            font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; 
            text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start;
        }
        .site-part-1 { color: var(--gold); font-size: 1.4rem; } 
        .site-part-2 { color: #d32f2f; font-size: 1rem; letter-spacing: 3px; }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        
        .profile-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 20px;
            padding: 40px; margin-bottom: 30px;
        }
        
        .avatar-section {
            text-align: center; margin-bottom: 30px;
        }
        .avatar-circle {
            width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
            background: rgba(212,175,55,0.1);
        }
        .avatar-circle i { font-size: 3rem; color: var(--gold); }
        
        .input-group-custom {
            background: rgba(0,0,0,0.6); border: 1.5px solid rgba(212,175,55,0.35);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
        }
        .input-group-custom label {
            display: block; font-size: 0.75rem; color: var(--gold); font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
        }
        .input-group-custom input {
            background: transparent; border: none; color: white; width: 100%;
            font-size: 1.1rem; font-weight: 700; outline: none;
        }
        
        .btn-save {
            background: var(--gold); color: black; font-weight: 900; border-radius: 15px;
            padding: 18px; width: 100%; border: none; font-size: 1.1rem; letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-save:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
        
        .kyc-badge {
            padding: 8px 20px; border-radius: 50px; font-size: 0.8rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .kyc-0 { background: #ff4444; color: white; }
        .kyc-1 { background: #ffaa00; color: black; }
        .kyc-2 { background: #00ff88; color: black; }
        .kyc-3 { background: var(--gold); color: black; }

        .copy-btn {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 5px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s;
            font-size: 0.8rem; font-weight: bold;
        }
        .copy-btn:hover { background: var(--gold); color: black; }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4">Back to Dashboard</a>
</header>

<div class="container">
    <h1 class="text-center mb-4" style="font-family: 'Cinzel'; font-weight: 900; color: var(--gold);">PROFILE SETTINGS</h1>
    
    <div class="profile-card">
        <div class="avatar-section">
            <div class="avatar-circle">
                <i class="fas fa-user-shield"></i>
            </div>
            <h3 id="profileName" style="font-family: 'Cinzel'; color: var(--gold);">Loading...</h3>
            <div class="mt-2">
                <span class="kyc-badge kyc-0" id="kycBadge">UNVERIFIED</span>
            </div>
            <p class="text-muted mt-2" id="profileEmail">Loading...</p>
        </div>
        
        <form onsubmit="updateProfile(event)">
            <div class="input-group-custom">
                <label>FULL NAME</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>
            
            <div class="input-group-custom">
                <label>EMAIL ADDRESS (Cannot be changed)</label>
                <input type="email" id="email" placeholder="yourname@domain.com" readonly style="opacity: 0.6; cursor: not-allowed;">
            </div>
            
            <div class="input-group-custom">
                <label>PHONE NUMBER</label>
                <input type="tel" id="phone" placeholder="e.g. 08012345678">
            </div>
            
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="input-group-custom position-relative">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="mb-0">YOUR REFERRAL CODE</label>
                            <button type="button" class="copy-btn" onclick="copyReferralCode()"><i class="fas fa-copy"></i> COPY</button>
                        </div>
                        <input type="text" id="referralCode" readonly style="color: var(--gold); opacity: 1;">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group-custom">
                        <label>TOTAL REFERRALS</label>
                        <input type="text" id="referralCount" readonly style="opacity: 0.6;">
                    </div>
                </div>
            </div>
            
            <div class="input-group-custom">
                <label>ACCOUNT CREATED ON</label>
                <input type="text" id="createdAt" readonly style="opacity: 0.6;">
            </div>
            
            <button type="submit" class="btn-save">
                <i class="fas fa-save me-2"></i> SAVE CHANGES
            </button>
        </form>
    </div>
    
    <div class="text-center">
        <a href="security.html" class="btn btn-outline-warning rounded-pill px-4">
            <i class="fas fa-lock me-2"></i> Security Settings
        </a>
    </div>
    
    <div class="text-center text-muted small mt-4">
        <p class="mb-1">Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    function initStars() {
        const canvas = document.getElementById('starCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const stars = [];
        
        for(let i = 0; i < 150; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.shadowBlur = 8; ctx.shadowColor = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; s.y += s.v; if(s.y > canvas.height) s.y = -5;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    async function loadProfile() {
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            // Fetching the real data from the database
            const res = await fetch('/api/user/dashboard-data', {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const data = await res.json();
            
            if (data.success) {
                // Populate fields with REAL database values
                document.getElementById('profileName').innerText = data.userFullName || 'User';
                document.getElementById('profileEmail').innerText = data.userEmail || 'Not set';
                document.getElementById('fullName').value = data.userFullName || '';
                document.getElementById('email').value = data.userEmail || '';
                document.getElementById('phone').value = data.userPhone || '';
                
                // THE FIX: Pulling the actual database referral code
                document.getElementById('referralCode').value = data.referralCode || 'NO_CODE_FOUND';
                document.getElementById('referralCount').value = data.referralCount || 0;
                
                // THE FIX: Pulling the actual registration date from the database
                const joinedDate = data.createdAt ? new Date(data.createdAt).toLocaleDateString() : 'Unknown';
                document.getElementById('createdAt').value = joinedDate;
                
                const kycLevel = data.kycLevel || 0;
                const kycBadge = document.getElementById('kycBadge');
                kycBadge.className = 'kyc-badge';
                if (kycLevel === 0) {
                    kycBadge.classList.add('kyc-0');
                    kycBadge.innerText = 'UNVERIFIED';
                } else if (kycLevel === 1) {
                    kycBadge.classList.add('kyc-1');
                    kycBadge.innerText = 'LEVEL 1';
                } else if (kycLevel === 2) {
                    kycBadge.classList.add('kyc-2');
                    kycBadge.innerText = 'LEVEL 2';
                } else {
                    kycBadge.classList.add('kyc-3');
                    kycBadge.innerText = 'LEVEL 3';
                }
            }
        } catch (e) {
            console.error('Failed to load profile details from server.', e);
        }
    }
    
    async function updateProfile(event) {
        event.preventDefault();
        
        const name = document.getElementById('fullName').value;
        const phone = document.getElementById('phone').value;
        
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) {
            window.location.href = '/index.html';
            return;
        }
        
        try {
            Swal.fire({
                title: 'Saving...',
                text: 'Updating your profile securely...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                background: '#0a0a0a',
                color: '#fff'
            });
            
            const res = await fetch('/api/user/profile', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ name, phoneNumber: phone })
            });
            
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Profile Updated',
                    text: 'Your details have been saved successfully.',
                    confirmButtonColor: '#d4af37',
                    background: '#0a0a0a',
                    color: '#fff'
                });
                loadProfile(); // Reload to reflect changes globally
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Update Failed',
                    text: data.message,
                    confirmButtonColor: '#d32f2f',
                    background: '#0a0a0a',
                    color: '#fff'
                });
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Update Error',
                text: 'Unable to connect to the server. Please try again.',
                confirmButtonColor: '#d32f2f',
                background: '#0a0a0a',
                color: '#fff'
            });
        }
    }

    // Added a quick copy button so users can easily share their real code
    function copyReferralCode() {
        const refCode = document.getElementById('referralCode').value;
        if(refCode && refCode !== 'NO_CODE_FOUND') {
            navigator.clipboard.writeText(refCode).then(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Copied!',
                    text: 'Your referral code is ready to share.',
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 2000,
                    background: '#111',
                    color: '#fff'
                });
            });
        }
    }
    
    window.onload = () => {
        initStars();
        loadProfile();
    };
</script>

</body>
</html>
