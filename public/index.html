<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4661775522120249" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="dynamicTitle">NATER-PAY | Enterprise Production Ecosystem</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root { --red: #d32f2f; --gold: #d4af37; --bg: #050505; --panel-bg: rgba(10, 10, 10, 0.55); }
        html { scroll-behavior: smooth; background-color: black; }
        body { background: transparent; color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        header { position: sticky; top: 0; width: 100%; padding: 15px 5%; background: rgba(0, 0, 0, 0.98); border-bottom: 2.5px solid var(--gold); display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        
        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .site-part-1 { color: var(--gold); font-size: 1.8rem; } 
        .site-part-2 { color: var(--red); font-size: 1.4rem; letter-spacing: 3px; }

        .viewport-wrapper { flex: 1; display: flex; width: 100%; overflow: hidden; }
        .system-side { flex: 1.3; padding: 50px 70px; overflow-y: auto; }
        .auth-side { flex: 1; background: var(--panel-bg); backdrop-filter: blur(10px); padding: 45px; overflow-y: auto; }

        .slideshow-viewport { width: 100%; height: 260px; position: relative; border-radius: 30px; border: 1.5px solid rgba(212, 175, 55, 0.2); overflow: hidden; margin-bottom: 30px; }
        .slide-element { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; transition: opacity 0.8s; display: flex; align-items: center; padding: 40px; }
        .slide-element.active { opacity:1; }
        .slide-media-layer { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; opacity: 0.4; z-index:-1; }
        
        .btn-authorize { background: var(--gold); color: black; font-weight: 900; border-radius: 20px; padding: 20px; width: 100%; border: none; letter-spacing: 2px; text-transform: uppercase; }
        .input-group-custom { background: rgba(0,0,0,0.6); border: 1.5px solid rgba(212, 175, 55, 0.35); border-radius: 20px; padding: 15px 25px; margin-bottom: 20px; }
        input { background: transparent; border: none; color: white; width: 100%; font-size: 1.1rem; outline: none; }
        
        @media (max-width: 1100px) { .system-side { display: none; } }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text" id="siteBranding">
        <span class="site-part-1">NATER</span><span class="site-part-2">PAY</span>
    </div>
</header>

<div class="viewport-wrapper">
    <div class="system-side">
        <div class="slideshow-viewport" id="mediaSlideshowEngine">
            <div class="slide-element active">
                <div class="slide-text-overlay">
                    <h3>SECURE FINTECH ARCHITECTURE</h3>
                    <p>Processing wholesale telecoms, credit, and ledger actions.</p>
                </div>
            </div>
        </div>
        
        <div class="price-ticker" style="padding: 20px; border: 1px solid #333; border-radius: 20px;">
            <h6 class="text-warning mb-3 text-center">LIVE LIQUIDITY RATES (1GB)</h6>
            <div class="d-flex justify-content-around text-center">
                <div><small>MTN</small><div id="tickerMTN">₦...</div></div>
                <div><small>AIRTEL</small><div id="tickerAIRTEL">₦...</div></div>
            </div>
        </div>
    </div>

    <div class="auth-side" id="authSide">
        <h2 style="font-family:Cinzel;">AUTHORIZE</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group-custom">
                <label>EMAIL</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="input-group-custom">
                <label>SECURITY KEY</label>
                <input type="password" id="loginPass" required>
            </div>
            <button type="submit" class="btn-authorize">ACTIVATE SESSION</button>
        </form>
    </div>
</div>

<script>
    let applicationSlides = [];
    let activeSlidePointer = 0;

    // Fetch CMS and Branding Data
    async function syncDynamicBrandingAndRates() {
        try {
            const res = await fetch('/api/cms/homepage-data');
            const data = await res.json();
            if(data.success && data.data) {
                // Update Rates
                if(data.data.rates) {
                    document.getElementById('tickerMTN').innerText = `₦${data.data.rates.mtn || '215'}`;
                    document.getElementById('tickerAIRTEL').innerText = `₦${data.data.rates.airtel || '190'}`;
                }
            }
        } catch (e) { console.error("Sync failed"); }
    }

    // Fetch Slides dynamically
    async function deployMediaSlideshowEngine() {
        try {
            const res = await fetch('/api/slides');
            const dataResult = await res.json();
            if(dataResult.success && dataResult.slides) {
                applicationSlides = dataResult.slides;
                const slideViewport = document.getElementById('mediaSlideshowEngine');
                slideViewport.innerHTML = applicationSlides.map((s, i) => `
                    <div class="slide-element ${i === 0 ? 'active' : ''}">
                        <img src="${s.imageUrl}" class="slide-media-layer">
                        <div class="slide-text-overlay"><h3>${s.title}</h3></div>
                    </div>
                `).join('');
            }
        } catch (err) { console.warn("Slideshow streaming channel detached."); }
    }

    // Socket listeners for live CMS updates
    function initializeSocketConnection() {
        const socket = io();
        socket.on('cms_update', () => syncDynamicBrandingAndRates());
        socket.on('slides_refresh', () => deployMediaSlideshowEngine());
    }

    window.onload = () => {
        syncDynamicBrandingAndRates();
        deployMediaSlideshowEngine();
        initializeSocketConnection();
    };
</script>
</body>
</html>
