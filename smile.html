<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATER-PAY | Smile Network</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root { --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.4); --bg: #030303; --card-bg: rgba(15, 15, 15, 0.95); --smile-yellow: #FADB00; }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }

        header {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(10px);
        }

        .brand-text { font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; line-height: 0.85;}
        .site-part-1 { color: var(--gold); font-size: 1.6rem; text-shadow: 0 0 10px var(--gold-glow); } 
        .site-part-2 { color: #d32f2f; font-size: 1.1rem; letter-spacing: 3px; }

        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        
        .header-title { font-family: 'Cinzel', serif; color: var(--smile-yellow); font-weight: 900; text-align: center; margin-bottom: 30px; font-size: 2.2rem; text-shadow: 0 0 15px rgba(250, 219, 0, 0.4); }

        .balance-display {
            background: linear-gradient(145deg, #111 0%, #1a1a1a 100%); border: 2px solid var(--gold);
            border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px var(--gold-glow);
        }
        .balance-amount { font-family: 'Cinzel'; font-size: 2.5rem; color: var(--gold); font-weight: 900; text-shadow: 0 0 10px var(--gold-glow); margin-top: 5px; }

        .vtu-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 25px;
            padding: 40px 30px; margin-bottom: 30px; backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden;
        }
        .vtu-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, var(--smile-yellow), transparent); }

        .input-group-custom { background: #111; border: 1.5px solid #333; border-radius: 15px; padding: 15px 20px; margin-bottom: 20px; transition: 0.3s; }
        .input-group-custom:focus-within { border-color: var(--smile-yellow); box-shadow: 0 0 15px rgba(250, 219, 0, 0.2); }
        .input-group-custom label { display: block; font-size: 0.75rem; color: var(--gold); font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .input-group-custom input, .input-group-custom select { background: transparent; border: none; color: white; width: 100%; font-size: 1.2rem; font-weight: 700; outline: none; }
        .input-group-custom select option { background: #111; color: white; }

        .btn-pay {
            background: var(--smile-yellow); color: black; font-weight: 900; border-radius: 15px;
            padding: 20px; width: 100%; border: none; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s;
        }
        .btn-pay:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,255,255,0.2); }
        
        .loading-plans { text-align: center; color: var(--gold); font-weight: 700; font-size: 0.9rem; margin-top: -10px; margin-bottom: 20px; display: none; }

        /* SWEETALERT REFRACTIVE LOADER */
        .swal-reflective-spinner {
            position: relative; width: 100px; height: 100px; margin: 20px auto; border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(250, 219, 0, 0.1) 0%, rgba(255,255,255,0.9) 15%, var(--smile-yellow) 30%, rgba(250, 219, 0, 0.2) 50%, #cca300 70%, rgba(255,255,255,0.7) 85%, rgba(250, 219, 0, 0.1) 100%);
            animation: spinSwalReflect 2s linear infinite; box-shadow: 0 0 35px rgba(250, 219, 0, 0.35);
        }
        .swal-reflective-spinner::before {
            content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #0d0d0d 100%); border-radius: 50%; border: 1px solid rgba(250, 219, 0, 0.15); z-index: 1;
        }
        .swal-inner-icon {
            position: absolute; z-index: 2; top: 50%; left: 50%; font-size: 2.2rem; color: var(--smile-yellow);
            text-shadow: 0 0 15px var(--smile-yellow), 0 0 30px rgba(255,255,255,0.4); animation: counterSpinSwal 2s linear infinite;
        }
        @keyframes spinSwalReflect { 100% { transform: rotate(360deg); } }
        @keyframes counterSpinSwal { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <div class="brand-text">
        <span class="site-part-1">NATER</span>
        <span class="site-part-2">PAY</span>
    </div>
    <a href="dashboard.html" class="btn btn-outline-warning rounded-pill px-4 fw-bold"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
</header>

<div class="container">
    <div class="text-center">
        <h1 class="header-title"><i class="fas fa-wifi me-2"></i> SMILE NETWORK</h1>
    </div>
    
    <div class="balance-display">
        <small class="text-secondary fw-bold" style="letter-spacing: 2px;">SECURE WALLET BALANCE</small>
        <div class="balance-amount" id="walletBalance">₦0.00</div>
    </div>
    
    <div class="vtu-card">
        <div class="input-group-custom">
            <label>Smile Account ID / Phone Number</label>
            <input type="tel" id="smilePhone" placeholder="Enter Smile Number" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        
        <div class="loading-plans" id="plansLoader"><i class="fas fa-spinner fa-spin me-2"></i> Syncing Smile Plans...</div>

        <div class="input-group-custom">
            <label>Select Internet Plan</label>
            <select id="smilePlan" onchange="updateAmountDisplay()">
                <option value="">Awaiting network sync...</option>
            </select>
        </div>

        <div class="input-group-custom">
            <label>Amount to Pay (₦)</label>
            <input type="text" id="smileAmountDisplay" placeholder="0.00" readonly style="color: var(--smile-yellow);">
            <input type="hidden" id="smileAmountActual">
        </div>

        <div class="input-group-custom mt-4 border-warning">
            <label><i class="fas fa-lock me-1"></i> AUTHORIZATION PIN</label>
            <input type="password" id="transactionPin" placeholder="Enter 4-digit PIN" maxlength="4" style="letter-spacing: 10px; font-size: 1.5rem; text-align: center;">
        </div>
        
        <button class="btn-pay" onclick="processSmilePayment()">
            <i class="fas fa-bolt me-2"></i> RECHARGE ACCOUNT
        </button>
    </div>
    
    <div class="text-center text-muted small fw-bold mb-5">
        <p class="mb-1"><i class="fas fa-shield-alt"></i> End-to-End Encrypted via VTPass</p>
        <p>Secured by NATER-PAY Protocol v3.0</p>
    </div>
</div>

<script>
    let socket = null;
    let smilePlansData = {};

    function initStars() {
        const c = document.getElementById('starCanvas');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const ctx = c.getContext('2d');
        const stars = [];
        for(let i = 0; i < 100; i++) stars.push({ x: Math.random() * c.width, y: Math.random() * c.height, s: Math.random() * 2 + 1, v: Math.random() * 0.5 + 0.1, o: Math.random() });
        function animate() {
            ctx.clearRect(0, 0, c.width, c.height);
            stars.forEach(s => { ctx.globalAlpha = s.o; ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill(); s.y += s.v; if(s.y > c.height) s.y = -5; });
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    async function loadBalance() {
        const authToken = localStorage.getItem("naterpay_token");
        if (!authToken) { window.location.href = '/index.html'; return; }
        
        try {
            const res = await fetch('/api/user/dashboard-data', { headers: { 'Authorization': `Bearer ${authToken}` } });
            const data = await res.json();
            if (data.success) {
                const safeBal = data.balance?.$numberDecimal || data.balance || 0;
                document.getElementById('walletBalance').innerText = '₦' + Number(safeBal).toLocaleString(undefined, {minimumFractionDigits:2});
            }
        } catch (e) {}
    }

    async function fetchSmilePlans() {
        const token = localStorage.getItem("naterpay_token");
        const loader = document.getElementById('plansLoader');
        const select = document.getElementById('smilePlan');
        
        loader.style.display = 'block';
        select.innerHTML = '<option value="">Fetching live plans...</option>';
        select.disabled = true;

        try {
            // Because your VTU.js is fully dynamic, we simply request 'smile-direct'
            const response = await fetch('/api/vtu/variations?serviceID=smile-direct', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await response.json();
            
            if (data.success && data.variations.length > 0) {
                select.innerHTML = '<option value="">-- Choose a Smile Plan --</option>';
                data.variations.forEach(plan => {
                    smilePlansData[plan.variation_code] = plan.variation_amount;
                    select.innerHTML += `<option value="${plan.variation_code}">${plan.name}</option>`;
                });
                select.disabled = false;
            } else {
                select.innerHTML = '<option value="">Smile Network currently offline</option>';
            }
        } catch (error) {
            select.innerHTML = '<option value="">Failed to sync network</option>';
        } finally {
            loader.style.display = 'none';
        }
    }

    function updateAmountDisplay() {
        const code = document.getElementById('smilePlan').value;
        const display = document.getElementById('smileAmountDisplay');
        const actual = document.getElementById('smileAmountActual');

        if (code && smilePlansData[code]) {
            const amt = Number(smilePlansData[code]);
            display.value = amt.toLocaleString(undefined, {minimumFractionDigits: 2});
            actual.value = amt;
        } else {
            display.value = '';
            actual.value = '';
        }
    }

    async function processSmilePayment() {
        const phone = document.getElementById('smilePhone').value;
        const plan = document.getElementById('smilePlan').value;
        const amount = document.getElementById('smileAmountActual').value;
        const pin = document.getElementById('transactionPin').value;
        
        if (!phone || !plan || !amount) {
            return Swal.fire({ icon: 'error', title: 'Incomplete Details', text: 'Please enter account ID and select a plan.', background: '#111', color: '#fff', confirmButtonColor: '#d32f2f' });
        }
        if (pin.length !== 4) {
            return Swal.fire({ icon: 'error', title: 'Security Pin', text: 'Enter your 4-digit transaction PIN.', background: '#111', color: '#fff', confirmButtonColor: '#d32f2f' });
        }
        
        const authToken = localStorage.getItem("naterpay_token");
        
        Swal.fire({ 
            title: 'Authenticating...', 
            html: `<div class="swal-reflective-spinner"><i class="fas fa-satellite-dish swal-inner-icon"></i></div><span style="color:#aaa; font-weight:600; font-size:0.85rem;">Routing request to Smile Network...</span>`, 
            showConfirmButton: false, allowOutsideClick: false, background: '#0a0a0a', color: '#fff' 
        });
        
        try {
            // Your backend's dynamic nature allows it to route 'smile-direct' straight through the existing 'buyData' endpoint
            const res = await fetch('/api/vtu/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ phone: phone, network: 'smile-direct', plan: plan, amount: amount, pin: pin })
            });
            const data = await res.json();
            
            if (data.success) {
                Swal.fire({ icon: 'success', title: 'Recharge Successful!', text: `Smile account ${phone} credited instantly.`, confirmButtonColor: '#FADB00', background: '#111', color: '#fff' }).then(() => {
                    document.getElementById('smilePhone').value = '';
                    document.getElementById('smilePlan').value = '';
                    document.getElementById('smileAmountDisplay').value = '';
                    document.getElementById('smileAmountActual').value = '';
                    document.getElementById('transactionPin').value = '';
                    loadBalance();
                });
            } else {
                Swal.fire({ icon: 'error', title: 'Transaction Failed', text: data.message, confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Unable to connect to VTU Gateway.', confirmButtonColor: '#d32f2f', background: '#111', color: '#fff' });
        }
    }
    
    window.onload = () => { 
        initStars(); 
        loadBalance(); 
        fetchSmilePlans();
        
        try {
            socket = io(window.location.origin, { query: { token: localStorage.getItem("naterpay_token") } });
            socket.on('wallet:update', (data) => {
                const bal = data.balance?.$numberDecimal || data.balance;
                document.getElementById('walletBalance').innerText = '₦' + Number(bal).toLocaleString(undefined, {minimumFractionDigits: 2});
            });
        } catch(e) {}
    };
    window.onresize = initStars;
</script>
</body>
</html>
